<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#07100b" />
<title>rondo</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: #07100b;
    overflow: hidden; overscroll-behavior: none;
  }
  canvas { display: block; touch-action: none; }
  * { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

/* ===========================================================================
   rondo — tiki-taka as a one-thumb game.

   You never steer a player. You only choose where the ball goes. The
   opposition holds a ZONAL BLOCK that slides toward the ball with inertia,
   and only one or two defenders ever step out to press. Nobody chases.

   The block's lag is the whole game: the ball moves faster than the shape can
   reorganise, so passing drags them one way and opens a lane somewhere else.
   =========================================================================== */

const cv = document.getElementById('c');
const cx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1, SC = 1, OX = 0, OY = 0;

const FW = 640, FH = 1140;
const NET_TOP = 112;
const GOAL = { y: 212, x0: 190, x1: 450 };
const PITCH = { x0: 26, x1: 614, y1: 1116 };

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth; VH = window.innerHeight;
  cv.width = Math.max(1, VW * DPR); cv.height = Math.max(1, VH * DPR);
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
  SC = Math.min(VW / FW, VH / FH);
  OX = (VW - FW * SC) / 2;
  OY = (VH - FH * SC) / 2;
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const now = () => performance.now() / 1000;

const JUICE = { shake: 1, hitstop: 1, particles: 1, slowmo: 1, flash: 1 };

const C = {
  grassA: '#1e6035', grassB: '#1a5530', line: 'rgba(255,255,255,.45)',
  us: '#4fc3f7', usDark: '#1c7fb0',
  them: '#ff4d4d', themDark: '#a82020',
  gk: '#ffd54a', gkDark: '#c79a10',
  gold: '#ffd54a', good: '#5ff08a', warn: '#ffc857', bad: '#ff6b5b',
  ink: '#0d1a12',
};

/* ---------- tuning ---------- */

const STEP = 1 / 120;          // fixed timestep: preview and reality step identically
const PASS_SPEED = 690;
const INTERCEPT_R = 25;        // how close a defender must be to cut the ball out
const BLOCK_K = 2.3;           // how eagerly the shape slides toward the ball
const BLOCK_MAX = 205;         // ...and its speed ceiling. The gap between these is the game.
const DEF_SPEED = 232;
const PRESS_SPEED = 292;
const ATT_SPEED = 176;
const START_TIME = 75, TIME_PER_GOAL = 4, TIME_CAP = 90;

// defensive shape, relative to the block centre. dy > 0 is toward the ball.
const SLOTS = [
  { dx: -152, dy: 0 }, { dx: -52, dy: -6 }, { dx: 52, dy: -6 }, { dx: 152, dy: 0 },
  { dx: 0, dy: 118 },
];
// Two wide players give you a safe out; two forwards hunt the seams in the
// block. The seam runners are why a displaced block turns into a through ball.
const ATT_SLOTS = [
  { dx: -200, dy: 34, role: 'wide' },
  { dx: 200, dy: 34, role: 'wide' },
  { dx: -70, dy: -150, role: 'seam' },
  { dx: 90, dy: -156, role: 'seam' },
];
const DEEP_SLOT = { dx: 0, dy: 172, role: 'deep' };   // the pivot: your safe out

/* ============================================================ audio */

let AC = null, muted = false;
function actx() {
  if (!AC) { const K = window.AudioContext || window.webkitAudioContext; if (K) AC = new K(); }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, dur, type, vol, slide) {
  if (muted) return;
  const a = actx(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, a.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), a.currentTime + dur);
  g.gain.setValueAtTime(0, a.currentTime);
  g.gain.linearRampToValueAtTime(vol == null ? .1 : vol, a.currentTime + .008);
  g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur + .02);
}
function noise(dur, vol) {
  if (muted) return;
  const a = actx(); if (!a) return;
  const n = Math.max(1, Math.floor(a.sampleRate * dur));
  const buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(); s.buffer = buf;
  const g = a.createGain(); g.gain.value = vol || .12;
  s.connect(g); g.connect(a.destination); s.start();
}
const SFX = {
  // pass pitch rises with the move, so a long sequence literally sounds better
  pass: n => tone(300 + Math.min(12, n) * 26, .05, 'triangle', .05),
  recv: () => tone(200, .03, 'sine', .03),
  cut:  () => { noise(.09, .1); tone(150, .15, 'sawtooth', .08, 70); },
  shot: () => { noise(.06, .07); tone(220, .09, 'square', .06, 110); },
  save: () => { noise(.1, .11); tone(165, .14, 'sawtooth', .07, 85); },
  block:() => { noise(.09, .1); tone(140, .12, 'square', .07, 70); },
  post: () => { tone(1250, .16, 'sine', .12, 520); noise(.05, .08); },
  goal: n => {
    const b = [523, 659, 784, 988, 1175, 1319, 1568][Math.min(6, n)];
    tone(b, .1, 'triangle', .11);
    setTimeout(() => tone(b * 1.26, .1, 'triangle', .11), 70);
    setTimeout(() => tone(b * 1.5, .28, 'triangle', .11), 145);
    noise(.26, .07);
  },
  tick: hot => tone(hot ? 1550 : 1020, .05, 'square', .05),
  whistle: () => { tone(1750, .12, 'sine', .06, 2050); setTimeout(() => tone(1750, .22, 'sine', .06, 1500), 150); },
  over: () => { tone(400, .2, 'sawtooth', .09, 300); setTimeout(() => tone(300, .2, 'sawtooth', .09, 200), 180);
                setTimeout(() => tone(200, .5, 'sawtooth', .09, 120), 360); },
};

/* ============================================================ state */

let S = null;
let best = 0;
try { best = parseInt(localStorage.getItem('rondo.best') || '0', 10) || 0; } catch (e) {}
let seenHint = false;
try { seenHint = localStorage.getItem('rondo.hint') === '1'; } catch (e) {}

let screen = 'title';
let trauma = 0, freezeT = 0, timeScale = 1, flashT = 0, flashCol = '#fff';
let particles = [], pops = [], ripples = [];
let netWave = 0;

function newGame() {
  S = {
    t: START_TIME,
    score: 0, goals: 0, moves: 0, combo: 0, bestCombo: 0, bestMove: 0,
    phase: 'hold',            // hold | pass | shot | dead
    mates: [], foes: [], keeper: null,
    block: { x: FW / 2, y: GOAL.y + 300 },
    ball: { x: 0, y: 0, carrier: 0, from: null, to: null, tx: 0, ty: 0, t: 0, dur: 0, trail: [] },
    passes: 0, oneTouch: 0, press: 0, pressN: 1,
    heldSince: 0, deadT: 0, grace: 0,
    lastTick: 99,
    hint: !seenHint,
  };
  particles = []; pops = []; ripples = [];
  kickoff();
}

const level = () => Math.min(6, Math.floor(S.goals / 2));
// under a settled press you get less time on the ball
const graceTime = () => .58 - (S ? S.press : 0) * .3;

function kickoff() {
  // five of ours, five of theirs plus a keeper
  S.mates = [];
  const baseY = GOAL.y + 640;
  S.mates.push({ x: FW / 2, y: baseY, vx: 0, vy: 0, r: 20, slot: DEEP_SLOT, seamRank: 0 });
  let seamRank = 0;
  ATT_SLOTS.forEach(sl => S.mates.push({ x: clamp(FW / 2 + sl.dx, PITCH.x0 + 40, PITCH.x1 - 40),
                                         y: clamp(baseY + sl.dy, GOAL.y + 90, PITCH.y1 - 40),
                                         vx: 0, vy: 0, r: 20, slot: sl,
                                         seamRank: sl.role === 'seam' ? seamRank++ : 0 }));
  S.block.x = FW / 2; S.block.y = clamp(baseY - 175, GOAL.y + 85, GOAL.y + 560);
  S.foes = SLOTS.map(sl => ({ x: S.block.x + sl.dx, y: S.block.y + sl.dy, vx: 0, vy: 0, r: 20, slot: sl }));
  S.keeper = { x: FW / 2, y: GOAL.y + 26, r: 22, dive: 0 };

  S.ball.carrier = 0;
  S.ball.x = S.mates[0].x; S.ball.y = S.mates[0].y;
  S.ball.trail = [];
  S.phase = 'hold';
  S.passes = 0; S.oneTouch = 0; S.press = 0; S.pressN = 1;
  S.heldSince = 0;
  S.grace = .58;
  S.threat = null;
  S.moveTags = new Set();
}

/* ============================================================ the block

   Everything about the opposition lives here. It is deliberately a SHAPE with
   momentum, not a set of individuals with targets.
   ========================================================================= */

function blockK() { return BLOCK_K + level() * .13; }

function stepBlock(st, bx, by, h) {
  const k = blockK();
  const tx = clamp(bx, PITCH.x0 + 96, PITCH.x1 - 96);
  // Depth is a FRACTION of the ball's distance from goal, not a fixed standoff.
  // That way the block runs out of room to retreat as you come forward, and the
  // space behind it genuinely opens. A fixed standoff made the game a treadmill.
  const ty = clamp(GOAL.y + (by - GOAL.y) * .52, GOAL.y + 96, GOAL.y + 440);
  st.block.x += clamp((tx - st.block.x) * k, -BLOCK_MAX, BLOCK_MAX) * h;
  st.block.y += clamp((ty - st.block.y) * k, -BLOCK_MAX, BLOCK_MAX) * h;
}

// Pure stepper over {block, foes}: used by the live game AND by the pass
// preview, so what you are shown is exactly what will happen.
function stepFoes(st, ball, pressN, h) {
  stepBlock(st, ball.x, ball.y, h);

  const order = st.foes
    .map((f, i) => ({ i, d: dist(f.x, f.y, ball.x, ball.y) }))
    .sort((a, b) => a.d - b.d);
  const pressing = new Set(order.slice(0, pressN).map(o => o.i));

  // the shape narrows as the ball gets closer to goal
  const compress = clamp((ball.y - GOAL.y) / 520, .62, 1);

  for (let i = 0; i < st.foes.length; i++) {
    const f = st.foes[i];
    let tx, ty, sp;
    if (pressing.has(i)) {
      // step out and screen the ball from goal — not a chase, a closing-down
      const a = Math.atan2(GOAL.y - ball.y, FW / 2 - ball.x);
      tx = ball.x + Math.cos(a) * 36; ty = ball.y + Math.sin(a) * 36;
      sp = PRESS_SPEED;
    } else if (f.slot.dy > 50 && st.threat) {
      // the holding midfielder screens the lane from the ball to our most
      // advanced runner, rather than just standing in the middle
      tx = lerp(ball.x, st.threat.x, .5);
      ty = clamp(lerp(ball.y, st.threat.y, .5), st.block.y + 30, st.block.y + 190);
      sp = DEF_SPEED;
    } else {
      tx = st.block.x + f.slot.dx * compress;
      ty = st.block.y + f.slot.dy;
      sp = DEF_SPEED;
    }
    const dx = tx - f.x, dy = ty - f.y, d = Math.hypot(dx, dy);
    if (d > 1) {
      const v = Math.min(sp, d * 6);
      f.x += dx / d * v * h; f.y += dy / d * v * h;
    }
    f.x = clamp(f.x, PITCH.x0 + f.r, PITCH.x1 - f.r);
    f.y = clamp(f.y, GOAL.y + 10, PITCH.y1 - f.r);
  }
}

// a throwaway copy for lookahead
function threatPoint() {
  let t = null;
  for (let i = 0; i < S.mates.length; i++) {
    if (S.phase === 'hold' && i === S.ball.carrier) continue;
    const m = S.mates[i];
    if (!t || m.y < t.y) t = { x: m.x, y: m.y };
  }
  return t;
}
function snapshot() {
  return {
    block: { x: S.block.x, y: S.block.y },
    threat: S.threat,
    foes: S.foes.map(f => ({ x: f.x, y: f.y, r: f.r, slot: f.slot })),
  };
}

/* ============================================================ passing */

// Simulate a pass all the way and report what happens. Because the game runs on
// a fixed timestep and this shares stepFoes, the preview cannot lie.
function evalPass(fromX, fromY, target) {
  const st = snapshot();
  const dx = target.x - fromX, dy = target.y - fromY;
  const len = Math.hypot(dx, dy) || 1;
  const dur = len / PASS_SPEED;
  const ux = dx / len, uy = dy / len;
  const ball = { x: fromX, y: fromY };
  let tt = 0;
  while (tt < dur) {
    const h = Math.min(STEP, dur - tt);
    tt += h;
    ball.x = fromX + ux * PASS_SPEED * tt;
    ball.y = fromY + uy * PASS_SPEED * tt;
    stepFoes(st, ball, S.pressN, h);
    for (let i = 0; i < st.foes.length; i++) {
      const f = st.foes[i];
      if (dist(f.x, f.y, ball.x, ball.y) < INTERCEPT_R + f.r * .5) {
        return { ok: false, by: i, at: { x: ball.x, y: ball.y }, t: tt, dur };
      }
    }
  }
  return { ok: true, at: { x: target.x, y: target.y }, t: dur, dur };
}

// how much a pass would drag the block sideways — used to teach "switch of play"
function switchGain(fromX, target) { return Math.abs(target.x - fromX); }

function passOptions() {
  if (S.phase !== 'hold') return [];
  const b = S.mates[S.ball.carrier];
  const out = [];
  for (let i = 0; i < S.mates.length; i++) {
    if (i === S.ball.carrier) continue;
    const m = S.mates[i];
    out.push({ i, m, res: evalPass(b.x, b.y, m) });
  }
  return out;
}

function doPass(i) {
  if (S.phase !== 'hold') return;
  const b = S.mates[S.ball.carrier];
  const m = S.mates[i];
  const res = evalPass(b.x, b.y, m);
  const quick = (now() - S.heldSince) < .5;

  S.ball.from = S.ball.carrier;
  S.ball.to = i;
  S.ball.sx = b.x; S.ball.sy = b.y;
  S.ball.tx = m.x; S.ball.ty = m.y;
  S.ball.t = 0;
  S.ball.dur = res.dur;
  S.ball.res = res;
  S.ball.quick = quick;
  S.ball.trail = [];
  S.phase = 'pass';
  S.ball.carrier = -1;

  if (switchGain(b.x, m) > 235) S.moveTags.add('SWITCH');
  if (m.y < lastLineY() - 6) S.moveTags.add('THROUGH BALL');
  if (quick) S.oneTouch++;
  SFX.pass(S.passes);
  S.hint = false;
  if (!seenHint) { seenHint = true; try { localStorage.setItem('rondo.hint', '1'); } catch (e) {} }
}

// y of the deepest outfield defender — used to spot a ball played in behind
function lastLineY() {
  let y = 1e9;
  for (const f of S.foes) y = Math.min(y, f.y);
  return y;
}

/* ============================================================ shooting */

function shotTargets() {
  const pts = [];
  for (let i = 0; i <= 8; i++) pts.push({ x: lerp(GOAL.x0 + 16, GOAL.x1 - 16, i / 8), y: GOAL.y });
  return pts;
}

// A shot is a pass at the goal, plus the keeper. Same stepper again.
function evalShot(fromX, fromY, target) {
  const st = snapshot();
  const dx = target.x - fromX, dy = target.y - fromY;
  const len = Math.hypot(dx, dy) || 1;
  const speed = 900;
  const dur = len / speed;
  const ux = dx / len, uy = dy / len;
  const ball = { x: fromX, y: fromY };
  let tt = 0, kx = S.keeper.x;
  while (tt < dur) {
    const h = Math.min(STEP, dur - tt);
    tt += h;
    ball.x = fromX + ux * speed * tt;
    ball.y = fromY + uy * speed * tt;
    stepFoes(st, ball, S.pressN, h);
    for (let i = 0; i < st.foes.length; i++) {
      const f = st.foes[i];
      if (dist(f.x, f.y, ball.x, ball.y) < INTERCEPT_R + f.r * .5) {
        return { ok: false, why: 'blocked', by: i, at: { x: ball.x, y: ball.y }, t: tt, dur };
      }
    }
    // keeper slides along its line toward the ball's x
    const kSpeed = 210 + level() * 26;
    kx += clamp((ball.x - kx) * 8, -kSpeed, kSpeed) * h;
    kx = clamp(kx, GOAL.x0 - 14, GOAL.x1 + 14);
    if (dist(kx, GOAL.y + 26, ball.x, ball.y) < 30 + level() * 1.2) {
      return { ok: false, why: 'saved', kx, at: { x: ball.x, y: ball.y }, t: tt, dur };
    }
  }
  return { ok: true, at: { x: target.x, y: target.y }, t: dur, dur, kx };
}

function doShot(target) {
  if (S.phase !== 'hold') return;
  const b = S.mates[S.ball.carrier];
  const res = evalShot(b.x, b.y, target);
  S.ball.from = S.ball.carrier;
  S.ball.sx = b.x; S.ball.sy = b.y;
  S.ball.tx = target.x; S.ball.ty = target.y;
  S.ball.t = 0; S.ball.dur = res.dur; S.ball.res = res;
  S.ball.trail = [];
  S.phase = 'shot';
  S.ball.carrier = -1;
  SFX.shot();
  addTrauma(.14);
  S.hint = false;
}

// Midpoints of the widest channels between defenders, edges included. The
// forwards stand in these, which is what "occupying the seam" means.
function seamXs() {
  const xs = S.foes.map(f => f.x).sort((a, b) => a - b);
  const edges = [PITCH.x0 + 30, ...xs, PITCH.x1 - 30];
  const gaps = [];
  for (let i = 0; i < edges.length - 1; i++) {
    gaps.push({ w: edges[i + 1] - edges[i], x: (edges[i] + edges[i + 1]) / 2 });
  }
  gaps.sort((a, b) => b.w - a.w);
  return gaps;
}

/* ============================================================ attackers

   They are not controlled and they do not chase. Each drifts toward the open
   space nearest its slot, which is what keeps passing options alive.
   ========================================================================= */

function stepMates(h) {
  const ballPos = S.phase === 'hold'
    ? S.mates[S.ball.carrier]
    : { x: S.ball.x, y: S.ball.y };

  for (let i = 0; i < S.mates.length; i++) {
    const m = S.mates[i];
    if (S.phase === 'hold' && i === S.ball.carrier) continue;   // the carrier holds still
    if (!m.slot) continue;

    let wantX, wantY;
    if (m.slot.role === 'seam') {
      // stand in an open channel, just beyond the last line
      const gaps = seamXs();
      const g = gaps[Math.min(m.seamRank, gaps.length - 1)] || gaps[0];
      wantX = clamp(g.x, PITCH.x0 + 46, PITCH.x1 - 46);
      wantY = clamp(lastLineY() - 14, GOAL.y + 84, ballPos.y - 70);
    } else {
      wantX = clamp(ballPos.x + m.slot.dx, PITCH.x0 + 46, PITCH.x1 - 46);
      wantY = clamp(ballPos.y + m.slot.dy, GOAL.y + 74, PITCH.y1 - 46);
    }

    // sample a few spots around the slot and take the most open one
    let bx = m.x, by = m.y, bs = -1e9;
    for (let s = 0; s < 9; s++) {
      const ang = s / 9 * TAU;
      const rad = s === 0 ? 0 : 62;
      const px = clamp(wantX + Math.cos(ang) * rad, PITCH.x0 + 46, PITCH.x1 - 46);
      const py = clamp(wantY + Math.sin(ang) * rad, GOAL.y + 74, PITCH.y1 - 46);
      let sc = 0;
      let near = 1e9;
      for (const f of S.foes) near = Math.min(near, dist(px, py, f.x, f.y));
      sc += Math.min(near, 150) * 1.4;               // stand where they are not
      sc -= dist(px, py, wantX, wantY) * .5;         // but keep your shape
      for (let j = 0; j < S.mates.length; j++) {
        if (j === i) continue;
        const d = dist(px, py, S.mates[j].x, S.mates[j].y);
        if (d < 110) sc -= (110 - d) * 1.1;          // do not bunch up
      }
      if (sc > bs) { bs = sc; bx = px; by = py; }
    }
    const dx = bx - m.x, dy = by - m.y, d = Math.hypot(dx, dy);
    if (d > 1) {
      const v = Math.min(ATT_SPEED, d * 3);
      m.x += dx / d * v * h; m.y += dy / d * v * h;
    }
  }
}

/* ============================================================ update */

function update(h) {
  if (screen !== 'play') return;

  S.t -= h;
  const whole = Math.ceil(S.t);
  if (whole !== S.lastTick && whole > 0 && whole <= 10) { S.lastTick = whole; SFX.tick(whole <= 5); }
  if (S.t <= 0) { S.t = 0; gameOver(); return; }

  if (S.keeper.dive > 0) S.keeper.dive -= h;

  if (S.phase === 'dead') {
    S.deadT -= h;
    if (S.deadT <= 0) kickoff();
    S.threat = threatPoint();
    stepFoes(S, S.ball, 1, h);
    return;
  }

  // pressure builds while you dwell, so the shape squeezes and a second
  // defender steps out. Urgency without anybody chasing you.
  if (S.phase === 'hold') {
    S.press = Math.min(1, S.press + h * (.32 + level() * .018));
    S.pressN = S.press > .62 ? 2 : 1;
  }

  S.threat = threatPoint();
  const ballPos = S.phase === 'hold' ? S.mates[S.ball.carrier] : S.ball;
  stepFoes(S, ballPos, S.pressN, h);
  stepMates(h);

  if (S.phase === 'hold') {
    const b = S.mates[S.ball.carrier];
    S.ball.x = b.x; S.ball.y = b.y;
    // a presser that actually reaches you wins it
    if (S.grace > 0) S.grace -= h;
    else for (const f of S.foes) {
      if (dist(f.x, f.y, b.x, b.y) < f.r + 16) { turnover(f, 'DISPOSSESSED'); return; }
    }
  } else if (S.phase === 'pass' || S.phase === 'shot') {
    S.ball.t += h;
    const k = Math.min(1, S.ball.t / Math.max(.0001, S.ball.dur));
    S.ball.x = lerp(S.ball.sx, S.ball.tx, k);
    S.ball.y = lerp(S.ball.sy, S.ball.ty, k);
    S.ball.trail.push({ x: S.ball.x, y: S.ball.y });
    if (S.ball.trail.length > 30) S.ball.trail.shift();

    const res = S.ball.res;
    if (!res.ok && S.ball.t >= res.t) {
      if (S.phase === 'pass') { turnover(S.foes[res.by], 'INTERCEPTED'); return; }
      if (res.why === 'blocked') { turnover(S.foes[res.by], 'BLOCKED'); return; }
      S.keeper.dive = .34;
      SFX.save();
      pop(S.keeper.x, S.keeper.y - 46, 'SAVED!', '#ffffff');
      turnover(null, null); return;
    }
    if (k >= 1) {
      if (S.phase === 'pass') {
        S.ball.carrier = S.ball.to;
        S.phase = 'hold';
        S.passes++;
        S.bestMove = Math.max(S.bestMove, S.passes);
        S.heldSince = now();
        S.grace = graceTime();                  // your touch, before they can get at you
        S.press = Math.max(0, S.press - .075);  // moving it only partly relieves it
        SFX.recv();
        if (S.passes === 8) pop(S.ball.x, S.ball.y - 44, 'RONDO!', C.good);
      } else {
        scored();
      }
    }
  }
}

function turnover(by, label) {
  if (label) {
    SFX.cut();
    addTrauma(.32); hitstop(.05);
    pop(S.ball.x, S.ball.y - 42, label, C.bad);
    burst(S.ball.x, S.ball.y, '#ff9a8a', 16, 240);
  }
  S.combo = 0;
  S.phase = 'dead';
  S.deadT = .9;
  S.moves++;
}

function scored() {
  const passes = S.passes;
  let base = 100 + Math.min(12, passes) * 30;
  const tags = [];
  if (passes >= 8) tags.push('RONDO');
  for (const t of S.moveTags) tags.push(t);
  if (S.oneTouch >= 3) tags.push('ONE-TOUCH');
  base += (S.oneTouch >= 3 ? 80 : 0) + (S.moveTags.has('SWITCH') ? 70 : 0)
        + (S.moveTags.has('THROUGH BALL') ? 90 : 0);

  S.combo++;
  S.bestCombo = Math.max(S.bestCombo, S.combo);
  const mult = Math.min(9, S.combo);
  const gained = base * mult;
  S.score += gained;
  S.goals++;
  S.moves++;
  S.t = Math.min(TIME_CAP, S.t + TIME_PER_GOAL);

  SFX.goal(mult - 1);
  addTrauma(.7); hitstop(.1); flash('#ffffff', .12);
  timeScale = .32; netWave = 1;
  burst(S.ball.x, GOAL.y, '#ffffff', 40, 500);
  burst(S.ball.x, GOAL.y, C.gold, 24, 360);
  ripples.push({ x: S.ball.x, y: GOAL.y, r: 10, life: .7, max: .7 });
  pop(FW / 2, GOAL.y + 168, 'GOAL', C.gold, true);
  let y = GOAL.y + 250;
  pop(FW / 2, y, passes + (passes === 1 ? ' PASS' : ' PASSES'), C.good); y += 44;
  if (mult > 1) { pop(FW / 2, y, '×' + mult, C.good); y += 44; }
  for (const t of tags) { pop(FW / 2, y, t, '#ffffff'); y += 42; }
  pop(FW / 2, y, '+' + gained, C.gold);

  S.phase = 'dead';
  S.deadT = 1.2;
}

/* ============================================================ input */

function toLogical(px, py) {
  const r = cv.getBoundingClientRect();
  return [(px - r.left - OX) / SC, (py - r.top - OY) / SC];
}

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  actx();
  if (screen !== 'play') { start(); return; }
  if (S.phase !== 'hold') return;
  const [x, y] = toLogical(e.clientX, e.clientY);

  // tapping the goalmouth shoots at that spot
  if (y < GOAL.y + 40 && x > GOAL.x0 - 30 && x < GOAL.x1 + 30) {
    doShot({ x: clamp(x, GOAL.x0 + 10, GOAL.x1 - 10), y: GOAL.y });
    return;
  }
  // otherwise pass to the nearest teammate — generous radius, it is a phone
  let bi = -1, bd = 96;
  for (let i = 0; i < S.mates.length; i++) {
    if (i === S.ball.carrier) continue;
    const d = dist(x, y, S.mates[i].x, S.mates[i].y);
    if (d < bd) { bd = d; bi = i; }
  }
  if (bi >= 0) doPass(bi);
});

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'm') muted = !muted;
  if ((k === ' ' || k === 'enter') && screen !== 'play') { e.preventDefault(); actx(); start(); }
});

/* ============================================================ effects */

function addTrauma(t) { trauma = Math.min(1, trauma + t * JUICE.shake); }
function hitstop(t) { freezeT = Math.max(freezeT, t * JUICE.hitstop); }
function flash(col, t) { flashCol = col; flashT = Math.max(flashT, t * JUICE.flash); }
function burst(x, y, col, n, power) {
  n = Math.round(n * JUICE.particles);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = rnd(power * .3, power);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(.25, .7), max: .7, col, r: rnd(2, 5) });
  }
}
function pop(x, y, text, col, big) {
  pops.push({ x, y, text, col, life: big ? 1.3 : .95, max: big ? 1.3 : .95, big: !!big });
}
function stepEffects(rdt) {
  trauma = Math.max(0, trauma - rdt * 1.6);
  flashT = Math.max(0, flashT - rdt * 4);
  netWave = Math.max(0, netWave - rdt * 1.8);
  if (timeScale < 1) timeScale = Math.min(1, timeScale + rdt * 1.6);
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i]; q.life -= rdt;
    if (q.life <= 0) { particles.splice(i, 1); continue; }
    q.x += q.vx * rdt; q.y += q.vy * rdt;
    q.vx *= Math.exp(-3 * rdt); q.vy *= Math.exp(-3 * rdt);
  }
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].life -= rdt; if (pops[i].life <= 0) pops.splice(i, 1); }
  for (let i = ripples.length - 1; i >= 0; i--) {
    const q = ripples[i]; q.life -= rdt; q.r += rdt * 420;
    if (q.life <= 0) ripples.splice(i, 1);
  }
}

/* ============================================================ flow */

function start() {
  newGame(); screen = 'play';
  timeScale = 1; freezeT = 0; trauma = 0;
  SFX.whistle();
}
function gameOver() {
  screen = 'over';
  if (S.score > best) { best = S.score; try { localStorage.setItem('rondo.best', String(best)); } catch (e) {} }
  SFX.over(); addTrauma(.4);
}

/* ============================================================ render */

function rr(x, y, w, h, r) {
  cx.beginPath();
  if (cx.roundRect) cx.roundRect(x, y, w, h, r);
  else { cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r);
         cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }
}

function render() {
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx.fillStyle = '#07100b'; cx.fillRect(0, 0, VW, VH);
  const sh = trauma * trauma * 20;
  cx.setTransform(SC * DPR, 0, 0, SC * DPR,
    (OX + (Math.random() - .5) * sh * SC) * DPR,
    (OY + (Math.random() - .5) * sh * SC) * DPR);

  drawPitch();
  if (S) {
    drawLine();
    drawLanes();
    drawGoalBar();
    for (const f of S.foes) drawFoe(f);
    drawKeeper();
    for (let i = 0; i < S.mates.length; i++) drawMate(S.mates[i], i);
    drawBall();
  }
  drawParticles(); drawRipples(); drawPops();

  if (screen === 'play') { drawHUD(); if (S.hint) drawHint(); }
  if (screen === 'title') drawTitle();
  if (screen === 'over') drawOver();

  if (flashT > 0) {
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx.globalAlpha = Math.min(.6, flashT * 3);
    cx.fillStyle = flashCol; cx.fillRect(0, 0, VW, VH);
    cx.globalAlpha = 1;
  }
}

function drawPitch() {
  cx.fillStyle = C.grassA;
  cx.fillRect(PITCH.x0 - 26, NET_TOP - 20, (PITCH.x1 - PITCH.x0) + 52, (PITCH.y1 - NET_TOP) + 40);
  for (let y = GOAL.y; y < PITCH.y1 + 80; y += 84) {
    cx.fillStyle = ((y / 84) | 0) % 2 ? C.grassB : C.grassA;
    cx.fillRect(PITCH.x0 - 26, y, (PITCH.x1 - PITCH.x0) + 52, 84);
  }
  cx.strokeStyle = C.line; cx.lineWidth = 4;
  cx.strokeRect(PITCH.x0, GOAL.y, PITCH.x1 - PITCH.x0, PITCH.y1 - GOAL.y);
  cx.strokeRect(GOAL.x0 - 84, GOAL.y, (GOAL.x1 - GOAL.x0) + 168, 262);
  cx.strokeRect(GOAL.x0 - 28, GOAL.y, (GOAL.x1 - GOAL.x0) + 56, 104);
  cx.fillStyle = C.line;
  cx.beginPath(); cx.arc(FW / 2, GOAL.y + 196, 5, 0, TAU); cx.fill();
  cx.beginPath(); cx.arc(FW / 2, GOAL.y + 196, 98, .38, Math.PI - .38); cx.stroke();
  drawNet();
}

function drawNet() {
  const x0 = GOAL.x0, x1 = GOAL.x1, y0 = NET_TOP, y1 = GOAL.y;
  const bulge = netWave * 24;
  cx.fillStyle = 'rgba(255,255,255,.07)';
  cx.fillRect(x0, y0, x1 - x0, y1 - y0);
  cx.strokeStyle = 'rgba(255,255,255,.26)'; cx.lineWidth = 1.5;
  for (let x = x0; x <= x1 + .1; x += 22) {
    const off = Math.sin((x - x0) / (x1 - x0) * Math.PI) * bulge;
    cx.beginPath(); cx.moveTo(x, y0 - off * .4); cx.lineTo(x, y1); cx.stroke();
  }
  for (let y = y0; y <= y1 + .1; y += 22) { cx.beginPath(); cx.moveTo(x0, y); cx.lineTo(x1, y); cx.stroke(); }
  cx.strokeStyle = '#ffffff'; cx.lineWidth = 9; cx.lineJoin = 'round';
  cx.beginPath(); cx.moveTo(x0, y1); cx.lineTo(x0, y0); cx.lineTo(x1, y0); cx.lineTo(x1, y1); cx.stroke();
}

// A band across the back line: the thing you are trying to play through, and
// the gaps in it are the whole point, so make them visible.
function drawLine() {
  const back = S.foes.filter(f => f.slot.dy <= 50);
  if (back.length < 2) return;
  const xs = back.map(f => f.x), ys = back.map(f => f.y);
  const y = ys.reduce((a, b) => a + b, 0) / ys.length;
  cx.save();
  cx.globalAlpha = .13; cx.fillStyle = C.them;
  rr(Math.min(...xs) - 30, y - 26, (Math.max(...xs) - Math.min(...xs)) + 60, 52, 20); cx.fill();
  cx.globalAlpha = .3; cx.strokeStyle = C.them; cx.lineWidth = 2; cx.setLineDash([12, 10]);
  cx.beginPath(); cx.moveTo(PITCH.x0, y); cx.lineTo(PITCH.x1, y); cx.stroke();
  cx.restore();
}

function drawLanes() {
  if (S.phase !== 'hold') return;
  const b = S.mates[S.ball.carrier];
  for (const o of passOptions()) {
    const good = o.res.ok;
    cx.save();
    cx.globalAlpha = good ? .5 : .22;
    cx.strokeStyle = good ? C.good : C.bad;
    cx.lineWidth = good ? 4 : 3;
    cx.setLineDash(good ? [] : [8, 8]);
    cx.beginPath();
    cx.moveTo(b.x, b.y); cx.lineTo(o.m.x, o.m.y);   // always the full lane
    cx.stroke();
    cx.restore();
    if (!good) {
      cx.save();
      cx.globalAlpha = .8; cx.strokeStyle = C.bad; cx.lineWidth = 3;
      const p = o.res.at, s = 8;
      cx.beginPath();
      cx.moveTo(p.x - s, p.y - s); cx.lineTo(p.x + s, p.y + s);
      cx.moveTo(p.x + s, p.y - s); cx.lineTo(p.x - s, p.y + s);
      cx.stroke(); cx.restore();
    }
  }
}

// green segments across the mouth = the parts of the goal that are open right now
function drawGoalBar() {
  if (S.phase !== 'hold') return;
  const b = S.mates[S.ball.carrier];
  if (b.y > GOAL.y + 620) return;                 // too far out to bother
  const pts = shotTargets();
  const w = (GOAL.x1 - GOAL.x0) / pts.length;
  let any = false;
  for (const p of pts) {
    const r = evalShot(b.x, b.y, p);
    if (!r.ok) continue;
    any = true;
    cx.save();
    cx.globalAlpha = .8; cx.fillStyle = C.good;
    rr(p.x - w / 2 + 2, GOAL.y - 16, w - 4, 11, 5); cx.fill();
    cx.restore();
  }
  if (any) {
    cx.save();
    cx.globalAlpha = .3; cx.strokeStyle = C.good; cx.lineWidth = 3;
    cx.setLineDash([9, 9]);
    cx.beginPath(); cx.moveTo(b.x, b.y); cx.lineTo(FW / 2, GOAL.y + 10); cx.stroke();
    cx.restore();
  }
}

function shadowAt(x, y, r) {
  cx.fillStyle = 'rgba(0,0,0,.28)';
  cx.beginPath(); cx.ellipse(x, y + r * .74, r * .9, r * .32, 0, 0, TAU); cx.fill();
}

function drawFoe(f) {
  shadowAt(f.x, f.y, f.r);
  const g = cx.createLinearGradient(f.x, f.y - f.r, f.x, f.y + f.r);
  g.addColorStop(0, C.them); g.addColorStop(1, C.themDark);
  cx.fillStyle = g;
  cx.beginPath(); cx.arc(f.x, f.y, f.r, 0, TAU); cx.fill();
  cx.strokeStyle = 'rgba(0,0,0,.4)'; cx.lineWidth = 2.5;
  cx.beginPath(); cx.arc(f.x, f.y, f.r, 0, TAU); cx.stroke();
  // the interception radius, so cut passes never feel arbitrary
  cx.save();
  cx.globalAlpha = .12; cx.fillStyle = C.them;
  cx.beginPath(); cx.arc(f.x, f.y, INTERCEPT_R + f.r * .5, 0, TAU); cx.fill();
  cx.restore();
}

function drawKeeper() {
  const k = S.keeper;
  shadowAt(k.x, k.y, k.r);
  const st = k.dive > 0 ? 1 + k.dive * 1.4 : 1;
  cx.save();
  cx.translate(k.x, k.y); cx.scale(st, 1 / (st * .55 + .45));
  const g = cx.createLinearGradient(0, -k.r, 0, k.r);
  g.addColorStop(0, C.gk); g.addColorStop(1, C.gkDark);
  cx.fillStyle = g;
  cx.beginPath(); cx.arc(0, 0, k.r, 0, TAU); cx.fill();
  cx.strokeStyle = 'rgba(0,0,0,.4)'; cx.lineWidth = 2.5;
  cx.beginPath(); cx.arc(0, 0, k.r, 0, TAU); cx.stroke();
  cx.restore();
}

function drawMate(m, i) {
  const carrier = S.phase === 'hold' && i === S.ball.carrier;
  shadowAt(m.x, m.y, m.r);
  if (!carrier && S.phase === 'hold') {
    // tap target ring
    cx.save();
    cx.globalAlpha = .3 + .12 * Math.sin(now() * 3 + i);
    cx.strokeStyle = '#ffffff'; cx.lineWidth = 2;
    cx.beginPath(); cx.arc(m.x, m.y, m.r + 13, 0, TAU); cx.stroke();
    cx.restore();
  }
  if (carrier && S.grace > 0) {
    cx.save();
    cx.globalAlpha = .55; cx.strokeStyle = C.good; cx.lineWidth = 3.5;
    cx.beginPath(); cx.arc(m.x, m.y, m.r + 8, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(S.grace / .58, 0, 1)); cx.stroke();
    cx.restore();
  }
  const g = cx.createLinearGradient(m.x, m.y - m.r, m.x, m.y + m.r);
  g.addColorStop(0, C.us); g.addColorStop(1, C.usDark);
  cx.fillStyle = g;
  cx.beginPath(); cx.arc(m.x, m.y, m.r, 0, TAU); cx.fill();
  cx.strokeStyle = carrier ? '#ffffff' : 'rgba(0,0,0,.4)';
  cx.lineWidth = carrier ? 3.5 : 2.5;
  cx.beginPath(); cx.arc(m.x, m.y, m.r, 0, TAU); cx.stroke();
}

function drawBall() {
  const b = S.ball;
  if (b.trail.length > 1) {
    cx.save(); cx.lineCap = 'round';
    for (let i = 1; i < b.trail.length; i++) {
      const k = i / b.trail.length;
      cx.globalAlpha = k * .5; cx.strokeStyle = '#ffffff'; cx.lineWidth = 1 + k * 8;
      cx.beginPath(); cx.moveTo(b.trail[i - 1].x, b.trail[i - 1].y); cx.lineTo(b.trail[i].x, b.trail[i].y); cx.stroke();
    }
    cx.restore();
  }
  const r = 12;
  cx.fillStyle = 'rgba(0,0,0,.3)';
  cx.beginPath(); cx.ellipse(b.x, b.y + 9, r * .9, r * .34, 0, 0, TAU); cx.fill();
  cx.fillStyle = '#ffffff';
  cx.beginPath(); cx.arc(b.x, b.y, r, 0, TAU); cx.fill();
  cx.fillStyle = C.ink;
  cx.beginPath(); cx.arc(b.x, b.y, r * .32, 0, TAU); cx.fill();
  for (let i = 0; i < 4; i++) {
    const a = i / 4 * TAU + now();
    cx.beginPath(); cx.arc(b.x + Math.cos(a) * r * .6, b.y + Math.sin(a) * r * .6, r * .17, 0, TAU); cx.fill();
  }
}

function drawParticles() {
  for (const q of particles) {
    cx.globalAlpha = Math.max(0, q.life / q.max); cx.fillStyle = q.col;
    cx.beginPath(); cx.arc(q.x, q.y, q.r, 0, TAU); cx.fill();
  }
  cx.globalAlpha = 1;
}
function drawRipples() {
  for (const q of ripples) {
    cx.globalAlpha = Math.max(0, q.life / q.max) * .6;
    cx.strokeStyle = '#ffffff'; cx.lineWidth = 6;
    cx.beginPath(); cx.arc(q.x, q.y, q.r, 0, TAU); cx.stroke();
  }
  cx.globalAlpha = 1;
}
function drawPops() {
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  for (const q of pops) {
    const t = 1 - q.life / q.max;
    const rise = t * (q.big ? 26 : 42);
    const sc = q.big ? 1 + Math.max(0, .35 - t) * 1.6 : 1;
    cx.globalAlpha = Math.min(1, q.life * 3.5);
    cx.save();
    cx.translate(q.x, q.y - rise); cx.scale(sc, sc);
    cx.font = (q.big ? '900 84px ' : '800 30px ') + 'system-ui, -apple-system, sans-serif';
    cx.lineWidth = q.big ? 10 : 6; cx.strokeStyle = 'rgba(0,0,0,.65)';
    cx.strokeText(q.text, 0, 0);
    cx.fillStyle = q.col; cx.fillText(q.text, 0, 0);
    cx.restore();
  }
  cx.globalAlpha = 1;
}

function drawHUD() {
  const pad = 22;
  cx.textBaseline = 'middle';
  const hot = S.t <= 10;
  const pulse = hot ? 1 + Math.max(0, .12 - (S.t % 1) * .12) * 2 : 1;
  cx.save();
  cx.translate(FW / 2, 50); cx.scale(pulse, pulse);
  cx.textAlign = 'center';
  cx.font = '900 56px system-ui, -apple-system, sans-serif';
  cx.lineWidth = 9; cx.strokeStyle = 'rgba(0,0,0,.6)';
  const ts = S.t.toFixed(1);
  cx.strokeText(ts, 0, 0);
  cx.fillStyle = hot ? '#ff5b4d' : '#ffffff';
  cx.fillText(ts, 0, 0);
  cx.restore();

  cx.textAlign = 'left';
  cx.font = '800 36px system-ui, -apple-system, sans-serif';
  cx.lineWidth = 7; cx.strokeStyle = 'rgba(0,0,0,.6)';
  cx.strokeText(String(S.score), pad, 42);
  cx.fillStyle = C.gold; cx.fillText(String(S.score), pad, 42);
  if (S.combo > 1) {
    const sw = cx.measureText(String(S.score)).width;
    cx.font = '800 26px system-ui, sans-serif';
    cx.strokeText('×' + Math.min(9, S.combo), pad + sw + 12, 44);
    cx.fillStyle = C.good; cx.fillText('×' + Math.min(9, S.combo), pad + sw + 12, 44);
  }
  cx.font = '600 15px system-ui, sans-serif';
  cx.fillStyle = 'rgba(255,255,255,.6)';
  cx.fillText('BEST ' + best, pad, 70);

  // pass counter — the thing you are trying to grow
  cx.textAlign = 'right';
  cx.font = '800 36px system-ui, -apple-system, sans-serif';
  cx.lineWidth = 7; cx.strokeStyle = 'rgba(0,0,0,.6)';
  cx.strokeText(String(S.passes), FW - pad, 42);
  cx.fillStyle = S.passes >= 8 ? C.good : '#ffffff';
  cx.fillText(String(S.passes), FW - pad, 42);
  cx.font = '600 15px system-ui, sans-serif';
  cx.fillStyle = 'rgba(255,255,255,.6)';
  cx.fillText('PASSES', FW - pad, 70);

  // press meter
  const w = FW - pad * 2;
  cx.fillStyle = 'rgba(255,255,255,.12)';
  rr(pad, 84, w, 6, 3); cx.fill();
  cx.fillStyle = S.pressN > 1 ? C.bad : C.warn;
  rr(pad, 84, w * S.press, 6, 3); cx.fill();
  if (S.pressN > 1) {
    cx.textAlign = 'center';
    cx.font = '800 15px system-ui, sans-serif';
    cx.fillStyle = C.bad;
    cx.fillText('DOUBLE PRESS', FW / 2, 104);
  }
}

function drawHint() {
  if (S.phase !== 'hold') return;
  cx.save();
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.font = '800 25px system-ui, -apple-system, sans-serif';
  cx.lineWidth = 7; cx.strokeStyle = 'rgba(0,0,0,.7)';
  const y = PITCH.y1 - 96;
  cx.strokeText('TAP A TEAMMATE TO PASS', FW / 2, y);
  cx.fillStyle = '#ffffff'; cx.fillText('TAP A TEAMMATE TO PASS', FW / 2, y);
  cx.font = '700 19px system-ui, sans-serif';
  cx.strokeText('green lane = on · tap the goal to shoot', FW / 2, y + 34);
  cx.fillStyle = 'rgba(255,255,255,.8)';
  cx.fillText('green lane = on · tap the goal to shoot', FW / 2, y + 34);
  cx.restore();
}

function veil(a) { cx.fillStyle = 'rgba(4,9,6,' + a + ')'; cx.fillRect(-2000, -2000, 6000, 6000); }

function drawTitle() {
  veil(.85);
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.save();
  cx.translate(FW / 2, 292 + Math.sin(now() * 2) * 6);
  cx.font = '900 116px system-ui, -apple-system, sans-serif';
  cx.lineWidth = 13; cx.strokeStyle = 'rgba(0,0,0,.7)';
  cx.strokeText('RONDO', 0, 0);
  const g = cx.createLinearGradient(0, -56, 0, 56);
  g.addColorStop(0, '#bfe8ff'); g.addColorStop(1, '#4fc3f7');
  cx.fillStyle = g; cx.fillText('RONDO', 0, 0);
  cx.restore();

  cx.font = '700 20px system-ui, sans-serif';
  cx.fillStyle = 'rgba(255,255,255,.72)';
  cx.fillText('PASS THEM OUT OF SHAPE', FW / 2, 372);

  cx.font = '600 18px system-ui, sans-serif';
  cx.fillStyle = 'rgba(255,255,255,.85)';
  const lines = [
    'You never run. You only choose the pass.',
    '',
    'They defend as a block, not as a chase.',
    'The shape slides toward the ball — but it lags.',
    'Move the ball faster than they reorganise and',
    'a lane opens somewhere else.',
    '',
    'Green lane = pass is on. Red = it gets cut.',
    'Tap the goal to shoot; green bars show what is open.',
    '',
    'More passes in a move = more points.',
    'But the press builds while you hold it.',
  ];
  let y = 428;
  for (const l of lines) { cx.fillText(l, FW / 2, y); y += 30; }

  if (best > 0) {
    cx.font = '800 28px system-ui, sans-serif';
    cx.fillStyle = C.gold; cx.fillText('BEST  ' + best, FW / 2, y + 18);
  }
  const a = .55 + .45 * Math.sin(now() * 4);
  cx.globalAlpha = a;
  cx.font = '900 32px system-ui, sans-serif';
  cx.fillStyle = '#ffffff';
  cx.fillText('TAP TO KICK OFF', FW / 2, 1010);
  cx.globalAlpha = 1;
}

function drawOver() {
  veil(.82);
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.font = '900 52px system-ui, sans-serif';
  cx.lineWidth = 10; cx.strokeStyle = 'rgba(0,0,0,.6)';
  cx.strokeText('FULL TIME', FW / 2, 320);
  cx.fillStyle = '#ffffff'; cx.fillText('FULL TIME', FW / 2, 320);

  cx.font = '900 116px system-ui, sans-serif';
  cx.lineWidth = 14; cx.strokeStyle = 'rgba(0,0,0,.6)';
  cx.strokeText(String(S.score), FW / 2, 444);
  cx.fillStyle = C.gold; cx.fillText(String(S.score), FW / 2, 444);

  const isBest = S.score >= best && S.score > 0;
  cx.font = '800 26px system-ui, sans-serif';
  cx.fillStyle = isBest ? C.good : 'rgba(255,255,255,.7)';
  cx.fillText(isBest ? 'NEW BEST!' : 'BEST  ' + best, FW / 2, 512);

  cx.font = '700 24px system-ui, sans-serif';
  cx.fillStyle = 'rgba(255,255,255,.85)';
  cx.fillText(S.goals + (S.goals === 1 ? ' GOAL' : ' GOALS'), FW / 2, 598);
  cx.fillText('LONGEST MOVE  ' + S.bestMove + ' PASSES', FW / 2, 636);
  cx.fillText('BEST STREAK  ' + S.bestCombo, FW / 2, 674);

  const a = .55 + .45 * Math.sin(now() * 4);
  cx.globalAlpha = a;
  cx.font = '900 30px system-ui, sans-serif';
  cx.fillStyle = '#ffffff';
  cx.fillText('TAP TO GO AGAIN', FW / 2, 830);
  cx.globalAlpha = 1;
}

/* ============================================================ loop

   Fixed timestep. The pass preview steps the same function with the same h,
   so what the lane colour promises is what actually happens.
   ========================================================================= */

let last = performance.now(), acc = 0;
function frame(t) {
  let rdt = (t - last) / 1000;
  last = t;
  rdt = Math.min(.1, rdt);
  if (freezeT > 0) freezeT -= rdt;
  else {
    acc += rdt * timeScale;
    let guard = 0;
    while (acc >= STEP && guard++ < 12) { update(STEP); acc -= STEP; }
  }
  stepEffects(rdt);
  render();
  requestAnimationFrame(frame);
}

newGame();
screen = 'title';
requestAnimationFrame(frame);
