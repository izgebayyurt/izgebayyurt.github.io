<title>burnbridge</title>

<style>
  /* Ink on paper, borrowed wholesale from tapa: the same page, the same ink,
     the same one-accent discipline. Travellers are the exception — a map with
     four parties on it needs four pigments — so they are chosen as printing
     inks of roughly equal weight rather than as screen colours. */
  :root {
    --pg:#ece9e1;            /* paper */
    --pi:#2a2730;            /* ink — a purple-black, not a neutral one */
    --pr:rgba(42,39,48,0.14);
    --pd:rgba(42,39,48,0.55);
    --pq:rgba(42,39,48,0.32);
    --pfaint:rgba(42,39,48,0.20);
    --t0:#c85f18;            /* vermilion */
    --t1:#2f6f8f;            /* steel */
    --t2:#7a5e9a;            /* violet */
    --t3:#5c7a3c;            /* olive */
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",ui-serif,Georgia,serif;
    --sans:"Geist",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  /* Night derived from paper rather than inverted: the ground keeps the purple
     bias, the ink goes warm chalk, and the pigments lift instead of flipping. */
  html[data-theme="night"] {
    --pg:#191519;
    --pi:#ded7c8;
    --pr:rgba(222,215,200,0.15);
    --pd:rgba(222,215,200,0.56);
    --pq:rgba(222,215,200,0.34);
    --pfaint:rgba(222,215,200,0.22);
    --t0:#ff8a4c;
    --t1:#5aa8c8;
    --t2:#a888c8;
    --t3:#8fb85e;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--pg); color:var(--pi);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
    user-select:none; -webkit-user-select:none; overscroll-behavior:none;
  }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; }
  button { font-family:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--t2); outline-offset:2px; }
  .serif { font-family:var(--serif); font-variant-numeric:tabular-nums; }
  .label { font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; color:var(--pd); font-weight:500; }

  /* ---------- top bar ---------- */
  #hud {
    flex:0 0 auto; padding:0 12px;
    padding-top:max(6px, env(safe-area-inset-top));
    border-bottom:1px solid var(--pr);
  }
  #hudTop { display:flex; align-items:center; gap:10px; min-height:44px; }
  .icon {
    width:30px; height:30px; display:grid; place-items:center;
    color:var(--pd); font-size:19px; line-height:1; cursor:pointer;
    background:none; border:0; padding:0; border-radius:8px; flex:0 0 auto;
  }
  .icon:active { background:var(--pr); }
  .icon[disabled] { opacity:0.3; }
  #lname { flex:1 1 auto; font-family:var(--serif); font-size:19px; font-weight:600; letter-spacing:-0.01em; }
  #tally { flex:0 0 auto; text-align:right; margin-right:2px; }
  #cost { font-family:var(--serif); font-size:19px; font-weight:600; line-height:1.05; font-variant-numeric:tabular-nums; }
  #cost.over { color:var(--t0); }
  #par { font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--pq); margin-top:1px; }

  /* traveller chips: legend and selector in one */
  #chips { display:flex; gap:6px; padding:0 2px 9px; overflow-x:auto; scrollbar-width:none; }
  #chips::after { content:''; flex:0 0 2px; }
  #chips::-webkit-scrollbar { display:none; }
  .chip {
    flex:0 0 auto; display:inline-flex; align-items:center; gap:6px;
    padding:5px 10px; border-radius:9px; cursor:pointer; line-height:1;
    background:none; border:1px solid var(--pr); color:var(--pd);
    font-size:11px; letter-spacing:0.04em;
  }
  .chip .ct { font-family:var(--serif); font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums; }
  .chip.on { border-color:currentColor; }
  .chip.done { opacity:0.42; }
  .chip.stuck { opacity:0.3; }
  .chip.neutral { border-style:dashed; cursor:default; }
  .chip canvas { display:block; width:13px; height:13px; }

  /* ---------- board ---------- */
  #board { flex:1 1 auto; position:relative; min-height:0; }
  #cv { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #hint {
    position:absolute; left:20px; right:20px; bottom:14px; text-align:center;
    font-size:12px; line-height:1.55; color:var(--pd); pointer-events:none;
    transition:opacity .4s;
  }
  #hint.gone { opacity:0; }
  #hint b { color:var(--pi); font-weight:600; }

  /* A card on the page, not a modal over it — the board stays playable. */
  #warn {
    position:absolute; left:12px; right:12px;
    bottom:max(12px, env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:10px;
    padding:11px 11px 11px 14px; border-radius:13px;
    background:var(--pg); border:1px solid var(--pr);
    box-shadow:0 8px 26px rgba(42,39,48,0.10);
    transition:opacity .3s, transform .3s;
  }
  html[data-theme="night"] #warn { box-shadow:0 8px 26px rgba(0,0,0,0.45); }
  #warn.gone { opacity:0; transform:translateY(8px); pointer-events:none; }
  #warnText { flex:1 1 auto; font-size:11.5px; line-height:1.5; color:var(--pd); }
  #warnText b { color:var(--pi); font-weight:600; }
  #warnGo {
    flex:0 0 auto; border:0; border-radius:9px; cursor:pointer;
    padding:8px 13px; background:var(--pi); color:var(--pg);
    font-size:11.5px; font-weight:600;
  }
  #warnGo:active { opacity:0.85; }
  #warnX { flex:0 0 auto; background:none; border:0; color:var(--pq); font-size:13px; cursor:pointer; padding:8px 4px; }

  /* ---------- screens ---------- */
  .screen {
    position:absolute; inset:0; z-index:5; background:var(--pg);
    display:flex; flex-direction:column; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:max(16px, env(safe-area-inset-top)) 22px max(22px, env(safe-area-inset-bottom));
  }
  .hidden { display:none !important; }

  .pbtn {
    display:block; width:100%; margin-top:9px; padding:14px; border-radius:12px; border:0;
    background:var(--pi); color:var(--pg); font-size:14.5px; font-weight:600; cursor:pointer;
  }
  .pbtn.ghost { background:transparent; color:var(--pd); font-weight:500; border:1px solid var(--pr); }
  .pbtn:active { opacity:0.85; }
  .row2 { display:flex; gap:9px; }

  /* ---------- menu ---------- */
  #menu { justify-content:center; }
  #menu .wrap { width:100%; max-width:360px; margin:0 auto; }
  .wordmark { font-family:var(--serif); font-size:40px; line-height:1; font-weight:600; letter-spacing:-0.015em; }
  .wordsub { margin-top:9px; margin-bottom:30px; }
  .homefoot { margin-top:26px; display:flex; gap:22px; }
  .homefoot button {
    background:none; border:0; padding:6px 0; cursor:pointer;
    font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--pd);
  }

  /* ---------- level index ---------- */
  #levels .idxh { display:flex; align-items:baseline; gap:10px; padding:2px 2px 6px; }
  #levels .idxh .t { font-family:var(--serif); font-size:23px; font-weight:600; }
  #levels .idxh .s { margin-left:auto; font-family:var(--serif); font-size:13.5px; color:var(--pq); font-variant-numeric:tabular-nums; }
  .actlabel { margin:20px 0 10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(72px, 1fr)); gap:9px; }
  .tile {
    border:1px solid var(--pr); border-radius:12px; background:none; cursor:pointer;
    padding:14px 6px 10px; display:flex; flex-direction:column; align-items:center; gap:7px;
  }
  .tile:active { background:var(--pr); }
  .tile .n { font-family:var(--serif); font-size:19px; font-weight:600; color:var(--pd); font-variant-numeric:tabular-nums; }
  .tile.solved .n { color:var(--pi); }
  .tile .st { display:flex; gap:3px; }
  .tile .st i { width:4px; height:4px; border-radius:50%; background:var(--pr); }
  .tile .st i.on { background:var(--pi); }
  .tile.locked { opacity:0.32; }
  .tile.mark .n { font-size:15px; color:var(--t2); }

  /* ---------- cards ---------- */
  .ov {
    position:absolute; inset:0; z-index:8; display:flex; align-items:center; justify-content:center;
    padding:22px; background:color-mix(in srgb, var(--pg) 82%, transparent);
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  }
  .card {
    width:100%; max-width:380px; background:var(--pg);
    border:1px solid var(--pr); border-radius:16px; padding:22px 20px; text-align:center;
    box-shadow:0 12px 40px rgba(42,39,48,0.12);
  }
  html[data-theme="night"] .card { box-shadow:0 12px 40px rgba(0,0,0,0.5); }
  .card h2 { margin:0 0 10px; font-family:var(--serif); font-size:22px; font-weight:600; }
  .card p { margin:0 0 14px; font-size:13px; color:var(--pd); line-height:1.65; }
  .card p.tight { margin-bottom:9px; }
  .card p b { color:var(--pi); font-weight:600; }
  .scoreline { display:flex; justify-content:center; gap:26px; margin:14px 0 16px; }
  .scoreline .v { font-family:var(--serif); font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; }
  .scoreline .k { font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--pq); margin-top:3px; }
  .marks { display:flex; justify-content:center; gap:7px; margin:2px 0 4px; }
  .marks i { width:7px; height:7px; border-radius:50%; background:var(--pr); }
  .marks i.on { background:var(--pi); }

  .howlist { text-align:left; font-size:13px; color:var(--pd); line-height:1.7; margin:0 0 16px; padding-left:17px; }
  .howlist li { margin-bottom:8px; }
  .howlist b { color:var(--pi); font-weight:600; }
  .key { display:flex; flex-direction:column; gap:9px; margin:0 0 16px; }
  .keyrow { display:flex; align-items:center; gap:12px; font-size:12px; color:var(--pd); text-align:left; }
  .keyrow canvas { flex:0 0 auto; }
</style>

  <div id="hud">

      <button id="warnX" aria-label="Dismiss">✕</button>
    </div>

    <div class="screen" id="menu">
      <div class="wrap">
        <div class="wordmark">Burnbridge</div>
        <div class="wordsub label">Every crossing burns the bridge</div>

        <div class="homefoot">

      </div>
    </div>

    <div class="screen hidden" id="levels">

      <div id="acts"></div>
    </div>

    <div class="ov hidden" id="ov"><div class="card" id="ovCard"></div></div>
  </div>
</div>

/* ============================================================
   Level construction
   ============================================================ */

function nDist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); }

function buildLevel(raw) {
  var nodes = raw.nodes.map(function (p) { return { x: p[0], y: p[1], claim: p[2] || 0 }; });
  var edges = raw.edges.map(function (e, i) { return { i: i, a: e[0], b: e[1], bow: 0 }; });

  var groups = {};
  edges.forEach(function (e) {
    var k = Math.min(e.a, e.b) + ':' + Math.max(e.a, e.b);
    (groups[k] = groups[k] || []).push(e);
  });
  Object.keys(groups).forEach(function (k) {
    var g = groups[k];
    if (g.length < 2) return;
    g.forEach(function (e, idx) { e.bow = (idx - (g.length - 1) / 2) * 0.075; });
  });

  var inc = nodes.map(function () { return []; });
  edges.forEach(function (e) { inc[e.a].push(e.i); inc[e.b].push(e.i); });

  var W = raw.starts.length;
  var lv = {
    id: raw.id, starts: raw.starts.slice(), W: W, hint: raw.hint || '',
    euler: !!raw.euler, interlude: !!raw.interlude, act: raw.act || 0,
    nodes: nodes, edges: edges, inc: inc
  };
  lv.claims = [];
  for (var w = 0; w < W; w++) lv.claims.push([]);
  nodes.forEach(function (n, i) { if (n.claim && n.claim <= W) lv.claims[n.claim - 1].push(i); });
  lv.full = (1 << nodes.length) - 1;
  lv.fullClaim = lv.claims.map(function (c) { return (1 << c.length) - 1; });
  lv.claimBit = lv.claims.map(function (c) {
    var m = {}; c.forEach(function (n, i) { m[n] = 1 << i; }); return m;
  });
  lv.total = edges.length;
  return lv;
}

/* ============================================================
   Solver

   Travellers share one pool of bridges, so a position is (where each
   one stands, which bridges are ash, which claims are settled).
   Islands reached need no separate tracking: crossing a bridge means
   standing on both its ends, so the visited set is always the starts
   plus the endpoints of every burnt bridge.

   Cost is the number of crossings, which makes the bound below exact
   rather than estimated — that is what keeps the after-every-move
   dead-position check instant.
   ============================================================ */

function popcount(x) { var c = 0; while (x) { x &= x - 1; c++; } return c; }

function solveFrom(lv, pos, burnt, vis, met, cap) {
  var N = lv.nodes.length, E = lv.edges.length, W = lv.W;
  var best = Infinity, expansions = 0, capped = false;
  var CAP = cap || 900000;
  var memo = new Map();

  // Travellers interact only through the shared pool of bridges, and bridges
  // are only ever consumed — so any solution can be replayed with traveller 0
  // walking its whole trail first, then traveller 1, and so on. Searching in
  // that canonical order finds exactly the same solutions while skipping every
  // equivalent interleaving, and it lets a finished traveller drop out of the
  // state entirely: only the one currently walking needs a position.
  var strideE = Math.pow(2, E);
  var metStride = [], span = 1;
  for (var w = 0; w < W; w++) { metStride.push(span); span *= (lv.fullClaim[w] + 1); }
  var metSpan = span;

  var M = met.slice();

  function dfs(turn, here, burnt, cost, vis) {
    var w, done = true;
    if (vis === lv.full) {
      for (w = 0; w < W; w++) if (M[w] !== lv.fullClaim[w]) { done = false; break; }
      if (done) { if (cost < best) best = cost; return; }
    }
    if (turn >= W) return;
    if (++expansions > CAP) { capped = true; return; }

    // A traveller we have already walked past will never move again, so any
    // claim of theirs still outstanding can never be settled.
    for (w = 0; w < turn; w++) if (M[w] !== lv.fullClaim[w]) return;

    // Every island still unreached needs a crossing to reach it, and every
    // unsettled claim needs its own traveller to arrive. Both bound the
    // number of bridges that must still burn.
    var unvisited = N - popcount(vis), unclaimed = 0;
    for (w = turn; w < W; w++) unclaimed += popcount(lv.fullClaim[w] & ~M[w]);
    if (cost + Math.max(unvisited, unclaimed) >= best) return;

    var mk = 0;
    for (w = 0; w < W; w++) mk += M[w] * metStride[w];
    var key = (((turn * N + here) * strideE) + burnt) * metSpan + mk;
    var prev = memo.get(key);
    if (prev !== undefined && prev <= cost) return;
    memo.set(key, cost);

    // Hand over to the next traveller...
    dfs(turn + 1, turn + 1 < W ? pos[turn + 1] : 0, burnt, cost, vis);
    if (capped) return;

    // ...or walk this one further.
    var list = lv.inc[here];
    for (var ii = 0; ii < list.length; ii++) {
      var ei = list[ii];
      if ((burnt >> ei) & 1) continue;
      var e = lv.edges[ei], nx = (e.a === here) ? e.b : e.a;
      var bit = lv.claimBit[turn][nx], oldM = M[turn];
      if (bit !== undefined) M[turn] = oldM | bit;
      dfs(turn, nx, burnt | (1 << ei), cost + 1, vis | (1 << nx));
      M[turn] = oldM;
      if (capped) return;
    }
  }

  dfs(0, pos[0], burnt, 0, vis);
  return { ok: best < Infinity, par: best, capped: capped };
}

function initialState(lv) {
  var vis = 0, met = [];
  for (var w = 0; w < lv.W; w++) {
    vis |= (1 << lv.starts[w]);
    var bit = lv.claimBit[w][lv.starts[w]];
    met.push(bit === undefined ? 0 : bit);
  }
  return { pos: lv.starts.slice(), burnt: 0, vis: vis, met: met };
}

function solveEuler(lv) {
  var N = lv.nodes.length, deg = new Array(N).fill(0);
  lv.edges.forEach(function (e) { deg[e.a]++; deg[e.b]++; });
  var odd = [];
  for (var u = 0; u < N; u++) if (deg[u] % 2 === 1) odd.push(u);
  var ok = (odd.length === 0 && deg[lv.starts[0]] > 0) ||
           (odd.length === 2 && odd.indexOf(lv.starts[0]) >= 0);
  return { ok: ok, par: lv.total, odd: odd, deg: deg };
}

function solveLevel(lv, cap) {
  if (lv.euler) return solveEuler(lv);
  var s = initialState(lv);
  return solveFrom(lv, s.pos, s.burnt, s.vis, s.met, cap || 2000000);
}

/* ============================================================
   The obvious line — used to reject boards that solve themselves.
   Each traveller steps toward whatever it still owes: its own
   unclaimed island first, then any island nobody has reached.
   ============================================================ */

function greedyPlay(lv) {
  var burnt = {}, pos = lv.starts.slice(), cost = 0, W = lv.W;
  var vis = {}, met = [];
  for (var w0 = 0; w0 < W; w0++) {
    met.push({});
    vis[pos[w0]] = 1;
    if (lv.nodes[pos[w0]].claim === w0 + 1) met[w0][pos[w0]] = 1;
  }
  function done() {
    for (var i = 0; i < lv.nodes.length; i++) if (!vis[i]) return false;
    for (var w = 0; w < W; w++)
      for (var k = 0; k < lv.claims[w].length; k++) if (!met[w][lv.claims[w][k]]) return false;
    return true;
  }
  for (var step = 0; step < 120; step++) {
    if (done()) return { won: true, cost: cost };
    var bestMove = null;
    for (var w = 0; w < W; w++) {
      var here = pos[w];
      for (var j = 0; j < lv.inc[here].length; j++) {
        var ei = lv.inc[here][j];
        if (burnt[ei]) continue;
        var e = lv.edges[ei], nx = (e.a === here) ? e.b : e.a;
        var rank = 2;
        if (lv.nodes[nx].claim === w + 1 && !met[w][nx]) rank = 0;
        else if (!vis[nx]) rank = 1;
        if (!bestMove || rank < bestMove.rank) bestMove = { w: w, ei: ei, nx: nx, rank: rank };
      }
    }
    if (!bestMove) return { won: false, cost: cost, stranded: true };
    burnt[bestMove.ei] = 1; cost += 1;
    pos[bestMove.w] = bestMove.nx;

  // several of them is unsolvable no matter how it is walked. Give every such

}

    for (var i = 0; i < 5; i++) {
      var ang = -Math.PI / 2 + i * TAU / 5;
      var px = x + Math.cos(ang) * size * 1.06, py = y + Math.sin(ang) * size * 1.06;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }
}

/* An island is blank paper until someone stands on it, then it is inked in.
   Reaching every island is the goal, so that is the loudest thing on the page:
   the board fills with ink as it is solved. */
function drawNode(i) {
  var n = G.lv.nodes[i], x = PX(n), y = PY(n);
  var visited = !!((G.vis >> i) & 1);
  var claim = n.claim, settled = false;
  if (claim && claim <= G.lv.W) {
    var ci = G.lv.claims[claim - 1].indexOf(i);
    settled = !!((G.met[claim - 1] >> ci) & 1);
  }

  ctx.beginPath(); ctx.arc(x, y, R, 0, TAU);
  if (visited) {
    ctx.fillStyle = INK.ink; ctx.fill();
  } else {
    ctx.fillStyle = INK.paper; ctx.fill();
    ctx.lineWidth = 1.8; ctx.strokeStyle = inkA(0.5); ctx.stroke();
  }

  if (claim) {
    var w = claim - 1, r2 = R * 0.66;
    ctx.beginPath(); ctx.arc(x, y, r2, 0, TAU);
    ctx.fillStyle = INK.paper; ctx.fill();
    if (settled) {
      claimShape(x, y, w, r2 * 0.72);
      ctx.fillStyle = INK.team[w]; ctx.fill();
    } else {
      claimShape(x, y, w, r2 * 0.7);
      ctx.strokeStyle = INK.team[w]; ctx.lineWidth = 1.9; ctx.stroke();
    }
  }

  if (G.revealOdd && G.oddInfo && G.oddInfo.deg) {
    var d = G.oddInfo.deg[i], odd = d % 2 === 1;
    ctx.font = '600 13px ' + SERIF;
    ctx.fillStyle = odd ? INK.team[0] : inkA(0.4);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(d), x, y - R - 15);
  }
}

/* The traveller is a ring outside the island — never an outline of the island
   itself, which already means "not yet reached". Rings nest so several
   travellers standing together stay countable. */
function drawWalker(w) {
  var n = G.lv.nodes[G.pos[w]], x = PX(n), y = PY(n);
  var isSel = (G.sel === w) && G.lv.W > 1;
  var stuck = !canMove(w);
  var rad = R + 5.5 + w * 4.4;
  ctx.save();
  // A hairline of bare paper first, so the ring never merges into an inked island.
  ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU);
  ctx.lineWidth = (isSel ? 3.4 : 2.2) + 2.4;
  ctx.strokeStyle = INK.paper;
  ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU);
  ctx.lineWidth = isSel ? 3.4 : 2.2;
  ctx.strokeStyle = INK.team[w];
  ctx.globalAlpha = stuck ? 0.3 : (isSel ? 1 : 0.8);
  ctx.stroke();
  ctx.restore();
}

var warnOn = false, warnBack = -1;
function updateWarn() {
  var show = warnDue() && G.warnDismissed !== G.deadAt;
  var back = show ? (G.used.length - G.deadAt + 1) : -1;
  if (show === warnOn && back === warnBack) return;
  warnOn = show; warnBack = back;
  $('warn').classList.toggle('gone', !show);
  if (show) {
    hideHint();
    $('warnText').innerHTML = 'This board <b>can no longer be finished</b> — the crossing that lost it was ' +
      back + ' move' + (back === 1 ? '' : 's') + ' back.';
    $('warnGo').textContent = 'Rewind ' + back;
  }
}

function frame(ts) {
  G.t = ts || 0;
  updateWarn();
  drawPaper();
  if (G.lv && G.screen === 'play') {
    var reach = {};
    if (!G.overlay) availableFrom(G.pos[G.sel]).forEach(function (ei) { reach[ei] = true; });

    // On the solve, the spans nobody took fade off the page, leaving the routes
    // and the inked islands behind — the map, finished.
    var fade = G.solvedAt ? clamp(1 - (G.t - G.solvedAt) / 900, 0, 1) : 1;

    G.lv.edges.forEach(function (e) { if (!G.burnt[e.i] && !reach[e.i]) drawStanding(e, fade); });
    G.used.forEach(drawBurnt);
    G.lv.edges.forEach(function (e) {
      if (!G.burnt[e.i] && reach[e.i]) {
        if (fade < 1) drawStanding(e, fade); else drawReachable(e, G.sel);
      }
    });
    for (var i = 0; i < G.lv.nodes.length; i++) drawNode(i);
    for (var k = G.lv.W - 1; k >= 0; k--) if (k !== G.sel) drawWalker(k);
    if (G.lv.W > 1) drawWalker(G.sel);
  }
  requestAnimationFrame(frame);
}

/* ============================================================
   Input
   ============================================================ */

var press = null;

function localPt(ev) {
  var r = cv.getBoundingClientRect();
  return [ev.clientX - r.left, ev.clientY - r.top];
}
function nodeHit(px, py) {
  var bestI = -1, bestD = R * 2.2;
  for (var i = 0; i < G.lv.nodes.length; i++) {
    var n = G.lv.nodes[i], d = Math.hypot(px - PX(n), py - PY(n));
    if (d < bestD) { bestD = d; bestI = i; }
  }
  return bestI;
}
function walkerHit(px, py) {
  var best = -1, bd = R * 2.4;
  for (var w = 0; w < G.lv.W; w++) {
    var n = G.lv.nodes[G.pos[w]], d = Math.hypot(px - PX(n), py - PY(n));
    // Prefer the selected traveller when several share an island.
    if (d < bd - (w === G.sel ? 3 : 0)) { bd = d; best = w; }
  }
  return best;
}
function edgeFor(w, target, px, py) {
  var opts = availableFrom(G.pos[w]).filter(function (ei) {
    var e = G.lv.edges[ei];
    return e.a === target || e.b === target;
  });
  if (!opts.length) return -1;
  if (opts.length === 1) return opts[0];
  var best = opts[0], bd = Infinity;
  opts.forEach(function (ei) {
    var d = distToEdge(G.lv.edges[ei], px, py);
    if (d < bd) { bd = d; best = ei; }
  });
  return best;
}
function order(forceW) {
  if (forceW !== undefined) return [forceW];
  var o = [G.sel];
  for (var w = 0; w < G.lv.W; w++) if (w !== G.sel) o.push(w);
  return o;
}
function tryMove(px, py, forceW) {
  var hit = nodeHit(px, py);
  if (hit < 0) return false;
  var o = order(forceW);
  for (var k = 0; k < o.length; k++) {
    if (hit === G.pos[o[k]]) continue;
    var ei = edgeFor(o[k], hit, px, py);
    if (ei >= 0) return cross(o[k], ei);
  }
  return false;
}
function trySpan(px, py) {
  var o = order();
  for (var k = 0; k < o.length; k++) {
    var best = -1, bd = Math.max(16, R * 1.05);
    /* jshint loopfunc:true */
    availableFrom(G.pos[o[k]]).forEach(function (ei) {
      var d = distToEdge(G.lv.edges[ei], px, py);
      if (d < bd) { bd = d; best = ei; }
    });
    if (best >= 0) return cross(o[k], best);
  }
  return false;
}

cv.addEventListener('pointerdown', function (ev) {
  if (G.screen !== 'play' || G.overlay) return;
  var p = localPt(ev), w = walkerHit(p[0], p[1]);
  if (w >= 0) { G.sel = w; syncHud(); }
  press = { x: p[0], y: p[1], moved: 0, w: w >= 0 ? w : undefined };
  cv.setPointerCapture(ev.pointerId);
  hideHint();
  ev.preventDefault();
});
cv.addEventListener('pointermove', function (ev) {
  if (!press || G.screen !== 'play' || G.overlay) return;
  var p = localPt(ev);
  press.moved += Math.hypot(p[0] - press.x, p[1] - press.y);
  press.x = p[0]; press.y = p[1];
  // A drag that began on a traveller only ever moves that traveller.
  if (press.moved > 8 && tryMove(p[0], p[1], press.w)) press.w = G.sel;
  ev.preventDefault();
});
function endPress(ev) {
  if (!press) return;
  var p = localPt(ev);
  if (press.moved <= 8 && G.screen === 'play' && !G.overlay) {
    if (nodeHit(p[0], p[1]) !== G.pos[G.sel] || press.w === undefined) {
      if (!tryMove(p[0], p[1])) trySpan(p[0], p[1]);
    }
  }
  press = null;
}
cv.addEventListener('pointerup', endPress);
cv.addEventListener('pointercancel', function () { press = null; });

window.addEventListener('keydown', function (ev) {
  if (ev.key === 'z' || ev.key === 'Z') undo();
  if (ev.key === 'r' || ev.key === 'R') { G.undos = 0; resetLevel(); setOverlay(null); }
  if (ev.key === ' ' && G.lv && G.lv.W > 1) {
    G.sel = (G.sel + 1) % G.lv.W; syncHud(); ev.preventDefault();
  }
  if (G.lv && ev.key >= '1' && ev.key <= '4') {
    var w = +ev.key - 1;
    if (w < G.lv.W) { G.sel = w; syncHud(); }
  }
});

   HUD
   ============================================================ */

function syncHud() {
  var lv = G.lv;
  if (!lv) return;
  $('lname').textContent = (G.mode === 'drift')
    ? 'Drift ' + G.index
    : (lv.interlude ? 'Königsberg, 1736' : String(lv.no).padStart(2, '0'));
  $('cost').textContent = String(G.cost);
  $('cost').className = (!lv.euler && G.cost > G.par ? 'over' : '');
  $('par').textContent = lv.euler ? ('of ' + lv.edges.length) : ('par ' + G.par);
  $('bUndo').disabled = G.used.length === 0;

  var html = '';
  if (!lv.euler) {
    for (var w = 0; w < lv.W; w++) {
      var owed = lv.claims[w].length - popcount(G.met[w]);
      var cls = 'chip' + (w === G.sel ? ' on' : '') + (owed === 0 ? ' done' : '') +
                (canMove(w) ? '' : ' stuck');
      html += '<button class="' + cls + '" data-w="' + w + '"' +
              (w === G.sel ? ' style="color:' + INK.team[w] + '"' : '') + '>' +
              '<canvas class="cg" data-g="' + w + '" width="13" height="13"></canvas>' +
              (lv.claims[w].length ? '<span class="ct">' + owed + '</span> left' : 'free') +
              '</button>';
    }
    var unseen = lv.nodes.length - popcount(G.vis);
    html += '<span class="chip neutral' + (unseen ? '' : ' done') + '">' +
            '<span class="ct">' + unseen + '</span> island' + (unseen === 1 ? '' : 's') + '</span>';
  } else {
    html = '<span class="chip neutral">every bridge, exactly once</span>';
  }
  $('chips').innerHTML = html;
  // Draw each chip's mark with the same code the board uses, so the legend can
  // never drift from the thing it is labelling.
  Array.prototype.forEach.call($('chips').querySelectorAll('canvas.cg'), function (c) {
    paintGlyph(c, +c.getAttribute('data-g'));
  });
  Array.prototype.forEach.call($('chips').querySelectorAll('.chip[data-w]'), function (c) {
    c.addEventListener('click', function () {
      G.sel = +c.getAttribute('data-w'); syncHud();
    });
  });
}

function paintGlyph(el, w, solid) {
  var d = Math.min(window.devicePixelRatio || 1, 2.5);
  var size = el.width || 13;
  el.width = size * d; el.height = size * d;
  el.style.width = size + 'px'; el.style.height = size + 'px';
  var c = el.getContext('2d');
  c.setTransform(d, 0, 0, d, 0, 0);
  var save = ctx;
  ctx = c;                            // claimShape draws through the shared ctx
  claimShape(size / 2, size / 2, w, size * 0.36);
  ctx = save;
  if (solid === false) { c.strokeStyle = INK.team[w]; c.lineWidth = 1.6; c.stroke(); }
  else { c.fillStyle = INK.team[w]; c.fill(); }
}

function setScreen(name) {
  G.screen = name;
  $('menu').classList.toggle('hidden', name !== 'menu');
  $('levels').classList.toggle('hidden', name !== 'levels');
  $('hud').style.visibility = (name === 'play') ? 'visible' : 'hidden';
  if (name === 'levels') buildGrid();

var hintTimer = null;

// Three dots, filled as earned — quieter than stars and it sits on paper.
function marks(n, cls) {
  var out = '';
  for (var i = 0; i < 3; i++) out += '<i class="' + (i < n ? 'on' : '') + '"></i>';
  return '<div class="' + (cls || 'st') + '">' + out + '</div>';
}
// Count only crossings that exist now — a save carried over from an older
// build can hold ids this version no longer ships.
function totalStars() {
  return LV.reduce(function (n, lv) { return n + (SAVE.stars[lv.id] || 0); }, 0);
}
function unlockedUpTo() {
  var i = 0;
  while (i < LV.length && SAVE.stars[LV[i].id] !== undefined) i++;
  return Math.min(i, LV.length - 1);
}

var ACTS = ['Two travellers', 'Three travellers', 'Four travellers'];

function buildGrid() {
  var open = unlockedUpTo();
  $('totStars').textContent = totalStars() + ' / ' + (LV.filter(function (l) { return !l.interlude; }).length * 3);
  var html = '', act = -1;
  LV.forEach(function (lv, i) {
    var a = lv.interlude ? act : (lv.W - 2);
    if (a !== act) {
      if (act >= 0) html += '</div>';
      html += '<div class="actlabel label">' + (ACTS[a] || '') + '</div><div class="grid">';
      act = a;
    }
    var st = SAVE.stars[lv.id], locked = i > open;
    var label = lv.interlude ? '1736' : String(lv.no).padStart(2, '0');
    var stEl = lv.interlude ? marks(st !== undefined ? 3 : 0) : marks(st || 0);
    html += '<button class="tile' + (locked ? ' locked' : '') + (lv.interlude ? ' mark' : '') +
      (st ? ' solved' : '') + '" data-i="' + i + '"' + (locked ? ' disabled' : '') + '>' +
      '<div class="n">' + label + '</div>' + stEl + '</button>';
  });
  html += '</div>';
  $('acts').innerHTML = html;
  Array.prototype.forEach.call($('acts').querySelectorAll('.tile'), function (t) {
    t.addEventListener('click', function () {
      var i = +t.getAttribute('data-i');

}

    };
  },
