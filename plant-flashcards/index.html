<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plant Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#17321f;--bg2:#21422b;--ink:#f4f1e8;--mute:#a9bfa9;--card:#fbfaf7;--cink:#1b2a1f;--csub:#5d6f60;--acc:#e8547e;--ok:#8fd19e}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Instrument Sans",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{width:min(100%,560px);display:flex;align-items:center;gap:8px;padding:14px 16px 6px}
.top h1{font:500 17px/1 "Newsreader",serif;margin:0;flex:1;letter-spacing:.01em}
.left{color:var(--mute);font-variant-numeric:tabular-nums;margin-right:4px}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.ic:hover{background:var(--bg2);color:var(--ink)}
.ic svg{width:20px;height:20px}
.chips{width:min(100%,560px);display:flex;gap:6px;overflow-x:auto;padding:6px 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--bg2);color:var(--mute);font-size:14px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:4px 16px;perspective:1600px}
.card{position:relative;height:min(64vh,620px);width:min(100%,calc(min(64vh,620px)*.8));transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1);cursor:pointer;touch-action:pan-y;user-select:none}
.card.flip{transform:rotateY(180deg)}
.card.noanim{transition:none}
.face{position:absolute;inset:0;border-radius:22px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 24px 60px -20px rgba(0,0,0,.55)}
.front{background:#0e1f13}
.front .blur{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(28px) brightness(.55);transform:scale(1.1)}
.front img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .25s}
.front img.on{opacity:1}
.front .miss{position:absolute;inset:0;display:none;place-items:center;color:var(--mute)}
.back{background:var(--card);color:var(--cink);transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 26px;gap:6px}
.thumb{width:84px;height:84px;border-radius:50%;object-fit:cover;margin-bottom:18px;box-shadow:0 0 0 4px #fff,0 6px 18px -6px rgba(0,0,0,.35)}
.common{font:500 clamp(28px,7vw,40px)/1.08 "Newsreader",serif;text-wrap:balance;margin:0}
.sci{font:italic 400 clamp(19px,4.6vw,24px)/1.25 "Newsreader",serif;color:var(--csub);text-wrap:balance;margin-top:8px}
.sci .r{font-style:normal}
.cv{font:400 17px/1.3 "Newsreader",serif;color:var(--csub);text-wrap:balance}
.grp{margin-top:20px;font-size:13px;color:#8a998c}
.bar{width:min(100%,560px);display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:10px;padding:16px 16px max(20px,env(safe-area-inset-bottom))}
.nav{width:52px;height:52px;border-radius:50%;background:var(--bg2);display:grid;place-items:center}
.nav svg{width:22px;height:22px}
.mid{display:flex;gap:10px;justify-content:center}
.btn{flex:1;max-width:200px;height:52px;border-radius:26px;font-weight:600;font-size:16px}
.show{background:var(--ink);color:var(--bg)}
.again{background:var(--bg2);color:var(--ink)}
.got{background:var(--ok);color:#10301a}
.done{display:none;flex-direction:column;align-items:center;gap:18px;text-align:center}
.done p{font:500 30px/1.1 "Newsreader",serif;margin:0}
.done .btn{flex:none;padding:0 28px;background:var(--ink);color:var(--bg)}
body.empty .card,body.empty .bar{display:none}
body.empty .done{display:flex}
@media (min-width:700px){.chips{flex-wrap:wrap;justify-content:center;width:min(100%,820px)}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>

<header class="top">
  <h1>Green Lake · Dallas</h1>
  <span class="left" id="left"></span>
  <button class="ic" id="shuffle" title="Shuffle" aria-label="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
  <button class="ic" id="reset" title="Reset progress" aria-label="Reset progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
</header>
<nav class="chips" id="chips"></nav>
<main class="stage">
  <div class="card" id="card" role="button" tabindex="0" aria-label="Flip card">
    <div class="face front"><div class="blur" id="blur"></div><img id="img" alt="Plant photo"><div class="miss" id="miss">Photo unavailable</div></div>
    <div class="face back"><img class="thumb" id="thumb" alt=""><p class="common" id="common"></p><div class="sci" id="sci"></div><div class="cv" id="cv"></div><div class="grp" id="grp"></div></div>
  </div>
  <div class="done"><p>All learned.</p><button class="btn" id="again-all">Start over</button></div>
</main>
<footer class="bar">
  <button class="nav" id="prev" title="Previous (←)" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
  <div class="mid" id="mid"></div>
  <button class="nav" id="next" title="Next (→)" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
</footer>

2~|Snapdragon Vine|Maurandella antirrhiniflora|'Blanco Shoals'|v\n0e13531d-21a4-42c6-ad7a-f98e59d86922|Carolina Jessamine|Gelsemium sempervirens|'Margarita'|v\n1981_1Z-1500~|Coral Honeysuckle|Lonicera sempervirens||v\nb79f6327-542a-46dd-ad0c-fbb63e02329f~|Muscadine Grape|Vitis rotundifolia|'Carlos'|v\n";
const BASE = 'https://picturepro.blob.core.windows.net/00dbdee9-29b1-4256-98ca-c00902b91e77/';
const GROUPS = [['all','All'],['a','Annuals'],['p','Pansies & Violas'],['e','Perennials'],['s','Shrubs & Trees'],['c','Succulents & Cacti'],['g','Grasses & Sedges'],['h','Herbs & Edibles'],['v','Vines']];
const GNAME = Object.fromEntries(GROUPS);
const CARDS = RAW.trim().split('\n').map(l => { const [k, common, bin, cv, g] = l.split('|'); return {id: k, src: BASE + k.replace(/~$/, '.jpg'), common, bin, cv, g}; });
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const sci = b => '<i>' + esc(b).split(' ').map(t => /^(×|var\.|subsp\.)$/.test(t) ? '<span class="r">' + t + '</span>' : t).join(' ') + '</i>';
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let learned = new Set();
try { learned = new Set(JSON.parse(localStorage.getItem('glf-learned') || '[]')); } catch (e) {}
const save = () => { try { localStorage.setItem('glf-learned', JSON.stringify([...learned])); } catch (e) {} };

let group = 'all', deck = [], pos = 0, flipped = false;

function build() {
  deck = shuffle(CARDS.filter(c => (group === 'all' || c.g === group) && !learned.has(c.id)));
  pos = 0; render();
}

function setFlip(f) { flipped = f; $('card').classList.toggle('flip', f); controls(); }

function controls() {
  $('mid').innerHTML = flipped
    ? '<button class="btn again" id="b-again" title="Again (1)">Again</button><button class="btn got" id="b-got" title="Got it (2)">Got it</button>'
    : '<button class="btn show" id="b-show" title="Flip (Space)">Show name</button>';
}

function render() {
  document.body.classList.toggle('empty', deck.length === 0);
  $('left').textContent = deck.length ? deck.length + ' left' : '';
  if (!deck.length) return;
  pos = (pos + deck.length) % deck.length;
  const c = deck[pos];
  const cd = $('card');
  cd.classList.add('noanim'); setFlip(false); void cd.offsetWidth;
  requestAnimationFrame(() => requestAnimationFrame(() => cd.classList.remove('noanim')));
  const img = $('img');
  img.classList.remove('on'); $('miss').style.display = 'none';
  img.onload = () => img.classList.add('on');
  img.onerror = () => { $('miss').style.display = 'grid'; };
  img.src = c.src;
  $('blur').style.backgroundImage = 'url("' + c.src + '")';
  $('thumb').src = c.src;
  $('common').textContent = c.common;
  $('sci').innerHTML = sci(c.bin);
  $('cv').textContent = c.cv;
  $('grp').textContent = GNAME[c.g];
  for (let i = 1; i <= 2; i++) { const n = deck[(pos + i) % deck.length]; if (n) new Image().src = n.src; }
}

function go(d) { if (!deck.length) return; pos += d; render(); }
function again() { const [c] = deck.splice(pos, 1); deck.splice(Math.min(pos + 5, deck.length), 0, c); render(); }
function got() { const [c] = deck.splice(pos, 1); learned.add(c.id); save(); render(); }

$('chips').innerHTML = GROUPS.map(([k, n]) => '<button class="chip" data-g="' + k + '" aria-pressed="' + (k === group) + '">' + esc(n) + '</button>').join('');
$('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; group = b.dataset.g; for (const x of $('chips').children) x.setAttribute('aria-pressed', x === b); build(); });
$('mid').addEventListener('click', e => { const id = e.target.id; if (id === 'b-show') setFlip(true); else if (id === 'b-again') again(); else if (id === 'b-got') got(); });
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('shuffle').onclick = build;
$('reset').onclick = () => { learned.clear(); save(); build(); };
$('again-all').onclick = () => { for (const c of CARDS) if (group === 'all' || c.g === group) learned.delete(c.id); save(); build(); };

let sx = null, sy = 0;
const card = $('card');
card.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
card.addEventListener('pointerup', e => {
  if (sx === null) return;
  const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
  else if (Math.abs(dx) < 10 && Math.abs(dy) < 10) setFlip(!flipped);
});
card.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); setFlip(!flipped); } });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.key === ' ') { e.preventDefault(); setFlip(!flipped); }
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (flipped && e.key === '1') again();
  else if (flipped && e.key === '2') got();
});

document.addEventListener('click', e => { const b = e.target.closest('button'); if (b && e.detail > 0) b.blur(); });

build();
}
