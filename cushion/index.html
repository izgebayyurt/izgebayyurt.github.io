<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Cushion" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<!-- Two theme-colors keyed to the system scheme get the very first frame right,
     before any script runs; once a theme is actually chosen the script writes
     both to the same value, or the media query keeps answering for the one
     nobody picked. Same trick as Tapa. -->
<meta name="theme-color" content="#ece9e1" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#191519" media="(prefers-color-scheme: dark)" />
<title>Cushion</title>
<meta name="description" content="Cushion — pocket billiards on paper. Trick-shot studies proved clearable by the engine that plays them, nine-ball against a machine that aims like a person, and an endless run." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ece9e1'/%3E%3Ccircle cx='11' cy='13' r='5.4' fill='%23fbf7ee' stroke='%232a2730' stroke-width='1.8'/%3E%3Ccircle cx='22' cy='19' r='5.4' fill='%23ef4a5a' stroke='%232a2730' stroke-width='1.8'/%3E%3C/svg%3E" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />
<style>
  :root {
    --pg:#ece9e1;              /* paper — the page, and the rail caps */
    --bed:#e3ded0;             /* the bed: paper with the light knocked out of it */
    --bed2:#dbd5c5;            /* the bed's far edge, for the one soft gradient */
    --pi:#2a2730;              /* ink — a purple-black, never a neutral one */
    --rail:#2a2730;            /* the cushions are ink; they are the drawing */
    /* The mouths are leather, not more ink. A near-black hole in a near-black
       rail is a hole nobody can see, so the pockets are the one warm thing on
       the table — and warm is the right direction, because the only other
       warm colour here is the one that means a ball is going in. */
    --pocket:#7a5433;          /* the lip of the liner, where the light gets in */
    --pocket-deep:#20120a;     /* down the throat */
    --pocket-lip:#f2e4d0;      /* the rim that says "opening", not "smudge" */
    --pa:#7a5e9a;              /* the one accent: aim, and the ball that is on */
    --pw:#c85f18;             /* the clear moment, and nothing else */
    --sight:#ece9e1;           /* the rail diamonds, which must read on the rail */
    --ballline:#231f29;        /* every ball is outlined; this is that outline */
    --ballrim:rgba(255,255,255,0);
    --cue:#fbf7ee;
    --pr:rgba(42,39,48,0.13);
    --pd:rgba(42,39,48,0.55);
    --pq:rgba(42,39,48,0.32);
    --pfaint:rgba(42,39,48,0.20);
    --chrome:rgba(240,238,231,0.92);   /* the discs of paper the controls float on */
    --shadow:rgba(42,39,48,0.17);
    --hard:rgba(42,39,48,0.85);        /* Huemeld's hard drop shadow, calmed down */
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",ui-serif,Georgia,serif;
    --sans:"Geist",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --pop:cubic-bezier(.34,1.56,.64,1);
    --calm:cubic-bezier(.4,0,.2,1);
    color-scheme:light;
  }
  /* The bands the page does not paint — status bar, gesture bar, overscroll
     gutter — belong to the browser, and it picks their colour from
     color-scheme, not from anything in the stylesheet. */
  @media (prefers-color-scheme: dark) { :root { color-scheme:dark; } }
  html[data-theme="paper"] { color-scheme:light; }
  html[data-theme="slate"] { color-scheme:dark; }
  /* Slate is derived from paper rather than inverted: the ground keeps the
     purple bias, the bed stays a shade above it, and the balls keep their
     pigment — they gain a light rim so they still cut away from the cloth. */
  html[data-theme="slate"] {
    --pg:#191519;
    --bed:#2e2735;
    --bed2:#251f2b;
    --pi:#ded7c8;
    --rail:#0c0a0f;
    --pocket:#7d5836;
    --pocket-deep:#160d06;
    --pocket-lip:#c9a074;
    --sight:#7c7186;
    --pa:#a888c8;
    --pw:#ff8a4c;
    --ballline:#0c0a0f;
    --ballrim:rgba(255,255,255,0.16);
    --cue:#f2ece0;
    --pr:rgba(222,215,200,0.14);
    --pd:rgba(222,215,200,0.56);
    --pq:rgba(222,215,200,0.34);
    --pfaint:rgba(222,215,200,0.22);
    --chrome:rgba(38,32,39,0.92);
    --shadow:rgba(0,0,0,0.5);
    --hard:rgba(0,0,0,0.7);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--pg); color:var(--pi);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
    user-select:none; -webkit-user-select:none; overscroll-behavior:none;
    touch-action:manipulation;
  }
  #app { position:fixed; inset:0; }
  button { font-family:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--pa); outline-offset:2px; }

  .screen {
    position:absolute; inset:0; display:none; flex-direction:column;
    background:var(--pg);
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  }
  .screen.on { display:flex; }
  .scroll { flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; min-height:0; }

  /* ---------- shared chrome ---------- */
  .bar { flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:14px 12px 8px; min-height:44px; }
  .icon {
    width:32px; height:32px; display:grid; place-items:center; color:var(--pd);
    font-size:18px; line-height:1; cursor:pointer; background:none; border:0;
    padding:0; border-radius:9px;
  }
  .icon:active { background:var(--pr); }
  .bartitle { font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; color:var(--pd); font-weight:500; }
  .grow { margin-left:auto; }
  .pbtn {
    display:block; width:100%; padding:14px; border-radius:13px; border:0;
    background:var(--pi); color:var(--pg); font-size:14.5px; font-weight:600; cursor:pointer;
  }
  .pbtn.ghost { background:transparent; color:var(--pd); font-weight:500; border:1px solid var(--pr); }
  .pbtn:active { opacity:.85; }

  /* ---------- home ---------- */
  #home .inner { padding:16px 22px 22px; display:flex; flex-direction:column; min-height:100%; }
  .wordmark { font-family:var(--serif); font-size:42px; line-height:1; font-weight:600; letter-spacing:-0.015em; }
  .wordsub { font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; color:var(--pd); margin-top:8px; }
  .modes { margin-top:26px; display:flex; flex-direction:column; gap:11px; }
  /* A mode card is Huemeld's confidence at Tapa's volume: a real outline and a
     hard shadow that the press collapses, but in ink on paper, not candy. */
  .mode {
    display:grid; grid-template-columns:54px minmax(0,1fr) auto; gap:14px; align-items:center;
    padding:13px 15px 13px 13px; text-align:left; width:100%; cursor:pointer; color:inherit;
    background:var(--chrome); border:1.5px solid var(--pfaint); border-radius:16px;
    box-shadow:0 3px 0 var(--pr);
    transition:transform .09s var(--calm), box-shadow .09s var(--calm);
  }
  .mode:active { transform:translateY(3px); box-shadow:0 0 0 var(--pr); }
  .mode canvas { display:block; width:54px; height:54px; }
  .mode .n { font-family:var(--serif); font-size:19px; font-weight:600; line-height:1.1; }
  .mode .d { font-size:11px; color:var(--pd); margin-top:3px; line-height:1.35; }
  .mode .c { font-family:var(--serif); font-size:13.5px; color:var(--pq); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .homefoot { margin-top:auto; padding-top:22px; display:flex; gap:20px; flex-wrap:wrap; }
  .homefoot button {
    background:none; border:0; padding:6px 0; cursor:pointer;
    font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--pd);
  }

  /* ---------- book list (studies) ---------- */
  #books .inner { padding:6px 22px 26px; }
  .booktitle { font-family:var(--serif); font-size:28px; font-weight:600; margin-top:4px; }
  .booknote { font-size:11.5px; color:var(--pd); margin-top:7px; line-height:1.45; }
  .books { margin-top:20px; display:flex; flex-direction:column; }
  .book {
    display:grid; grid-template-columns:42px minmax(0,1fr) auto; gap:14px; align-items:center;
    padding:14px 0; border-top:1px solid var(--pr); background:none; border-left:0; border-right:0;
    border-bottom:0; cursor:pointer; text-align:left; width:100%; color:inherit;
  }
  .books .book:last-child { border-bottom:1px solid var(--pr); }
  .book:active { background:var(--pr); }
  .book canvas { display:block; width:42px; height:42px; }
  .book .n { font-family:var(--serif); font-size:17px; font-weight:600; line-height:1.15; }
  .book .d { font-size:10.5px; color:var(--pd); margin-top:2px; }
  .book .c { font-family:var(--serif); font-size:13.5px; color:var(--pq); font-variant-numeric:tabular-nums; }

  /* ---------- the table ---------- */
  #play { background:var(--pg); }
  #cv { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  /* Every control floats over the felt on its own disc of paper, so the table
     never gives up layout space to chrome. */
  .float {
    position:absolute; z-index:5; background:var(--chrome); color:var(--pi);
    border:1px solid var(--pfaint); border-radius:999px;
    box-shadow:0 2px 8px var(--shadow); backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px);
  }
  .fbtn {
    width:38px; height:38px; display:grid; place-items:center; cursor:pointer; padding:0;
    font-size:16px; line-height:1;
  }
  .fbtn:active { transform:scale(.93); }
  #backBtn { top:calc(env(safe-area-inset-top) + 10px); left:10px; }
  #menuBtn { top:calc(env(safe-area-inset-top) + 10px); right:10px; }
  #hud {
    top:calc(env(safe-area-inset-top) + 10px); left:50%; transform:translateX(-50%);
    height:38px; display:flex; align-items:center; gap:0; padding:0 4px; max-width:calc(100% - 120px);
  }
  .hcell { padding:0 11px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; }
  .hcell + .hcell { border-left:1px solid var(--pr); }
  .hcell b { font-family:var(--serif); font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
  .hcell b.warn { color:var(--pw); }
  .hcell span { font-size:7.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--pd); margin-top:3px; font-weight:600; }

  /* There is no stroke widget any more. The cue is the control: drag away from
     the ball to aim and to draw the cue back, let go to hit. */
  /* the spin disc: a cue ball you can touch anywhere on */
  #spin {
    position:absolute; z-index:6; right:12px; bottom:calc(env(safe-area-inset-bottom) + 16px);
    width:54px; height:54px; border-radius:50%; background:var(--cue);
    border:1.5px solid var(--ballline); box-shadow:0 3px 10px var(--shadow);
    touch-action:none; cursor:pointer;
  }
  #spinDot {
    position:absolute; width:15px; height:15px; border-radius:50%; background:var(--pa);
    left:50%; top:50%; margin:-7.5px 0 0 -7.5px; pointer-events:none;
    box-shadow:0 0 0 1.5px var(--cue); transition:transform .12s var(--pop);
  }
  #spin::after {
    content:""; position:absolute; inset:9px; border-radius:50%;
    border:1px dashed rgba(42,39,48,.22); pointer-events:none;
  }
  /* The one control that matters now. Tap it and this shot's outcome is shown;
     you have only so many, and the way to get more is to stop needing them. */
  #sightBtn {
    right:12px; bottom:calc(env(safe-area-inset-bottom) + 80px);
    height:38px; padding:0 14px; display:flex; align-items:center; gap:7px;
    cursor:pointer; font-family:var(--serif); font-size:16px; font-weight:600;
    font-variant-numeric:tabular-nums; color:var(--pi);
  }
  #sightBtn .eye {
    width:15px; height:15px; border-radius:50%; border:2px solid var(--pa);
    position:relative;
  }
  #sightBtn .eye::after {
    content:""; position:absolute; inset:3px; border-radius:50%; background:var(--pa);
  }
  #sightBtn.spent { opacity:.42; }
  #sightBtn.on .eye { border-color:var(--pw); }
  #sightBtn.on .eye::after { background:var(--pw); }
  #sightBtn:active { transform:scale(.93); }
  #hintBtn { display:none !important; }
  #spin { bottom:calc(env(safe-area-inset-bottom) + 14px); }
  #fitBtn {
    left:12px; bottom:calc(env(safe-area-inset-bottom) + 16px); width:auto; height:32px;
    padding:0 14px; display:none; place-items:center; cursor:pointer;
    font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--pd); font-weight:600;
  }
  #fitBtn.on { display:grid; }

  /* a line of prose that says what just happened, and then stops saying it */
  #say {
    position:absolute; z-index:7; left:50%; transform:translateX(-50%);
    top:calc(env(safe-area-inset-top) + 58px); pointer-events:none;
    font-size:12px; color:var(--pi); background:var(--chrome); border:1px solid var(--pfaint);
    padding:7px 15px; border-radius:999px; box-shadow:0 2px 8px var(--shadow);
    opacity:0; transition:opacity .3s var(--calm), transform .3s var(--pop); white-space:nowrap;
    max-width:calc(100vw - 40px); overflow:hidden; text-overflow:ellipsis;
  }
  #say.on { opacity:1; transform:translateX(-50%) translateY(0); }
  #say { transform:translateX(-50%) translateY(-6px); }
  #say.bad { color:var(--pw); }

  /* ---------- sheets ---------- */
  #veil {
    position:absolute; inset:0; z-index:20; background:rgba(0,0,0,.34);
    display:none; align-items:flex-end; justify-content:center;
    padding-bottom:env(safe-area-inset-bottom); backdrop-filter:blur(2px);
  }
  #veil.on { display:flex; }
  .sheet {
    width:100%; max-width:460px; background:var(--pg); color:var(--pi);
    border-radius:20px 20px 0 0; padding:8px 22px calc(24px + env(safe-area-inset-bottom));
    max-height:86vh; overflow-y:auto; animation:rise .26s var(--pop);
  }
  @keyframes rise { from { transform:translateY(24px); opacity:0; } to { transform:none; opacity:1; } }
  .grab { width:36px; height:4px; border-radius:2px; background:var(--pfaint); margin:6px auto 14px; }
  .sh1 { font-family:var(--serif); font-size:23px; font-weight:600; }
  .sh2 { font-size:12px; color:var(--pd); margin-top:6px; line-height:1.5; }
  .sheet p { font-size:13px; line-height:1.6; color:var(--pd); margin:12px 0 0; }
  .sheet p b, .sheet p strong { color:var(--pi); font-weight:600; }
  .sheet .rowbtns { margin-top:18px; display:flex; flex-direction:column; gap:9px; }
  .stat { display:flex; justify-content:space-between; align-items:baseline; padding:9px 0; border-top:1px solid var(--pr); font-size:12.5px; color:var(--pd); }
  .stat b { font-family:var(--serif); font-size:16px; color:var(--pi); font-weight:600; font-variant-numeric:tabular-nums; }
  .seg { display:flex; gap:7px; margin-top:14px; }
  .seg button {
    flex:1; padding:10px 4px; border-radius:11px; border:1px solid var(--pr); background:none;
    font-size:12px; font-weight:600; color:var(--pd); cursor:pointer;
  }
  .seg button.on { background:var(--pi); color:var(--pg); border-color:var(--pi); }
  .numgrid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:16px; }
  .numgrid button {
    aspect-ratio:1; border-radius:12px; border:1px solid var(--pr); background:none; cursor:pointer;
    font-family:var(--serif); font-size:15px; font-weight:600; color:var(--pi); position:relative;
    font-variant-numeric:tabular-nums;
  }
  .numgrid button.done { background:var(--pi); color:var(--pg); border-color:var(--pi); }
  .numgrid button.here { outline:2px solid var(--pa); outline-offset:1px; }
  .pager { display:flex; align-items:center; justify-content:space-between; margin-top:14px; }
  .pager button { background:none; border:0; color:var(--pd); font-size:13px; padding:8px 12px; cursor:pointer; }
  .pager span { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--pq); }

  /* the clear moment: a wave of warm light crossing the sheet */
  .win .sh1 { color:var(--pw); }
</style>
</head>
<body>
<div id="app">

  <section id="home" class="screen">
    <div class="scroll"><div class="inner">
      <div class="wordmark">Cushion</div>
      <div class="wordsub">Pocket billiards on paper</div>
      <div class="modes" id="modeList"></div>
      <div class="homefoot">
        <button id="howBtn">How</button>
        <button id="themeBtn">Theme</button>
        <button id="soundBtn">Sound</button>
      </div>
    </div></div>
  </section>

  <section id="books" class="screen">
    <div class="bar">
      <button class="icon" id="booksBack" aria-label="Back">&#8592;</button>
      <div class="bartitle">Studies</div>
    </div>
    <div class="scroll"><div class="inner">
      <div class="booktitle">Studies</div>
      <div class="booknote">
        Clear the table inside par. Every study is generated on this device and then
        proved: par is the shortest line the engine could actually shoot, centre-ball,
        with no spin at all. Spin is yours to use — it is never the answer.
      </div>
      <div class="books" id="bookList"></div>
    </div></div>
  </section>

  <section id="play" class="screen">
    <canvas id="cv"></canvas>
    <button class="float fbtn" id="backBtn" aria-label="Back">&#8592;</button>
    <div class="float" id="hud"></div>
    <button class="float fbtn" id="menuBtn" aria-label="Menu">&#8942;</button>
    <button class="float" id="fitBtn">Fit</button>
    <button class="float fbtn" id="hintBtn" aria-label="Hint">?</button>
    <button class="float" id="sightBtn" aria-label="Sight the shot"><span class="eye"></span><span id="sightN">3</span></button>
    <div id="say"></div>
    <div id="spin"><div id="spinDot"></div></div>
  </section>

  <div id="veil"><div class="sheet" id="sheet"></div></div>
</div>
<script>
'use strict';
/* ===========================================================================
   Cushion — the engine.

   Everything below is inside one function with no references to anything
   outside it, because the generator worker is built by stringifying it. One
   copy of the physics, therefore: the table you shoot on, the table the
   opponent thinks on, and the table a study is proved on are the same table.
   If they were not, par would be a guess.
   =========================================================================== */
function CUSHION_ENGINE() {
'use strict';

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hyp = Math.hypot;

/* ---------------------------------------------------------------- geometry */

const W = 940, H = 470;       /* the bed, corner to corner, in table units */
const R = 12.5;               /* ball radius — a shade fat for real, and legible for it */
const JAW = 5.5;              /* the rounded nose of a cushion */
const RAIL_HIT = R + JAW;     /* so a ball's face rests exactly on the bed edge */
const CORNER_JAW = 25;        /* how far short of a corner the cushion stops */
const SIDE_JAW = 22;          /* half the side pocket's mouth */
const POT_CORNER = 28;        /* a corner takes anything that gets this close */
const SIDE_LIP = 3.5;         /* a side pocket wants the ball past the nose */

/* Cushion segments live on the nose line, JAW outside the bed, and are
   collided as capsules — which makes the ends into real jaws that a ball can
   rattle in, for free. */
const RAILS = [
  { ax:CORNER_JAW,   ay:-JAW,  bx:W/2-SIDE_JAW, by:-JAW  },
  { ax:W/2+SIDE_JAW, ay:-JAW,  bx:W-CORNER_JAW, by:-JAW  },
  { ax:CORNER_JAW,   ay:H+JAW, bx:W/2-SIDE_JAW, by:H+JAW },
  { ax:W/2+SIDE_JAW, ay:H+JAW, bx:W-CORNER_JAW, by:H+JAW },
  { ax:-JAW,   ay:CORNER_JAW, bx:-JAW,   by:H-CORNER_JAW },
  { ax:W+JAW,  ay:CORNER_JAW, bx:W+JAW,  by:H-CORNER_JAW },
];

/* A corner is a circle; a side pocket is a mouth you must go past the nose of,
   so a ball rolling the length of the long rail sails by it, as it should. */
const POCKETS = [
  { x:0,   y:0,   kind:'c' }, { x:W/2, y:0, kind:'s', dir:-1 }, { x:W,   y:0,   kind:'c' },
  { x:0,   y:H,   kind:'c' }, { x:W/2, y:H, kind:'s', dir: 1 }, { x:W,   y:H,   kind:'c' },
];

function inPocket(b) {
  for (let i = 0; i < 6; i++) {
    const p = POCKETS[i];
    if (p.kind === 'c') {
      if (hyp(b.x - p.x, b.y - p.y) < POT_CORNER) return i;
    } else {
      const past = p.dir < 0 ? (b.y < SIDE_LIP) : (b.y > H - SIDE_LIP);
      if (past && Math.abs(b.x - p.x) < SIDE_JAW + 2.5) return i;
    }
  }
  /* Nothing should ever leave the bed without falling in, but if the numbers
     ever misbehave, the nearest pocket eats it rather than the ball escaping
     to somewhere the renderer will happily draw it. */
  if (b.x < -60 || b.x > W + 60 || b.y < -60 || b.y > H + 60) {
    let best = 0, bd = 1e9;
    for (let i = 0; i < 6; i++) { const d = hyp(b.x - POCKETS[i].x, b.y - POCKETS[i].y); if (d < bd) { bd = d; best = i; } }
    return best;
  }
  return -1;
}

/* ------------------------------------------------------------------ feeling

   These are not tuned by ear. The bed is 940 units long and a real 8-foot bed
   is 100 inches, so one metre is 370 units and gravity is 3631 units/s². Every
   number below is a measured coefficient from that scale:

     rolling resistance   mu ~ 0.010   (0.005-0.015 on cloth)
     sliding friction     mu ~ 0.20    (0.15-0.4)
     ball on ball          e ~ 0.96
     ball on cushion       e ~ 0.85 slow, ~0.72 hard — a cushion is rubber and
                                     rubber gets less bouncy the harder you hit

   The consequence that matters: a ball on cloth barely slows down. What stops
   it is cushions, not the felt. Balls used to be tuned to die on their own, and
   they died far too fast. */
const M         = 370.1;          /* units per metre */
const GRAV      = 9.81 * M;
const A_ROLL    = 0.010 * GRAV;   /* 36 — the cloth takes almost nothing */
const A_SLIDE   = 0.200 * GRAV;   /* 726 — this one is what draw and follow live on */
const E_BB      = 0.96;
const E_CU_SLOW = 0.85, E_CU_FAST = 0.72;
const CU_KNEE   = 4.0 * M;        /* the speed by which a cushion is at its deadest */
const T_CU      = 0.90;           /* along the cushion; T/E over one is why a bank
                                     comes off flatter than it went in */
const SPIN_CU   = 0.28;           /* side spin the cushion turns into travel */
const V_MAX     = 8.5 * M;        /* a hard shot; a break is a shade under 12 m/s */
const REST_V    = 0.055 * M;      /* 20 — a ball this slow is done, and creeping to
                                     a true halt at 36 units/s² takes half a second
                                     of nothing happening */

const STEP = 1 / 240;

function ball(num, x, y) {
  return { num, x, y, vx:0, vy:0, sx:0, sy:0, live:true, pocket:-1 };
}
function cloneBalls(bs) {
  const o = new Array(bs.length);
  for (let i = 0; i < bs.length; i++) {
    const b = bs[i];
    o[i] = { num:b.num, x:b.x, y:b.y, vx:b.vx, vy:b.vy, sx:b.sx, sy:b.sy, live:b.live, pocket:b.pocket };
  }
  return o;
}
const cueOf = bs => bs[0];
const objects = bs => bs.filter((b, i) => i > 0 && b.live);

/* --------------------------------------------------------------- one impulse

   Slip is the velocity of the contact patch against the cloth. Rolling is
   slip zero; everything interesting is slip not zero. A sudden change in
   linear velocity does not touch the ball's rotation, so an impulse moves
   slip by exactly the same vector it moves velocity by — which is the whole
   reason a drawn cue ball comes back after it has hit something. */
function impulse(b, dvx, dvy) {
  b.vx += dvx; b.vy += dvy;
  b.sx += dvx; b.sy += dvy;
}

function integrate(b, h) {
  const sl = hyp(b.sx, b.sy);
  if (sl > 1) {
    /* sliding — friction opposes the slip, and drags the ball sideways too,
       which is where swerve comes from when you have side on */
    const nx = b.sx / sl, ny = b.sy / sl;
    const dv = A_SLIDE * h;
    b.vx -= dv * nx; b.vy -= dv * ny;
    /* a sphere's slip dies seven-halves faster than its velocity changes;
       that ratio is what makes a centre-ball hit settle at 5/7 of its speed */
    const ds = 3.5 * dv;
    if (ds >= sl) { b.sx = 0; b.sy = 0; }
    else { b.sx -= ds * nx; b.sy -= ds * ny; }
  } else {
    b.sx = 0; b.sy = 0;
    const v = hyp(b.vx, b.vy);
    if (v > 0) {
      const dv = A_ROLL * h;
      if (dv >= v) { b.vx = 0; b.vy = 0; }
      else { b.vx -= dv * b.vx / v; b.vy -= dv * b.vy / v; }
    }
  }
  b.x += b.vx * h; b.y += b.vy * h;
  if (hyp(b.vx, b.vy) < REST_V && hyp(b.sx, b.sy) < 1) { b.vx = 0; b.vy = 0; b.sx = 0; b.sy = 0; }
}

function railHit(b) {
  let loudest = 0;
  for (let i = 0; i < RAILS.length; i++) {
    const s = RAILS[i];
    const ex = s.bx - s.ax, ey = s.by - s.ay;
    const L2 = ex * ex + ey * ey;
    let t = ((b.x - s.ax) * ex + (b.y - s.ay) * ey) / L2;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const cxp = s.ax + ex * t, cyp = s.ay + ey * t;
    let nx = b.x - cxp, ny = b.y - cyp;
    let d = hyp(nx, ny);
    if (d >= RAIL_HIT || d === 0) continue;
    nx /= d; ny /= d;
    b.x = cxp + nx * RAIL_HIT; b.y = cyp + ny * RAIL_HIT;
    const vn = b.vx * nx + b.vy * ny;
    if (vn >= 0) continue;
    const tx = -ny, ty = nx;
    const vt = b.vx * tx + b.vy * ty;
    const sp = Math.abs(vn);
    const e = E_CU_SLOW + (E_CU_FAST - E_CU_SLOW) * Math.min(1, sp / CU_KNEE);
    const nvn = -e * vn;
    /* Only genuine side counts here. A ball that is simply sliding has its whole
       slip pointing the way it is going, and a cushion must not read that as
       english — doing so bent every ordinary bank off the rail. Sideways spin is
       the part of the slip across the line of travel, and nothing else. */
    const vl = hyp(b.vx, b.vy);
    let kick = 0, sideS = 0, pxn = 0, pyn = 0;
    if (vl > 1) {
      pxn = -b.vy / vl; pyn = b.vx / vl;
      sideS = b.sx * pxn + b.sy * pyn;
      kick = SPIN_CU * sideS * (pxn * tx + pyn * ty);
    }
    const nvt = vt * T_CU - kick;
    const ovx = b.vx, ovy = b.vy;
    b.vx = nx * nvn + tx * nvt; b.vy = ny * nvn + ty * nvt;
    b.sx += b.vx - ovx; b.sy += b.vy - ovy;
    /* the cushion scrubs off most of the side it just spent */
    b.sx -= sideS * pxn * 0.55; b.sy -= sideS * pyn * 0.55;
    if (-vn > loudest) loudest = -vn;
  }
  return loudest;
}

function hitBalls(a, b) {
  let nx = b.x - a.x, ny = b.y - a.y;
  let d = hyp(nx, ny);
  if (d >= 2 * R) return 0;
  if (d < 1e-6) { nx = 1; ny = 0; d = 1e-6; } else { nx /= d; ny /= d; }
  const overlap = 2 * R - d;
  a.x -= nx * overlap * 0.5; a.y -= ny * overlap * 0.5;
  b.x += nx * overlap * 0.5; b.y += ny * overlap * 0.5;
  const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
  if (vn >= 0) return 0;
  const j = -(1 + E_BB) * vn * 0.5;
  impulse(a, -j * nx, -j * ny);
  impulse(b,  j * nx,  j * ny);
  return -vn;
}

/* --------------------------------------------------------------- a whole shot

   Runs to rest and reports what happened on the way, because the rules of
   every mode are written against these events and nothing else. */
function strike(bs, shot) {
  const cue = bs[0];
  const ang = shot.angle;
  const v0 = clamp(shot.power, 0, 1) * V_MAX;
  const ux = Math.cos(ang), uy = Math.sin(ang);
  cue.vx = ux * v0; cue.vy = uy * v0;
  /* Strike offsets are fractions of the ball, capped short of a miscue. The
     natural-roll point sits at 0.8 of the vertical range, so centre ball
     genuinely slides before it rolls. */
  const ver = clamp(shot.ver || 0, -1, 1), side = clamp(shot.side || 0, -1, 1);
  const par = v0 * (1 - 1.25 * ver);
  const per = -v0 * 1.25 * side;
  cue.sx = ux * par - uy * per; cue.sy = uy * par + ux * per;
}

function shoot(balls, shot, sink) {
  const bs = cloneBalls(balls);
  strike(bs, shot);
  const ev = newEvents();
  let t = 0;
  while (moving(bs) && t < 22) { t += STEP; advance(bs, ev, sink); }
  return { balls:bs, ev };
}

const newEvents = () => ({ potted:[], pottedAt:[], firstHit:-1, railAfter:false, cueScratch:false, contact:false, kick:false, banked:{} });
function moving(bs) {
  for (let i = 0; i < bs.length; i++) if (bs[i].live && (bs[i].vx || bs[i].vy)) return true;
  return false;
}

/* One tick of the world, and the only one there is. The screen calls this at
   sixty frames a second and the prover calls it as fast as it can; that they
   are the same function is the point. */
function advance(bs, ev, sink) {
  /* enough substeps that nothing moves more than a third of a ball */
  let fastest = 0;
  for (let i = 0; i < bs.length; i++) if (bs[i].live) { const v = hyp(bs[i].vx, bs[i].vy); if (v > fastest) fastest = v; }
  const sub = fastest * STEP > R * 0.35 ? Math.min(8, Math.ceil(fastest * STEP / (R * 0.35))) : 1;
  const h = STEP / sub;
  for (let k = 0; k < sub; k++) {
    for (let i = 0; i < bs.length; i++) if (bs[i].live) integrate(bs[i], h);
    for (let i = 0; i < bs.length; i++) {
      if (!bs[i].live) continue;
      for (let j = i + 1; j < bs.length; j++) {
        if (!bs[j].live) continue;
        const f = hitBalls(bs[i], bs[j]);
        if (f > 0) {
          if (ev.firstHit < 0 && (i === 0 || j === 0)) { ev.firstHit = i === 0 ? bs[j].num : bs[i].num; ev.contact = true; }
          if (sink) sink('clack', f / V_MAX, (bs[i].x + bs[j].x) / 2, (bs[i].y + bs[j].y) / 2);
        }
      }
    }
    for (let i = 0; i < bs.length; i++) {
      if (!bs[i].live) continue;
      const f = railHit(bs[i]);
      if (f > 0) {
        if (ev.contact) ev.railAfter = true; else if (i === 0) ev.kick = true;
        ev.banked[bs[i].num] = 1;
        if (sink) sink('rail', f / V_MAX, bs[i].x, bs[i].y);
      }
      const p = inPocket(bs[i]);
      if (p >= 0) {
        bs[i].live = false; bs[i].pocket = p; bs[i].vx = bs[i].vy = bs[i].sx = bs[i].sy = 0;
        if (i === 0) ev.cueScratch = true; else { ev.potted.push(bs[i].num); ev.pottedAt.push(p); }
        if (sink) sink('pot', 1, bs[i].x, bs[i].y, { num:bs[i].num, pocket:p, cue:i === 0 });
      }
    }
  }
}

/* ------------------------------------------------------- reading the table

   A shot is an aim and a speed, but a *candidate* is an argument: this ball,
   into that pocket, by this route. Enumerating the arguments is what lets one
   piece of code prove a study, hint at it, and play nine-ball with it. */

const CUT_MAX = Math.cos(78 * Math.PI / 180);

function segDist(px, py, ax, ay, bx, by) {
  const ex = bx - ax, ey = by - ay, L2 = ex * ex + ey * ey;
  let t = L2 > 0 ? ((px - ax) * ex + (py - ay) * ey) / L2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return hyp(px - (ax + ex * t), py - (ay + ey * t));
}
function laneClear(bs, ax, ay, bx, by, skipA, skipB) {
  for (let i = 0; i < bs.length; i++) {
    const b = bs[i];
    if (!b.live || b.num === skipA || b.num === skipB) continue;
    if (segDist(b.x, b.y, ax, ay, bx, by) < 2 * R + 0.6) return false;
  }
  return true;
}
/* The point a corner pocket actually swallows at sits a little inside its
   mouth; aiming at the exact corner aims at the point of a triangle. */
function aimPoint(p) {
  if (p.kind === 'c') {
    const sx = p.x === 0 ? 1 : -1, sy = p.y === 0 ? 1 : -1;
    return { x:p.x + sx * 7, y:p.y + sy * 7 };
  }
  return { x:p.x, y:p.y + (p.dir < 0 ? 4 : -4) };
}

/* Where a bank has to strike the rail. A cushion does not mirror — it keeps
   less of the approach than of the slide along it, so the ball comes off
   flatter than the reflection says. Solving for that ratio outright beats
   aiming at a mirror and hoping. */
const BANK_K = (T_CU / ((E_CU_SLOW + E_CU_FAST) / 2));
function bankPoint(b, p, rail) {
  const k = BANK_K;
  if (rail === 0 || rail === 1) {                 /* top / bottom: line y = c */
    const c = rail === 0 ? R : H - R;
    const d1 = Math.abs(b.y - c), d2 = Math.abs(p.y - c);
    if ((b.y - c) * (p.y - c) <= 0) return null;  /* they are not on the same side */
    if (d1 < R * 0.7 || d2 < R * 0.7) return null;
    const u = (p.x - b.x) * d1 / (d1 + k * d2);
    const x = b.x + u;
    if (x < CORNER_JAW + 14 || x > W - CORNER_JAW - 14) return null;
    if (Math.abs(x - W / 2) < SIDE_JAW + 12) return null;
    return { x, y:c };
  }
  const c = rail === 2 ? R : W - R;               /* left / right: line x = c */
  const d1 = Math.abs(b.x - c), d2 = Math.abs(p.x - c);
  if ((b.x - c) * (p.x - c) <= 0) return null;
  if (d1 < R * 0.7 || d2 < R * 0.7) return null;
  const u = (p.y - b.y) * d1 / (d1 + k * d2);
  const y = b.y + u;
  if (y < CORNER_JAW + 14 || y > H - CORNER_JAW - 14) return null;
  return { x:c, y };
}

function mkCandidate(bs, target, pocketIdx, dest, kind) {
  const cue = bs[0];
  const dx = dest.x - target.x, dy = dest.y - target.y;
  const dl = hyp(dx, dy);
  if (dl < R) return null;
  const ndx = dx / dl, ndy = dy / dl;
  const gx = target.x - ndx * 2 * R, gy = target.y - ndy * 2 * R;
  if (gx < 3 || gx > W - 3 || gy < 3 || gy > H - 3) return null;
  const ax = gx - cue.x, ay = gy - cue.y;
  const al = hyp(ax, ay);
  if (al < R * 0.8) return null;
  const uax = ax / al, uay = ay / al;
  const cutCos = uax * ndx + uay * ndy;
  if (cutCos < CUT_MAX) return null;
  if (!laneClear(bs, cue.x, cue.y, gx, gy, 0, target.num)) return null;
  if (!laneClear(bs, target.x, target.y, dest.x, dest.y, target.num, -999)) return null;
  return {
    angle: Math.atan2(uay, uax), target: target.num, pocket: pocketIdx, kind,
    cut: Math.acos(clamp(cutCos, -1, 1)), reach: al + dl,
    /* one number for how much can go wrong: the thinner the cut, the longer
       the run, the more a bank asks of the cushion */
    hard: (1 - cutCos) * 2.6 + (al + dl) / 1400 + (kind === 'bank' ? 0.9 : 0) + (kind === 'combo' ? 1.3 : 0),
  };
}

function candidates(bs, opts) {
  opts = opts || {};
  const only = opts.only;              /* a set of ball numbers that are legal to strike first */
  const banks = opts.banks !== false;
  const combos = !!opts.combos;
  const out = [];
  const objs = objects(bs);
  for (let oi = 0; oi < objs.length; oi++) {
    const t = objs[oi];
    if (only && only.indexOf(t.num) < 0) continue;
    for (let pi = 0; pi < 6; pi++) {
      const ap = aimPoint(POCKETS[pi]);
      const c = mkCandidate(bs, t, pi, ap, 'direct');
      if (c) out.push(c);
      if (banks) {
        for (let rail = 0; rail < 4; rail++) {
          const bp = bankPoint(t, ap, rail);
          if (!bp) continue;
          if (!laneClear(bs, bp.x, bp.y, ap.x, ap.y, t.num, -999)) continue;
          const c2 = mkCandidate(bs, t, pi, bp, 'bank');
          if (c2) out.push(c2);
        }
      }
    }
  }
  /* A combo is the same argument nested: the ball you may strike has to end
     up where a ghost ball for the second ball would sit. */
  if (combos) {
    for (let oi = 0; oi < objs.length; oi++) {
      const first = objs[oi];
      if (only && only.indexOf(first.num) < 0) continue;
      for (let oj = 0; oj < objs.length; oj++) {
        const second = objs[oj];
        if (second.num === first.num) continue;
        if (opts.comboTo && opts.comboTo.indexOf(second.num) < 0) continue;
        for (let pi = 0; pi < 6; pi++) {
          const ap = aimPoint(POCKETS[pi]);
          const dx = ap.x - second.x, dy = ap.y - second.y, dl = hyp(dx, dy);
          if (dl < R) continue;
          const gx = second.x - dx / dl * 2 * R, gy = second.y - dy / dl * 2 * R;
          if (gx < 3 || gx > W - 3 || gy < 3 || gy > H - 3) continue;
          if (!laneClear(bs, second.x, second.y, ap.x, ap.y, second.num, -999)) continue;
          if (!laneClear(bs, first.x, first.y, gx, gy, first.num, second.num)) continue;
          const c = mkCandidate(bs, first, pi, { x:gx, y:gy }, 'combo');
          if (c) { c.via = second.num; out.push(c); }
        }
      }
    }
  }
  out.sort((a, b) => a.hard - b.hard);
  return out;
}

/* Cushion-first, for when there is nothing to see. Only the opponent and the
   hint use these; a study is never proved by one. */
function kicks(bs, only) {
  const cue = bs[0], out = [];
  const objs = objects(bs);
  for (let oi = 0; oi < objs.length; oi++) {
    const t = objs[oi];
    if (only && only.indexOf(t.num) < 0) continue;
    for (let rail = 0; rail < 4; rail++) {
      const bp = bankPoint(cue, t, rail);
      if (!bp) continue;
      if (!laneClear(bs, cue.x, cue.y, bp.x, bp.y, 0, -999)) continue;
      if (!laneClear(bs, bp.x, bp.y, t.x, t.y, t.num, -999)) continue;
      out.push({
        angle: Math.atan2(bp.y - cue.y, bp.x - cue.x), target:t.num, pocket:-1,
        kind:'kick', cut:0, reach:hyp(bp.x - cue.x, bp.y - cue.y) + hyp(t.x - bp.x, t.y - bp.y), hard:3,
      });
    }
  }
  return out;
}

/* ------------------------------------------------------------- trying a shot

   A candidate is geometry; a shot is a fact. Direct and combination lines are
   exact under this collision model — a frictionless central impact sends a
   ball down the line of centres, which is the line the ghost was placed on —
   so those need no searching. A bank does not mirror exactly, so a bank gets a
   small fan of aims around the computed one. Either way the sim decides. */

/* Enough speed to carry the whole route and arrive with something left. On this
   cloth that is far less than it used to be, and the floor matters: leave it high
   and every shot in the game is struck at the same firm pace, which sends the cue
   ball two tables past where it was wanted. */
function powersFor(c) {
  const need = Math.sqrt(2 * A_ROLL * (c.reach * 1.35 + 200)) / 0.68;
  const p = clamp(need / V_MAX, 0.09, 1);
  return [clamp(p * 0.85, 0.07, 1), p, Math.min(1, p * 1.6)];
}
/* The softest stroke that still carries a route of this length. The aim display
   needs it: when your actual stroke cannot reach the ball you are pointing at,
   the line has to be drawn from a stroke that can, or there is nothing to aim
   with. */
function powerToReach(dist) {
  return clamp(Math.sqrt(2 * A_ROLL * (dist * 1.25 + 190)) / 0.68 / V_MAX, 0.10, 1);
}

const FAN_STRAIGHT = [0];
const FAN_BANK = [0, 0.011, -0.011, 0.024, -0.024];

function tryShot(bs, c, opts) {
  opts = opts || {};
  const fan = c.kind === 'bank' ? FAN_BANK : FAN_STRAIGHT;
  const pws = powersFor(c);
  for (let pi = 0; pi < pws.length; pi++) {
    for (let fi = 0; fi < fan.length; fi++) {
      const shot = { angle:c.angle + fan[fi], power:pws[pi], ver:0, side:0, kind:c.kind, target:c.target, pocket:c.pocket };
      const r = shoot(bs, shot);
      if (r.ev.cueScratch && !opts.allowScratch) continue;
      if (r.ev.firstHit !== c.target) continue;
      if (r.ev.potted.indexOf(c.target) < 0) continue;
      return { shot, balls:r.balls, ev:r.ev };
    }
  }
  return null;
}

/* --------------------------------------------------------------- the prover

   Beam search over candidate shots. It cannot cheat: every edge in the tree is
   a shot that was actually simulated to rest, and every node is the table that
   shot left behind. A study's par is whatever depth this reaches — a measured
   number, not an author's opinion. */

function posScore(bs) {
  const left = objects(bs).length;
  if (left === 0) return -1000;
  const cs = candidates(bs, { banks:true });
  if (!cs.length) return left * 100 + 90;
  return left * 100 + Math.min(24, cs[0].hard * 9);
}

function certify(bs0, maxShots, cfg) {
  cfg = cfg || {};
  const BEAM = cfg.beam || 5, CAP = cfg.cap || 26;
  const deadline = cfg.deadline || 0;
  let frontier = [{ bs:bs0, line:[], hard:0, cut:0 }];
  for (let depth = 0; depth < maxShots; depth++) {
    const next = [];
    for (let fi = 0; fi < frontier.length; fi++) {
      const node = frontier[fi];
      const left = objects(node.bs).length;
      /* every shot here pots at least the ball it aimed at, so a table with
         more balls than shots remaining is already lost */
      if (left === 0 || left > maxShots - depth) continue;
      if (deadline && Date.now() > deadline) return null;
      const cands = candidates(node.bs, { banks:cfg.banks !== false }).slice(0, CAP);
      let banksLeft = cfg.bankCap || 9;
      for (let ci = 0; ci < cands.length; ci++) {
        const c = cands[ci];
        if (c.kind === 'bank' && banksLeft-- <= 0) continue;
        const r = tryShot(node.bs, c);
        if (!r) continue;
        const line = node.line.concat([r.shot]);
        const hard = Math.max(node.hard, c.hard);
        const cut = Math.max(node.cut, c.cut);
        if (objects(r.balls).length === 0) return { par:depth + 1, line, hard, cut };
        next.push({ bs:r.balls, line, hard, cut, score:posScore(r.balls) });
      }
    }
    if (!next.length) return null;
    next.sort((a, b) => a.score - b.score);
    frontier = next.slice(0, BEAM);
  }
  return null;
}

/* -------------------------------------------------------------- the studies */

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function farFromPockets(x, y, m) {
  for (let i = 0; i < 6; i++) if (hyp(x - POCKETS[i].x, y - POCKETS[i].y) < m) return false;
  return true;
}
function canPlace(bs, x, y, skip) {
  if (x < R + 1 || x > W - R - 1 || y < R + 1 || y > H - R - 1) return false;
  for (let i = 0; i < bs.length; i++) {
    const b = bs[i];
    if (!b.live || b.num === skip) continue;
    if (hyp(b.x - x, b.y - y) < 2 * R + 0.8) return false;
  }
  return inPocket({ x, y }) < 0;
}

function placeStudy(rng, n) {
  const bs = [];
  const push = (num, x, y) => bs.push(ball(num, x, y));
  let guard = 0;
  const free = (x, y) => {
    if (!farFromPockets(x, y, 58)) return false;
    for (let i = 0; i < bs.length; i++) if (hyp(bs[i].x - x, bs[i].y - y) < 2 * R * 1.7) return false;
    return true;
  };
  push(0, 0, 0);                                  /* the cue, placed last */
  for (let k = 1; k <= n; k++) {
    let x = 0, y = 0, ok = false;
    for (let a = 0; a < 200 && !ok; a++) {
      guard++;
      /* a third of the balls are pushed against a cushion, because a ball on a
         rail is where the interesting cut angles live */
      if (rng() < 0.34) {
        const rail = (rng() * 4) | 0, off = R + 2 + rng() * 16;
        if (rail === 0) { x = R + 30 + rng() * (W - 2 * R - 60); y = off; }
        else if (rail === 1) { x = R + 30 + rng() * (W - 2 * R - 60); y = H - off; }
        else if (rail === 2) { x = off; y = R + 30 + rng() * (H - 2 * R - 60); }
        else { x = W - off; y = R + 30 + rng() * (H - 2 * R - 60); }
      } else {
        x = R + 22 + rng() * (W - 2 * R - 44);
        y = R + 22 + rng() * (H - 2 * R - 44);
      }
      ok = free(x, y);
    }
    if (!ok) return null;
    push(k, x, y);
  }
  /* the cue goes somewhere it can see at least something */
  let cx = 0, cy = 0, ok = false;
  for (let a = 0; a < 260 && !ok; a++) {
    cx = R + 26 + rng() * (W - 2 * R - 52);
    cy = R + 26 + rng() * (H - 2 * R - 52);
    ok = free(cx, cy) && farFromPockets(cx, cy, 74);
  }
  if (!ok) return null;
  bs[0].x = cx; bs[0].y = cy;
  /* a study crammed into one corner is a study you solve by looking once */
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (let i = 0; i < bs.length; i++) { x0 = Math.min(x0, bs[i].x); x1 = Math.max(x1, bs[i].x); y0 = Math.min(y0, bs[i].y); y1 = Math.max(y1, bs[i].y); }
  if ((x1 - x0) < W * 0.42 && (y1 - y0) < H * 0.45) return null;
  return bs;
}

function looseness(bs) {
  const cs = candidates(bs, { banks:false });
  let easy = 0;
  for (let i = 0; i < cs.length; i++) if (cs[i].hard < 0.8) easy++;
  return easy;
}
/* If every ball is already hanging over a pocket at a shallow angle, there is
   nothing here to work out. Same instinct as throwing away a clue that gives
   itself away. */
function allHangers(bs) {
  const objs = objects(bs), cs = candidates(bs, { banks:false });
  for (let i = 0; i < objs.length; i++) {
    let hung = false;
    for (let j = 0; j < cs.length; j++) if (cs[j].target === objs[i].num && cs[j].hard < 0.62) { hung = true; break; }
    if (!hung) return false;
  }
  return true;
}

function genStudy(seed, n, budgetMs) {
  const rng = mulberry32((seed * 2654435761) ^ (n * 40503) ^ 0x9e37);
  const started = Date.now(), budget = budgetMs || 2600;
  const deadline = started + budget * 0.72;
  const want = 1.62 + n * 0.13;
  let best = null, tried = 0;
  while (Date.now() < deadline && tried < 240) {
    tried++;
    const bs = placeStudy(rng, n);
    if (!bs) continue;
    if (allHangers(bs)) continue;
    let cert = certify(bs, n, { beam:5, cap:24, deadline });
    let par = n;
    if (!cert && n >= 3) { cert = certify(bs, n + 1, { beam:4, cap:20, deadline }); par = n + 1; }
    if (!cert) continue;
    const banked = cert.line.some(s => s.kind === 'bank');
    const q = cert.hard + (banked ? 0.55 : 0) + (cert.cut * 180 / Math.PI) / 70 - looseness(bs) * 0.05 - (par > n ? 0.35 : 0);
    const packed = { balls:bs, par:cert.par, line:cert.line, q, tried };
    if (!best || q > best.q) best = packed;
    if (q >= want) break;
  }
  if (best) return best;
  /* Nothing certified in the time given — rather than ship an unproven table,
     fall back to a plainer one that certainly is. */
  return genPlain(seed, n, started + budget + 900);
}
function genPlain(seed, n, stopAt) {
  const rng = mulberry32((seed * 22695477) ^ (n * 7919) ^ 0x51ed);
  const stop = Math.max(stopAt || 0, Date.now() + 700);
  for (let a = 0; a < 400 && Date.now() < stop; a++) {
    const bs = placeStudy(rng, n);
    if (!bs) continue;
    const cert = certify(bs, n + 1, { beam:3, cap:16, deadline:stop });
    if (cert) return { balls:bs, par:cert.par, line:cert.line, q:0, tried:a };
  }
  return null;
}

/* ------------------------------------------------------------------- racks */

function rack9(rng) {
  const sp = 2 * R + 0.4, dx = sp * 0.8660254;
  const ax = W * 0.715, ay = H / 2;
  const spots = [];
  const rows = [1, 2, 3, 2, 1];
  for (let r = 0; r < 5; r++) {
    for (let i = 0; i < rows[r]; i++) {
      spots.push({
        x: ax + r * dx + (rng() - 0.5) * 0.5,
        y: ay + (i - (rows[r] - 1) / 2) * sp + (rng() - 0.5) * 0.5,
      });
    }
  }
  const rest = [2, 3, 4, 5, 6, 7, 8];
  for (let i = rest.length - 1; i > 0; i--) { const j = (rng() * (i + 1)) | 0; const t = rest[i]; rest[i] = rest[j]; rest[j] = t; }
  const nums = new Array(9);
  nums[0] = 1; nums[4] = 9;                       /* apex, and the nine in the middle */
  let k = 0;
  for (let i = 0; i < 9; i++) if (nums[i] === undefined) nums[i] = rest[k++];
  const bs = [ball(0, W * 0.20, H / 2 + (rng() - 0.5) * 70)];
  for (let i = 0; i < 9; i++) bs.push(ball(nums[i], spots[i].x, spots[i].y));
  bs.sort((a, b) => a.num - b.num);
  return bs;
}

function layoutRun(rng, k, keepCue) {
  const bs = [ball(0, keepCue ? keepCue.x : W * 0.22, keepCue ? keepCue.y : H / 2)];
  for (let i = 1; i <= k; i++) {
    let x = 0, y = 0, ok = false;
    for (let a = 0; a < 300 && !ok; a++) {
      x = W * 0.30 + rng() * (W * 0.66);
      y = R + 24 + rng() * (H - 2 * R - 48);
      ok = farFromPockets(x, y, 62);
      if (ok) for (let j = 0; j < bs.length; j++) if (hyp(bs[j].x - x, bs[j].y - y) < 2 * R * 1.9) { ok = false; break; }
    }
    if (!ok) break;
    bs.push(ball(i, x, y));
  }
  return bs;
}

/* -------------------------------------------------------------- the opponent

   It reads the table with the same candidate list the prover uses, scores what
   each shot leaves behind, and then misses — the aim it picked is perturbed
   before it is played, so a bad angle on a thin cut is punished the way it
   would punish a person. It never sees a shot it could not explain. */

/* Sigma is the aim error in radians. To drop a ball from a table's length the
   line has to be right to about a degree, so these three are genuinely different
   players and not the same player at three volumes. */
const SKILLS = [
  { name:'Steady', sigma:0.042,  pnoise:0.16,  banks:false, combos:false, look:false },
  { name:'Sharp',  sigma:0.0125, pnoise:0.055, banks:true,  combos:false, look:true  },
  { name:'Deadly', sigma:0.0040, pnoise:0.020, banks:true,  combos:true,  look:true  },
];

const lowestOf = bs => { const o = objects(bs); let m = 99; for (let i = 0; i < o.length; i++) if (o[i].num < m) m = o[i].num; return m === 99 ? -1 : m; };

function aiNine(bs, skill, rng) {
  const cfg = SKILLS[clamp(skill, 0, 2)];
  const low = lowestOf(bs);
  if (low < 0) return null;
  /* Combinations are only ever worth enumerating onto the nine — that is the
     shot that ends the game, and every other combo is a worse version of a
     shot already in the list. */
  const cs = candidates(bs, { only:[low], banks:cfg.banks, combos:cfg.combos, comboTo:[9] }).slice(0, 20);
  const found = [];
  for (let i = 0; i < cs.length; i++) {
    const c = cs[i];
    const r = tryShot(bs, c);
    if (!r) continue;
    let sc = r.ev.potted.length * 100 - c.hard * 10;
    if (r.ev.cueScratch) sc -= 600;
    if (r.ev.potted.indexOf(9) >= 0 && !r.ev.cueScratch) sc += 900;
    found.push({ sc, shot:r.shot, res:r, c });
    if (found.length >= 10) break;
  }
  if (!found.length) return safety(bs, low, cfg, rng);
  found.sort((a, b) => b.sc - a.sc);
  let best = null;
  for (let i = 0; i < found.length && i < 6; i++) {
    const f = found[i];
    /* How much of this shot survives its own hand? Shoot it again a standard
       deviation either side and count what still drops. A machine that does not
       ask this takes thin cuts it has no business taking. */
    let ok = 1;
    for (let d = -1; d <= 1; d += 2) {
      const t = shoot(bs, { angle:f.shot.angle + d * cfg.sigma, power:f.shot.power, ver:0, side:0 });
      if (t.ev.potted.indexOf(f.c.target) >= 0 && !t.ev.cueScratch) ok++;
    }
    const robust = ok / 3;
    let sc = 100 * f.res.ev.potted.length * robust - f.c.hard * 8;
    if (f.res.ev.potted.indexOf(9) >= 0 && !f.res.ev.cueScratch) sc += 900 * robust;
    if (f.res.ev.cueScratch) sc -= 400;
    if (cfg.look && objects(f.res.balls).length) {
      const nl = lowestOf(f.res.balls);
      const nx = candidates(f.res.balls, { only:[nl], banks:true });
      sc -= (nx.length ? Math.min(55, nx[0].hard * 20) : 85) * robust;
    }
    if (!best || sc > best.sc) best = { sc, robust, shot:f.shot };
  }
  /* A shot only the perfect aim makes is a shot worth ducking — sometimes, and
     only if you are good enough to know it. */
  if (best.robust <= 0.34 && cfg.look && rng() < 0.5) return safety(bs, low, cfg, rng);
  return jitter(best.shot, cfg, rng, 'pot');
}

function jitter(shot, cfg, rng, why) {
  const g = () => (rng() + rng() + rng() + rng() - 2) * 0.9;   /* rough normal */
  return {
    angle: shot.angle + g() * cfg.sigma,
    power: clamp(shot.power * (1 + g() * cfg.pnoise), 0.10, 1),
    ver: 0, side: 0, why,
  };
}

/* Nothing on. Roll up to the ball you are obliged to hit and leave the table
   as unhelpful as the rules allow. */
function safety(bs, low, cfg, rng) {
  const cue = bs[0];
  let tgt = null;
  for (let i = 0; i < bs.length; i++) if (bs[i].live && bs[i].num === low) tgt = bs[i];
  if (!tgt) return null;
  const base = Math.atan2(tgt.y - cue.y, tgt.x - cue.x);
  const opts = [];
  const clear = laneClear(bs, cue.x, cue.y, tgt.x, tgt.y, 0, low);
  if (clear) for (let d = -3; d <= 3; d++) for (const p of [0.16, 0.24, 0.34]) opts.push({ angle:base + d * 0.055, power:p, ver:0, side:0 });
  const ks = kicks(bs, [low]);
  for (let i = 0; i < ks.length && i < 8; i++) for (const p of [0.30, 0.44, 0.60]) opts.push({ angle:ks[i].angle, power:p, ver:0, side:0 });
  let best = null;
  for (let i = 0; i < opts.length; i++) {
    const r = shoot(bs, opts[i]);
    if (r.ev.firstHit !== low) continue;
    let sc = 0;
    if (r.ev.cueScratch) sc -= 500;
    if (!r.ev.railAfter && !r.ev.potted.length) sc -= 400;   /* no rail after contact is a foul */
    sc += r.ev.potted.length * 90;
    const nl = lowestOf(r.balls);
    if (nl < 0) sc += 500;
    else {
      const nx = candidates(r.balls, { only:[nl], banks:true });
      sc += nx.length ? Math.min(70, nx[0].hard * 26) : 110;  /* the worse for them, the better */
    }
    if (!best || sc > best.sc) best = { sc, shot:opts[i] };
  }
  if (best) return jitter(best.shot, cfg, rng, 'safe');
  return jitter({ angle:base, power:0.30 }, cfg, rng, 'blind');
}

/* ---------------------------------------------------------------- the aim line

   Integrated with the real physics, so it cannot promise anything the table
   will not do. It stops shortly after the first contact — past that point the
   truth depends on things a line cannot draw. */
function predict(bs, shot, opts) {
  opts = opts || {};
  const w = cloneBalls(bs);
  strike(w, shot);
  const ev = newEvents();
  const cue = [{ x:w[0].x, y:w[0].y }];
  let hitAt = -1, hitNum = -1, obj = null, hitBall = null, ticks = 0;
  const cap = opts.ticks || 620;
  const tail = opts.tail === undefined ? 60 : opts.tail;
  while (ticks < cap) {
    ticks++;
    advance(w, ev, null);
    if (w[0].live) cue.push({ x:w[0].x, y:w[0].y });
    if (hitAt < 0 && ev.firstHit >= 0) {
      hitAt = ticks; hitNum = ev.firstHit;
      for (let i = 0; i < w.length; i++) if (w[i].num === hitNum) { hitBall = w[i]; obj = [{ x:w[i].x, y:w[i].y }]; }
    } else if (hitAt > 0) {
      if (hitBall.live) obj.push({ x:hitBall.x, y:hitBall.y });
      /* Once the struck ball has either dropped or run out of legs, the
         question this line was asked has been answered; the cue ball's
         remaining travel is drawn faintly and does not need watching to the
         end. Running on would cost several milliseconds a frame mid-drag. */
      const settled = !hitBall.live || (hitBall.vx === 0 && hitBall.vy === 0);
      if (settled && ticks > hitAt + tail) break;
    }
    if (!moving(w)) break;
  }
  return { cue, obj, hit:hitNum, hitAt, potted:ev.potted.slice(), pottedAt:ev.pottedAt.slice(), scratch:ev.cueScratch };
}

return {
  W, H, R, JAW, RAIL_HIT, CORNER_JAW, SIDE_JAW, POT_CORNER, RAILS, POCKETS, V_MAX, STEP,
  ball, cloneBalls, objects, cueOf, strike, advance, moving, shoot, newEvents, inPocket,
  candidates, kicks, tryShot, certify, aimPoint, posScore, laneClear, powerToReach,
  genStudy, rack9, layoutRun, aiNine, lowestOf, canPlace, mulberry32, predict, SKILLS,
};
}

/* ===========================================================================
   The table, drawn.

   Everything static — frame, cloth, mouths, cushion noses, sights — is baked
   into an offscreen canvas once per layout, because it never changes and a
   phone has better things to do sixty times a second. Only the balls, the aim
   and the small bright things on top are drawn live.
   =========================================================================== */

const E = CUSHION_ENGINE();
const { W:TW, H:TH, R:BR, JAW, POCKETS, RAILS, CORNER_JAW, SIDE_JAW } = E;
const RAILW = 34;                                   /* the frame, outside the bed */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

const BALLCOL = {
  1:'#f0c33c', 2:'#3d8bdf', 3:'#ef4a5a', 4:'#9b62d6', 5:'#f0902c',
  6:'#57c268', 7:'#a4453c', 8:'#332e3b', 9:'#f0c33c',
};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let C = {};
function readTheme() {
  C = {
    pg:css('--pg'), bed:css('--bed'), bed2:css('--bed2'), ink:css('--pi'), rail:css('--rail'),
    pocket:css('--pocket'), pdeep:css('--pocket-deep'), plip:css('--pocket-lip'),
    pa:css('--pa'), pw:css('--pw'), line:css('--ballline'),
    rim:css('--ballrim'), cue:css('--cue'), faint:css('--pfaint'), quiet:css('--pq'), dim:css('--pd'),
    sight:css('--sight'),
  };
}

/* ------------------------------------------------------------------- the view

   One transform, used for drawing and inverted for touching. In portrait the
   table turns so its long axis runs up the screen and the head rail sits under
   your thumb; nothing else in the program knows that happened. */
const V = { s:1, ox:0, oy:0, rot:0, zoom:1, px:0, py:0, vw:0, vh:0, dpr:1 };

/* The chrome floats over the felt, but it must never float over a cushion you
   have to shoot off, so the fit reserves the bands the HUD and the stroke own. */
function fitView(vw, vh) {
  const ow = TW + 2 * RAILW, oh = TH + 2 * RAILW;
  V.rot = vw / vh >= 1 ? 0 : 1;
  /* The table is inset rather than flush. You shoot by pulling away from the cue
     ball, so a ball against a cushion needs glass behind it to pull into; with the
     table edge-to-edge there was nowhere to put a finger. */
  const m = Math.max(24, Math.min(vw, vh) * 0.055);
  V.padX = m; V.padT = 54 + m * 0.35; V.padB = 60 + m * 0.35;
  V.vw = vw; V.vh = vh;
  const availW = vw - V.padX * 2, availH = vh - V.padT - V.padB;
  V.base = V.rot ? Math.min(availW / oh, availH / ow) : Math.min(availW / ow, availH / oh);
  applyZoom();
}
function applyZoom() {
  const s = V.base * V.zoom;
  const ow = TW + 2 * RAILW, oh = TH + 2 * RAILW;
  const dw = V.rot ? oh * s : ow * s, dh = V.rot ? ow * s : oh * s;
  V.s = s;
  /* clamp the pan so the table can never be dragged off the screen entirely */
  const slackX = Math.max(0, (dw - V.vw) / 2 + 40), slackY = Math.max(0, (dh - V.vh) / 2 + 40);
  V.px = clamp(V.px, -slackX, slackX); V.py = clamp(V.py, -slackY, slackY);
  V.ox = V.padX + (V.vw - 2 * V.padX - dw) / 2 + V.px + RAILW * s;
  V.oy = V.padT + (V.vh - V.padT - V.padB - dh) / 2 + V.py + RAILW * s;
}
function setT(ctx) {
  const d = V.dpr, s = V.s;
  if (V.rot) ctx.setTransform(0, -s * d, s * d, 0, V.ox * d, (V.oy + s * TW) * d);
  else ctx.setTransform(s * d, 0, 0, s * d, V.ox * d, V.oy * d);
}
function toScreen(x, y) {
  return V.rot ? { x:V.ox + V.s * y, y:V.oy + V.s * (TW - x) } : { x:V.ox + V.s * x, y:V.oy + V.s * y };
}
function toTable(px, py) {
  return V.rot ? { x:TW - (py - V.oy) / V.s, y:(px - V.ox) / V.s } : { x:(px - V.ox) / V.s, y:(py - V.oy) / V.s };
}
const PX = px => px / V.s;                          /* a width in real screen pixels */
/* the tokens are hex; a gradient needs to fade one of them to nothing */
function withA(hex, a) {
  const h = (hex || '#000').replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16) || 0;
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

/* --------------------------------------------------------------- static table */

let bake = null, bakeKey = '';
function bakedTable(vw, vh) {
  const key = [vw, vh, V.s.toFixed(3), V.ox.toFixed(1), V.oy.toFixed(1), V.rot, document.documentElement.dataset.theme || 'auto'].join('|');
  if (bake && bakeKey === key) return bake;
  if (!bake) bake = document.createElement('canvas');
  bake.width = Math.max(1, vw * V.dpr); bake.height = Math.max(1, vh * V.dpr);
  const g = bake.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, bake.width, bake.height);
  setT(g);
  drawTable(g);
  bakeKey = key;
  return bake;
}

function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function drawTable(g) {
  /* the frame */
  g.fillStyle = C.rail;
  roundRect(g, -RAILW, -RAILW, TW + 2 * RAILW, TH + 2 * RAILW, 13);
  g.fill();

  /* the cloth, with one soft gradient across it so it is not a flat slab */
  const grad = g.createLinearGradient(0, 0, TW * 0.35, TH);
  grad.addColorStop(0, C.bed); grad.addColorStop(1, C.bed2);
  g.fillStyle = grad;
  g.fillRect(0, 0, TW, TH);
  /* nap: a sparse dot field, the only texture anywhere in the game */
  g.save();
  g.beginPath(); g.rect(0, 0, TW, TH); g.clip();
  g.fillStyle = C.ink; g.globalAlpha = 0.045;
  for (let y = 4; y < TH; y += 9) for (let x = ((y / 9) & 1) ? 8.5 : 4; x < TW; x += 9) g.fillRect(x, y, 0.9, 0.9);
  g.restore();

  /* The mouths, cut through both cloth and frame. A hole is not a dark disc: it
     is lighter where the light reaches its near edge and black down the throat,
     and it has a lip. Without the lip it disappears into a rail this dark. */
  for (let i = 0; i < 6; i++) drawPocket(g, i);

  /* the cushion noses: capsules whose surface is exactly where a ball stops,
     and whose rounded ends are the jaws a ball can rattle in */
  g.strokeStyle = C.rail; g.lineCap = 'round'; g.lineWidth = 2 * JAW;
  for (let i = 0; i < RAILS.length; i++) {
    const s = RAILS[i];
    g.beginPath(); g.moveTo(s.ax, s.ay); g.lineTo(s.bx, s.by); g.stroke();
  }
  /* a hairline of light along the nose so the cushion reads as an edge — on a
     dark cloth this line is most of what tells you where the table stops */
  g.strokeStyle = C.sight; g.globalAlpha = 0.30; g.lineWidth = PX(1.2);
  for (let i = 0; i < RAILS.length; i++) {
    const s = RAILS[i];
    const nx = s.ay < 0 ? 0 : s.ay > TH ? 0 : (s.ax < 0 ? 1 : -1);
    const ny = s.ay < 0 ? 1 : s.ay > TH ? -1 : 0;
    g.beginPath();
    g.moveTo(s.ax + nx * JAW, s.ay + ny * JAW); g.lineTo(s.bx + nx * JAW, s.by + ny * JAW);
    g.stroke();
  }
  g.globalAlpha = 1;

  /* sights. They are not decoration — a bank is aimed off them. */
  g.fillStyle = C.sight; g.globalAlpha = 0.42;
  const dia = (x, y) => { g.save(); g.translate(x, y); g.rotate(Math.PI / 4); g.fillRect(-2.6, -2.6, 5.2, 5.2); g.restore(); };
  for (let k = 1; k <= 7; k++) { if (k === 4) continue; dia(TW * k / 8, -RAILW / 2); dia(TW * k / 8, TH + RAILW / 2); }
  for (let k = 1; k <= 3; k++) { dia(-RAILW / 2, TH * k / 4); dia(TW + RAILW / 2, TH * k / 4); }
  g.globalAlpha = 1;
}

/* Where a mouth is drawn, which is a little outside where its centre is —
   anything that rings a pocket has to agree with the pocket. */
function pocketCentre(i) {
  const p = POCKETS[i];
  if (p.kind === 'c') { const sx = p.x === 0 ? 1 : -1, sy = p.y === 0 ? 1 : -1; return { x:p.x - sx * 5, y:p.y - sy * 5, r:E.POT_CORNER + 2 }; }
  return { x:p.x, y:p.y + (p.dir < 0 ? -3 : 3), r:SIDE_JAW };
}

/* Drawn into the baked table, and again live over a ball that is dropping, so
   the ball goes *into* the mouth rather than sitting on top of it. */
function drawPocket(g, i) {
  const q = pocketCentre(i);
  const gr = g.createRadialGradient(q.x, q.y - q.r * 0.18, q.r * 0.1, q.x, q.y, q.r);
  gr.addColorStop(0, C.pdeep); gr.addColorStop(0.62, C.pdeep); gr.addColorStop(1, C.pocket);
  g.fillStyle = gr;
  g.beginPath(); g.arc(q.x, q.y, q.r, 0, TAU); g.fill();
  g.strokeStyle = C.plip; g.globalAlpha = 0.5; g.lineWidth = PX(1.3);
  g.beginPath(); g.arc(q.x, q.y, q.r - PX(0.7), 0, TAU); g.stroke();
  g.globalAlpha = 1;
}

function clipTable(g) { roundRect(g, -RAILW, -RAILW, TW + 2 * RAILW, TH + 2 * RAILW, 13); g.clip(); }

/* --------------------------------------------------------------------- casting

   Where does a ball sent from here in this direction first meet something? Pure
   geometry, so it answers instantly and at any speed — which is what an aim line
   has to do, since you point before you decide how hard. The physics still gets
   the last word on what happens after the meeting. */
function castRay(bs, x, y, ang, skip) {
  const ux = Math.cos(ang), uy = Math.sin(ang), D = 2 * BR;
  let bt = Infinity, hb = null;
  for (let i = 0; i < bs.length; i++) {
    const b = bs[i];
    if (!b.live || b.num === skip) continue;
    const px = b.x - x, py = b.y - y;
    const pr = px * ux + py * uy;
    if (pr <= 0) continue;
    const pp = Math.abs(py * ux - px * uy);
    if (pp >= D) continue;
    const t = pr - Math.sqrt(D * D - pp * pp);
    if (t > 0.01 && t < bt) { bt = t; hb = b; }
  }
  let tr = Infinity;
  if (ux > 1e-9) tr = Math.min(tr, (TW - BR - x) / ux);
  if (ux < -1e-9) tr = Math.min(tr, (BR - x) / ux);
  if (uy > 1e-9) tr = Math.min(tr, (TH - BR - y) / uy);
  if (uy < -1e-9) tr = Math.min(tr, (BR - y) / uy);
  let tp = Infinity, pi = -1;
  for (let i = 0; i < 6; i++) {
    const p = POCKETS[i], cap = p.kind === 'c' ? E.POT_CORNER : SIDE_JAW;
    const px = p.x - x, py = p.y - y;
    const pr = px * ux + py * uy;
    if (pr <= 0) continue;
    const pp = Math.abs(py * ux - px * uy);
    if (pp >= cap) continue;
    const t = pr - Math.sqrt(cap * cap - pp * pp);
    if (t > 0 && t < tp) { tp = t; pi = i; }
  }
  if (hb && bt < Math.min(tr, tp)) return { kind:'ball', ball:hb, t:bt, x:x + ux * bt, y:y + uy * bt };
  if (pi >= 0 && tp < tr + D) return { kind:'pocket', pocket:pi, t:tp, x:x + ux * tp, y:y + uy * tp };
  return { kind:'rail', t:tr, x:x + ux * tr, y:y + uy * tr };
}

/* ------------------------------------------------------------------- the balls */

function ballFace(g, b, alpha, scale) {
  const r = BR * (scale === undefined ? 1 : scale);
  if (r <= 0.2) return;
  g.globalAlpha = alpha === undefined ? 1 : alpha;
  /* the contact shadow: Huemeld's hard offset, softened enough to sit on cloth */
  g.fillStyle = 'rgba(0,0,0,0.19)';
  g.beginPath(); g.arc(b.x + r * 0.19, b.y + r * 0.26, r * 0.93, 0, TAU); g.fill();

  const col = b.num === 0 ? C.cue : (BALLCOL[b.num] || C.pa);
  if (b.num === 9) {
    /* the nine wears a band, the way it does on a real table */
    g.fillStyle = C.cue;
    g.beginPath(); g.arc(b.x, b.y, r, 0, TAU); g.fill();
    g.save(); g.beginPath(); g.arc(b.x, b.y, r, 0, TAU); g.clip();
    g.fillStyle = col; g.fillRect(b.x - r, b.y - r * 0.46, r * 2, r * 0.92);
    g.restore();
  } else {
    g.fillStyle = col;
    g.beginPath(); g.arc(b.x, b.y, r, 0, TAU); g.fill();
  }
  /* one soft highlight, up and to the left, on every ball, always */
  const gr = g.createRadialGradient(b.x - r * 0.34, b.y - r * 0.38, r * 0.06, b.x - r * 0.2, b.y - r * 0.24, r * 1.15);
  gr.addColorStop(0, 'rgba(255,255,255,0.44)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.07)'); gr.addColorStop(1, 'rgba(0,0,0,0.16)');
  g.fillStyle = gr;
  g.beginPath(); g.arc(b.x, b.y, r, 0, TAU); g.fill();

  g.lineWidth = PX(1.9); g.strokeStyle = C.line;
  g.beginPath(); g.arc(b.x, b.y, r - PX(0.6), 0, TAU); g.stroke();
  if (C.rim && C.rim !== 'rgba(255,255,255,0)') {
    g.lineWidth = PX(0.9); g.strokeStyle = C.rim;
    g.beginPath(); g.arc(b.x, b.y, r - PX(2.4), Math.PI * 0.62, Math.PI * 1.9); g.stroke();
  }
  g.globalAlpha = 1;
}

function ballNumber(g, b, scale) {
  if (!b.num) return;
  const r = BR * (scale === undefined ? 1 : scale);
  g.fillStyle = C.cue;
  g.beginPath(); g.arc(b.x, b.y, r * 0.5, 0, TAU); g.fill();
  g.fillStyle = '#2a2730';
  g.font = '600 ' + (r * 0.72).toFixed(2) + 'px ' + (V.rot ? '' : '') + 'ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  if (V.rot) { g.save(); g.translate(b.x, b.y); g.rotate(Math.PI / 2); g.fillText(String(b.num), 0, r * 0.03); g.restore(); }
  else g.fillText(String(b.num), b.x, b.y + r * 0.03);
}

/* ===========================================================================
   Sound. Four noises, synthesised, because a billiards game with no click is
   a slideshow — and because a downloaded sample is a thing that can fail to
   arrive on a train.
   =========================================================================== */
let AC = null, BUS = null, muted = false;
function audio() {
  if (!AC) { const K = window.AudioContext || window.webkitAudioContext; if (K) AC = new K(); }
  if (!AC) return null;
  if (AC.state === 'suspended') AC.resume();
  if (!BUS) {
    /* Everything goes through one bus into a compressor. A break is a dozen
       impacts inside a few frames, and without this they sum into a clipped
       blat — which is why the old code had to throttle them to one click. */
    BUS = AC.createGain(); BUS.gain.value = 0.95;
    const comp = AC.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 22; comp.ratio.value = 7;
    comp.attack.value = 0.003; comp.release.value = 0.16;
    BUS.connect(comp); comp.connect(AC.destination);
  }
  return AC;
}
function noise(dur, hz, q, gain, type, at) {
  const a = audio(); if (!a || muted) return;
  const n = a.sampleRate * dur | 0;
  const buf = a.createBuffer(1, Math.max(1, n), a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.4);
  const src = a.createBufferSource(); src.buffer = buf;
  const bp = a.createBiquadFilter(); bp.type = type || 'bandpass'; bp.frequency.value = hz; bp.Q.value = q;
  const g = a.createGain(); g.gain.value = gain;
  src.connect(bp); bp.connect(g); g.connect(BUS);
  src.start(a.currentTime + (at || 0));
}
function tone(hz, dur, gain, type, slideTo, at) {
  const a = audio(); if (!a || muted) return;
  const t0 = a.currentTime + (at || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(hz, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(BUS);
  o.start(t0); o.stop(t0 + dur + 0.02);
}

/* A rack breaking is not one click. Up to four impacts a frame are played for
   real, staggered so they read as separate events; anything past that is summed
   and comes back as a single body thud, which is what a pile-up actually sounds
   like. Pots never queue behind anything. */
let frameAt = 0, frameHits = 0, spill = 0;
const rnd = (a, b) => a + Math.random() * (b - a);
const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];

function clack(s, at) {
  const det = rnd(0.94, 1.06), lvl = rnd(0.85, 1.15);
  noise(0.030 + 0.02 * s, (1900 + s * 2100) * det, 2.4, (0.15 * s + 0.02) * lvl, 'bandpass', at);
  tone((680 + s * 520) * det, 0.032, 0.05 * s * lvl, 'triangle', null, at);
  if (s > 0.45) noise(0.055, 260, 1.0, 0.05 * s, 'lowpass', at);
}

function sfx(kind, str) {
  const s = clamp(str === undefined ? 0.4 : str, 0.03, 1);
  if (kind === 'clack') {
    const now = performance.now();
    if (now - frameAt > 18) {
      frameAt = now; frameHits = 0;
      if (spill > 0) { noise(0.12, 150, 0.8, Math.min(0.16, 0.05 + spill * 0.05), 'lowpass'); spill = 0; }
    }
    if (frameHits < 4) { clack(s, frameHits * 0.013); frameHits++; }
    else spill += s;
    return;
  }
  if (kind === 'rail') {
    noise(0.075, 300 + s * 240, 1.1, 0.11 * s + 0.012, 'lowpass');
    tone(95 + s * 45, 0.09, 0.05 * s, 'sine');           /* cushions have a body */
  } else if (kind === 'pot') {
    /* lip, drop, and the hollow of the pocket — and a note that climbs while a
       chain of pots is still running, so a three-ball shot arpeggiates */
    const n = Math.min(G.potChain || 0, SCALE.length - 1);
    const f = 300 * Math.pow(2, SCALE[n] / 12);
    tone(1650, 0.018, 0.045, 'square');
    noise(0.11, 190, 0.7, 0.10, 'lowpass', 0.012);
    tone(f, 0.17, 0.075, 'sine', f * 0.55, 0.012);
    noise(0.09, 120, 0.9, 0.04, 'lowpass', 0.06);
  } else if (kind === 'cue') {
    noise(0.045, 1400 + s * 900, 1.7, 0.09 * s + 0.02);
    tone(150, 0.05, 0.04 * s, 'sine', 90);
  } else if (kind === 'good') {
    const n = Math.min(G.streak || 0, SCALE.length - 1);
    const f = 520 * Math.pow(2, SCALE[n] / 12);
    tone(f, 0.10, 0.05, 'triangle', f * 1.5);
  } else if (kind === 'win') {
    for (let i = 0; i < 3; i++) tone(520 * Math.pow(2, [0, 4, 7][i] / 12), 0.16, 0.055, 'triangle', null, i * 0.065);
  } else if (kind === 'bad') { tone(210, 0.18, 0.055, 'sine', 132); }
  else if (kind === 'tick') { tone(900 + 1000 * s, 0.02, 0.022, 'square'); }
}

/* =========================================================================== */
/* storage                                                                     */

const KEY = 'cushion.v1';
let DB = { theme:'auto', sound:true, study:{}, nine:{ skill:1, w:0, l:0 }, run:{ best:0, plays:0, v2:0 } };
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) DB = Object.assign(DB, JSON.parse(raw));
  } catch (e) {}
  for (const n of [2, 3, 4]) if (!DB.study[n]) DB.study[n] = { at:1, done:{} };
  /* the run used to score in balls and now scores in points, so an old best is
     not a smaller number, it is a different unit — retire it, keep the studies */
  if (!DB.run.v2) { DB.run.best = 0; DB.run.v2 = 1; }
  muted = !DB.sound;
}
let saveT = 0;
function save() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} }, 180); }

/* =========================================================================== */
/* the generator, off the main thread                                          */

/* Two of them, not one. Building the next study takes seconds, and a hint asked
   for while that is running would queue behind it and arrive after the player
   has given up waiting — so asking and building never share a thread. */
const WK = { gen:null, solve:null };
let wid = 0, waiting = {};
function startWorker() {
  try {
    const src = 'const E = (' + CUSHION_ENGINE.toString() + ')();\n' +
      'self.onmessage = function(e){ var m = e.data;\n' +
      '  if (m.t === "gen") { var g = E.genStudy(m.seed, m.n, m.budget);\n' +
      '    postMessage({t:"gen", id:m.id, g: g ? {balls:g.balls, par:g.par, q:g.q} : null}); }\n' +
      '  else if (m.t === "solve") { var c = E.certify(m.balls, m.max, {beam:5, cap:26, deadline:Date.now()+m.budget});\n' +
      '    postMessage({t:"solve", id:m.id, line: c ? c.line : null}); }\n' +
      '};';
    const url = URL.createObjectURL(new Blob([src], { type:'text/javascript' }));
    const mk = () => {
      const w = new Worker(url);
      w.onmessage = e => { const cb = waiting[e.data.id]; if (cb) { delete waiting[e.data.id]; cb(e.data); } };
      w.onerror = () => { WK.gen = null; WK.solve = null; };
      return w;
    };
    WK.gen = mk(); WK.solve = mk();
  } catch (e) { WK.gen = null; WK.solve = null; }
}
function ask(msg, cb, timeoutMs) {
  const id = ++wid;
  const w = msg.t === 'solve' ? WK.solve : WK.gen;
  if (!w) {                            /* no worker here — do it in the open, and say so by being slow */
    setTimeout(() => {
      if (msg.t === 'gen') { const g = E.genStudy(msg.seed, msg.n, Math.min(msg.budget, 1400)); cb({ g: g ? { balls:g.balls, par:g.par, q:g.q } : null }); }
      else { const c = E.certify(msg.balls, msg.max, { beam:4, cap:20, deadline:Date.now() + 900 }); cb({ line:c ? c.line : null }); }
    }, 16);
    return;
  }
  waiting[id] = cb;
  if (timeoutMs) setTimeout(() => { if (waiting[id]) { delete waiting[id]; cb({ timeout:true }); } }, timeoutMs);
  w.postMessage(Object.assign({ id }, msg));
}

/* Studies are deterministic but not stored: №47 of the Trio is the same table
   on every device forever, because the number is the seed. What is opened is
   kept, and the next one is quietly built while you are still on this one. */
const cache = {};
const ckey = (n, i) => n + ':' + i;
function getStudy(n, i, cb) {
  const k = ckey(n, i);
  if (cache[k]) { cb(cache[k]); return; }
  ask({ t:'gen', seed:i, n, budget:n >= 4 ? 5200 : 3200 }, r => {
    if (r.g) { cache[k] = r.g; cb(r.g); } else cb(null);
  });
}
function prefetch(n, i) {
  const k = ckey(n, i);
  if (cache[k] || i > 999) return;
  ask({ t:'gen', seed:i, n, budget:n >= 4 ? 5200 : 3200 }, r => { if (r.g) cache[k] = r.g; });
}

/* =========================================================================== */
/* game state                                                                  */

const G = {
  mode:null, balls:[], phase:'idle',
  aim:0, aimTarget:0, power:0, side:0, ver:0,
  ev:null, shots:0, par:0, n:2, num:1,
  score:0, left:0, called:-1, streak:0, multRot:0,
  turn:0, skill:1, low:1, potChain:0, ff:0,
  hinted:false, hintShot:null, hintPath:null, hintT:0, aiShot:null, over:false,
  sight:3, sighted:false, blind:0, sightUsed:0, wasSighted:false,
  fx:[], trail:null, trailFade:0, pred:null, predKey:'', guide:null, guideKey:'', t0:0, rollT:0,
  shot:null, strokeT:0, cueFollow:0, hold:0, held:0, slowed:false, near:{}, aimIn:1, scoreShown:0,
};
const rngRun = () => Math.random();

function objectsLeft() { return E.objects(G.balls).length; }
function cueBall() { return G.balls[0]; }

function say(text, bad) {
  const el = document.getElementById('say');
  el.textContent = text;
  el.className = 'on' + (bad ? ' bad' : '');
  clearTimeout(say._t);
  say._t = setTimeout(() => { el.className = ''; }, 2200);
}

function pushFx(kind, x, y, extra) { G.fx.push(Object.assign({ kind, x, y, t:0 }, extra || {})); }
const wrapPi = a => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
const buzz = ms => { if (DB.sound && navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {} };

/* ------------------------------------------------------------------- sight

   The aim used to answer every question before it was asked: where the object
   ball goes, whether it drops, where the cue ball ends up. A game that answers
   itself is a game with nothing to decide, so the answer now costs something.

   Unsighted you get the line to the ghost and the ghost itself — where you will
   hit it, which is the part a player can learn to read — and nothing about what
   happens after. Spend a sighting and the whole truth comes back for that shot.

   You are given three, and the only way to get more is to pot without one. So
   the resource is earned by the skill it substitutes for, and the player who
   needs it least ends up holding the most of it when the hard shot arrives. */
const SIGHT_MAX = 6;
function resetSight() { G.sight = 3; G.sighted = false; G.blind = 0; G.sightUsed = 0; }
function spendSight() {
  if (G.phase !== 'aim' || G.over || G.sighted || G.sight <= 0) return;
  G.sight--; G.sighted = true; G.sightUsed++;
  invalidateAim(); sfx('tick', 0.8); buzz(6);
  updateHUD();
}
function earnSight(n) {
  if (G.sight >= SIGHT_MAX) return;
  G.sight = Math.min(SIGHT_MAX, G.sight + n);
}

/* Point the cue at something, now rather than eased — used when the game itself
   chooses the line, which is never a moment that wants to glide. */
function setAim(a) { G.aim = a; G.aimTarget = a; invalidateAim(); }
function aimAt(b) { const c = cueBall(); if (b && c) setAim(Math.atan2(b.y - c.y, b.x - c.x)); }

/* Everything this game defers — the opponent thinking, the opponent placing,
   a result sheet, a hint fading — belongs to the table it was scheduled on.
   Leave one running across a new game and it arrives to mutate a board it has
   never seen: an opponent's turn resuming in the middle of a solo run, a shot
   fired at a table that no longer exists. So every deferred call carries the
   era it was made in, and a new game is a new era. */
let era = 0;
function newEra() { era++; clearHint(); }
function later(fn, ms) { const mine = era; return setTimeout(() => { if (era === mine) fn(); }, ms); }

/* A hint fades itself after a few seconds; that timer is cancelled outright
   rather than merely ignored, since it is the one we hold a handle to. */
function clearHint() { clearTimeout(G.hintT); G.hintT = 0; G.hintShot = null; G.hintPath = null; }

/* --------------------------------------------------------------- taking a shot */

/* A cue does not teleport. Backswing, drive, contact, follow-through — under a
   fifth of a second all told, and the entire difference between "the ball moved"
   and "you hit it". The ball leaves at the contact frame, not at the release. */
const T_BACK = 0.085, T_DRIVE = 0.042, T_AFTER = 0.07;

function fire() {
  if (G.phase !== 'aim' || G.over) return;
