  if (G.power <= FIRE_T) { G.power = 0; return; }   /* one floor, and releaseStroke shares it */
  G.shot = { angle:G.aim, power:powerCurve(G.power), ver:G.ver, side:G.side };
  G.phase = 'stroke'; G.strokeT = 0;
  clearHint(); G.aiShot = null;
  updateHUD();
}

function strikeNow() {
  const p = G.shot.power;
  G.wasSighted = G.sighted;
  G.trail = [{ x:cueBall().x, y:cueBall().y }];
  E.strike(G.balls, G.shot);
  G.ev = E.newEvents();
  G.phase = 'rolling'; G.rollT = 0; G.hold = 0; G.held = 0; G.slowed = false; G.near = {}; G.potChain = 0; G.ff = 0;
  G.cueFollow = T_AFTER;
  sfx('cue', 0.4 + p * 0.6);
  buzz(8 + p * 16);
  G.lowBefore = G.low;
  updateHUD();
}
/* A little softer than linear, so the first part of the pull has resolution —
   but only a little, because on cloth this loose a quarter-power roll already
   crosses the table and most shots live down there. */
const powerCurve = t => 0.04 + 0.96 * Math.pow(clamp(t, 0, 1), 1.5);

function settled() {
  const ev = G.ev;
  G.trailFade = 0.34;
  /* a new shot starts from rest — the cue used to open already drawn back at the
     last shot's power, on the last shot's line */
  G.power = 0; G.aimIn = 0; G.cueFollow = 0; G.sighted = false;
  /* the balls have moved, so any cached aim reading is about a table that no
     longer exists — the key alone cannot notice that */
  G.predKey = ''; G.guideKey = '';
  if (G.mode === 'study') resolveStudy(ev);
  else if (G.mode === 'nine') resolveNine(ev);
  else resolveRun(ev);
  updateHUD();
}

/* ------------------------------------------------------------------- studies */

function resolveStudy(ev) {
  G.shots++;
  const left = objectsLeft();
  if (ev.potted.length) {
    sfx('good');
    const nm = nameShot(ev);
    if (!G.wasSighted) { G.blind++; earnSight(1); say(nm || 'Blind'); }
    else if (nm) say(nm);
  }
  if (left === 0) { finishStudy(); return; }
  if (ev.cueScratch) { reviveCue(); G.phase = 'inhand'; say('Scratch — place the cue ball', true); sfx('bad'); }
  else G.phase = 'aim';
}
function finishStudy() {
  G.phase = 'done'; G.over = true;
  const inPar = G.shots <= G.par;
  const rec = DB.study[G.n];
  const prev = rec.done[G.num];
  const clean = inPar && !G.hinted && G.sightUsed === 0;
  if (!prev || (clean && prev !== 2) || (inPar && !prev)) rec.done[G.num] = clean ? 2 : 1;
  if (rec.at <= G.num) rec.at = G.num + 1;
  save();
  prefetch(G.n, G.num + 1); prefetch(G.n, G.num + 2);
  pushFx('wave', 0, 0);
  sfx('win');
  later(() => sheetStudyDone(inPar), 1150);
}

/* -------------------------------------------------------------------- nine-ball

   Lowest ball first; anything that falls counts; the nine ends it. A miss, a
   scratch, or nothing reaching a cushion afterwards hands over the table and
   the ball with it. */
function resolveNine(ev) {
  const low = G.lowBefore;
  let foul = false, why = '';
  if (ev.firstHit !== low) { foul = true; why = ev.firstHit < 0 ? 'No contact' : 'Hit the ' + ev.firstHit + ' first'; }
  else if (!ev.railAfter && !ev.potted.length) { foul = true; why = 'Nothing reached a cushion'; }
  if (ev.cueScratch) { foul = true; why = 'Scratch'; }

  const nine = ev.potted.indexOf(9) >= 0;
  if (nine && !foul) { endNine(G.turn); return; }
  if (nine) respot(9);
  if (ev.cueScratch) reviveCue();
  G.low = E.lowestOf(G.balls);
  if (G.low < 0) { endNine(G.turn); return; }

  if (foul) {
    sfx('bad');
    G.turn = 1 - G.turn;
    G.phase = G.turn === 0 ? 'inhand' : 'aithink';
    say((G.turn === 0 ? 'Foul — ball in hand' : why + ' — ball in hand'), true);
    if (G.turn === 1) later(aiPlace, 700);
  } else if (ev.potted.length) {
    sfx('good');
    if (G.turn === 0 && !G.wasSighted) { G.blind++; earnSight(1); }
    G.phase = G.turn === 0 ? 'aim' : 'aithink';
    if (G.turn === 1) later(aiThink, 620);
  } else {
    G.turn = 1 - G.turn;
    G.phase = G.turn === 0 ? 'aim' : 'aithink';
    say(G.turn === 0 ? 'Your table' : 'Missed');
    if (G.turn === 1) later(aiThink, 620);
  }
}
function respot(num) {
  for (let i = 0; i < G.balls.length; i++) {
    const b = G.balls[i];
    if (b.num !== num) continue;
    b.live = true; b.vx = b.vy = b.sx = b.sy = 0; b.pocket = -1;
    let x = E.W * 0.75, y = E.H / 2;
    for (let k = 0; k < 400 && !E.canPlace(G.balls, x, y, num); k++) { x += 6; if (x > E.W - 30) { x = E.W * 0.55; y += 9; } if (y > E.H - 30) y = 40; }
    b.x = x; b.y = y;
  }
}
function reviveCue() {
  const c = cueBall();
  c.live = true; c.pocket = -1; c.vx = c.vy = c.sx = c.sy = 0;
  let x = E.W * 0.22, y = E.H / 2;
  for (let k = 0; k < 400 && !E.canPlace(G.balls, x, y, 0); k++) { x += 7; if (x > E.W - 30) { x = 40; y += 11; } if (y > E.H - 30) y = 40; }
  c.x = x; c.y = y;
}
function endNine(winner) {
  G.over = true; G.phase = 'done';
  if (winner === 0) { DB.nine.w++; pushFx('wave', 0, 0); sfx('win'); } else { DB.nine.l++; sfx('bad'); }
  save();
  later(() => sheetNineDone(winner), 1000);
}
function aiPlace() {
  /* the machine puts the ball where it can see the most */
  const low = G.low;
  let best = null;
  for (let a = 0; a < 220; a++) {
    const x = 30 + Math.random() * (E.W - 60), y = 30 + Math.random() * (E.H - 60);
    if (!E.canPlace(G.balls, x, y, 0)) continue;
    const c = cueBall(); const ox = c.x, oy = c.y;
    c.x = x; c.y = y;
    const cs = E.candidates(G.balls, { only:[low], banks:false });
    const sc = cs.length ? -cs[0].hard : -9;
    c.x = ox; c.y = oy;
    if (!best || sc > best.sc) best = { x, y, sc };
    if (best.sc > -0.35) break;
  }
  if (best) { cueBall().x = best.x; cueBall().y = best.y; }
  G.phase = 'aithink';
  later(aiThink, 520);
}
function aiThink() {
  if (G.over) return;
  const plan = E.aiNine(G.balls, G.skill, Math.random);
  if (!plan) { G.turn = 0; G.phase = 'aim'; return; }
  G.aiShot = plan;
  setAim(plan.angle); G.power = invPower(plan.power); G.ver = plan.ver || 0; G.side = plan.side || 0;
  syncControls();
  say(plan.why === 'safe' ? 'Playing safe' : '');
  later(() => {
    if (G.over || G.phase !== 'aithink') return;
    G.phase = 'aim'; G.lowBefore = G.low;
    fire();
  }, 780);
}
const invPower = p => Math.pow(clamp((p - 0.04) / 0.96, 0, 1), 1 / 1.5);

/* ------------------------------------------------------------------- the run */

/* Every mouth is worth something and one is worth four times as much; the set
   turns once a shot, so the good pocket is a thing you plan for rather than a
   thing that happens to you. A ball is worth its own number, so which ball you
   take is a decision too. */
const MULTS = [1, 1, 2, 2, 3, 4];
const multAt = i => MULTS[(i + G.multRot) % 6];
function rollMults() {
  G.multRot = (G.multRot + 1 + ((Math.random() * 4) | 0)) % 6;
  for (let i = 0; i < 6; i++) if (multAt(i) === 4) G.called = i;
}

function resolveRun(ev) {
  const n = ev.potted.length;
  G.shots--;
  if (n) {
    /* the whole point of the economy: certainty is worth half a shot's score */
    const bonus = (1 + 0.25 * Math.min(G.streak, 4)) * (G.wasSighted ? 1 : 2);
    let pts = 0;
    for (let i = 0; i < n; i++) {
      const m = multAt(ev.pottedAt[i]);
      const v = Math.max(1, Math.round(ev.potted[i] * m * bonus));
      pts += v;
      const q = pocketCentre(ev.pottedAt[i]);
      /* nudged in off the mouth, or a corner one is half off the table */
      pushFx('gain', q.x + (q.x < E.W / 2 ? 34 : -34), q.y + (q.y < E.H / 2 ? 26 : -26),
             { text:'+' + v, big:m >= 3 });
    }
    G.shots = Math.min(16, G.shots + (n === 1 ? 1 : n === 2 ? 3 : 6));
    G.score += pts;
    G.streak++;
    sfx('good');
    const nm = nameShot(ev);
    if (!G.wasSighted) { G.blind++; earnSight(1); say(nm ? nm + ' — blind, double' : 'Blind — double'); }
    else if (nm) say(nm);
    else if (G.streak >= 3) say(G.streak + ' in a row');
  } else { G.streak = 0; }
  if (ev.cueScratch) { G.shots--; reviveCue(); G.phase = 'inhand'; say('Scratch', true); sfx('bad'); buzz([40, 60, 40]); }
  else G.phase = 'aim';
  refillRun();
  rollMults();
  if (G.shots <= 0) {
    G.over = true; G.phase = 'done';
    if (G.score > DB.run.best) DB.run.best = G.score;
    DB.run.plays++; save();
    later(() => sheetRunDone(), 950);
  }
}
function refillRun() {
  if (objectsLeft() >= 3) return;
  const keep = E.objects(G.balls).map(b => ({ x:b.x, y:b.y }));
  const c = cueBall();
  const fresh = E.layoutRun(rngRun, 5 - keep.length, { x:c.x, y:c.y });
  let next = 1;
  const used = {};
  for (let i = 0; i < G.balls.length; i++) if (G.balls[i].live) used[G.balls[i].num] = 1;
  for (let i = 1; i < fresh.length; i++) {
    while (used[next]) next++;
    if (next > 7) next = 1;
    let ok = E.canPlace(G.balls, fresh[i].x, fresh[i].y, -1);
    if (!ok) continue;
    const nb = E.ball(next, fresh[i].x, fresh[i].y);
    G.balls.push(nb); used[next] = 1;
    pushFx('spawn', nb.x, nb.y);
  }
  /* forget the dead ones so the array cannot grow without end */
  G.balls = G.balls.filter((b, i) => i === 0 || b.live);
}
/* What just happened, said once and only when it is worth saying. Label an
   ordinary pot and the game turns into a slot machine. */
function nameShot(ev) {
  if (!ev.potted.length) return null;
  if (ev.potted.length > 2) return 'Three at once';
  if (ev.potted.length === 2) return 'Double';
  const num = ev.potted[0];
  if (ev.kick) return 'Kick';
  if (ev.firstHit >= 0 && num !== ev.firstHit) return 'Carom';
  if (ev.banked && ev.banked[num]) return 'Bank';
  return null;
}

/* ---------------------------------------------------------------- starting up */

function startStudy(n, num) {
  newEra();
  G.mode = 'study'; G.n = n; G.num = num; G.over = false; G.hinted = false; resetSight();
  G.shots = 0; G.phase = 'wait'; G.fx = []; G.balls = [];
  showScreen('play'); updateHUD();
  say('Building №' + num + '…');
  const mine = era;
  getStudy(n, num, g => {
    if (era !== mine || G.mode !== 'study' || G.num !== num) return;
    if (!g) { say('Could not build that one — try another', true); return; }
    G.balls = E.cloneBalls(g.balls);
    G.par = g.par;
    G.phase = 'aim';
    aimAt(E.objects(G.balls)[0]);
    G.power = 0; G.side = 0; G.ver = 0;
    syncControls(); updateHUD();
    document.getElementById('say').className = '';
    prefetch(n, num + 1);
  });
}
function startNine(skill) {
  newEra();
  G.mode = 'nine'; G.skill = skill; G.over = false; G.turn = 0; resetSight();
  G.balls = E.rack9(Math.random); G.low = 1; G.shots = 0;
  G.phase = 'inhand'; G.breakZone = true; G.fx = [];
  setAim(0); G.power = 0; G.side = 0; G.ver = 0;
  showScreen('play'); syncControls(); updateHUD();
  say('Place the cue behind the line, then break');
}
function startRun() {
  newEra();
  G.mode = 'run'; G.over = false; G.score = 0; G.shots = 8; G.streak = 0; resetSight();
  G.balls = E.layoutRun(rngRun, 5, null); G.fx = [];
  G.multRot = 0; G.scoreShown = 0; rollMults();
  G.phase = 'aim';
  setAim(0); G.power = 0; G.side = 0; G.ver = 0;
  showScreen('play'); syncControls(); updateHUD();
}
function replay() {
  if (G.mode === 'study') startStudy(G.n, G.num);
  else if (G.mode === 'nine') startNine(G.skill);
  else startRun();
  closeSheet();
}
function nextThing() {
  if (G.mode === 'study') startStudy(G.n, G.num + 1);
  else replay();
  closeSheet();
}

/* ===========================================================================
   The screen, the finger, and the frame.
   =========================================================================== */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const FONT = 'ui-sans-serif, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif';
const SERIF = '"Iowan Old Style", Palatino, ui-serif, Georgia, serif';

function showScreen(id) {
  ['home', 'books', 'play'].forEach(s => $(s).classList.toggle('on', s === id));
  const onTable = id === 'play';
  $('spin').style.display = onTable ? '' : 'none';
  $('sightBtn').style.display = onTable ? '' : 'none';
  if (onTable) resize();
}

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  V.dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.max(1, vw * V.dpr); cv.height = Math.max(1, vh * V.dpr);
  cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
  fitView(vw, vh);
  bakeKey = '';
  invalidateAim();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 140));

/* ------------------------------------------------------------------- the HUD */

let hudWas = '';
function updateHUD() {
  const h = $('hud');
  const cell = (v, l, warn) => `<div class="hcell"><b class="${warn ? 'warn' : ''}">${v}</b><span>${l}</span></div>`;
  let html = '';
  if (G.mode === 'study') {
    html = cell('№' + G.num, BOOKS[G.n].name) + cell(G.shots + '/' + (G.par || '–'), 'shots', G.par && G.shots > G.par);
  } else if (G.mode === 'nine') {
    html = cell(G.turn === 0 ? 'You' : E.SKILLS[G.skill].name, 'turn') + cell(G.low > 0 ? G.low : '–', 'on');
  } else if (G.mode === 'run') {
    html = cell(G.shots, 'shots', G.shots <= 2) + cell(Math.round(G.scoreShown), 'score')
         + (G.streak > 1 ? cell('\u00d7' + (1 + 0.25 * Math.min(G.streak, 4)).toFixed(2).replace(/0+$/, '').replace(/\.$/, ''), 'streak') : '')
         + cell(DB.run.best, 'best');
  }
  if (html !== hudWas) { h.innerHTML = html; hudWas = html; }
  const sb = $('sightBtn');
  sb.style.display = (G.mode && !G.over && G.phase !== 'idle') ? '' : 'none';
  $('sightN').textContent = G.sight;
  sb.classList.toggle('spent', G.sight <= 0 && !G.sighted);
  sb.classList.toggle('on', !!G.sighted);
  $('fitBtn').classList.toggle('on', V.zoom > 1.02 || Math.abs(V.px) > 2 || Math.abs(V.py) > 2);
}

function syncControls() {
  $('spinDot').style.transform = `translate(${(G.side * 14).toFixed(1)}px, ${(-G.ver * 14).toFixed(1)}px)`;
}

/* ------------------------------------------------------------------ the aim */

/* The aim, and the difference between a line that is convenient and a line that
   is true.

   A straight ray from the cue ball is exact for a centre-ball stroke, and is
   what lets the aim hold at any speed. It is also a lie the moment you put side
   on: english makes the cue ball swerve, so the ray names the wrong ball about
   one time in twenty and misses the object ball's direction by twelve degrees at
   the median. So the ray is only ever a fallback now. Where the physics can
   answer — and it can answer whenever the stroke reaches something — the drawn
   contact comes from the simulated path, curve and all.

   Two predictions can be in play. The first is your actual stroke, which is what
   the object ball's travel and the pot are read from. The second only appears
   when your stroke cannot reach the ball you are pointing at: aiming still has
   to work, so the contact is shown from the softest stroke that would get there,
   and the orange ring says the one you have chosen will not. */
function predictNow() {
  const c = cueBall();
  if (!c || !c.live) return null;
  const key = [G.aim.toFixed(3), G.power.toFixed(2), G.side.toFixed(2), G.ver.toFixed(2), G.balls.length, objectsLeft()].join(',');
  if (G.predKey === key && G.pred !== undefined) return G.pred;
  G.pred = E.predict(G.balls, { angle:G.aim, power:powerCurve(G.power), ver:G.ver, side:G.side });
  G.predKey = key;
  return G.pred;
}
function guideFor(dist) {
  const key = [G.aim.toFixed(3), G.side.toFixed(2), G.ver.toFixed(2), dist.toFixed(0), G.balls.length, objectsLeft()].join(',');
  if (G.guideKey === key && G.guide !== undefined) return G.guide;
  G.guide = E.predict(G.balls, { angle:G.aim, power:E.powerToReach(dist), ver:G.ver, side:G.side });
  G.guideKey = key;
  return G.guide;
}
const spinOn = () => Math.abs(G.side) > 0.02 || Math.abs(G.ver) > 0.02;
function invalidateAim() { G.predKey = ''; G.guideKey = ''; }

/* On cloth this loose a ball can run three table lengths through four cushions,
   and drawing all of it turns the aid into a scribble across the whole table.
   The line is cut at a length that still answers the question — where does this
   go, and does it drop — and the pocket lighting up says the rest. */
function polyUpTo(g, pts, from, to, maxLen) {
  const a = Math.max(0, from | 0), z = Math.min(pts.length - 1, to);
  if (z - a < 1) return false;
  g.beginPath(); g.moveTo(pts[a].x, pts[a].y);
  let run = 0, cut = false;
  for (let i = a + 1; i <= z; i++) {
    const seg = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    if (run + seg > maxLen) {
      const k = (maxLen - run) / (seg || 1);
      g.lineTo(pts[i - 1].x + (pts[i].x - pts[i - 1].x) * k, pts[i - 1].y + (pts[i].y - pts[i - 1].y) * k);
      cut = true; break;
    }
    run += seg; g.lineTo(pts[i].x, pts[i].y);
  }
  g.stroke();
  return !cut;
}

function poly(g, pts, from, to) {
  g.beginPath();
  const a = Math.max(0, from | 0), b = Math.min(pts.length - 1, to === undefined ? pts.length - 1 : to);
  if (b <= a) return false;
  g.moveTo(pts[a].x, pts[a].y);
  for (let i = a + 1; i <= b; i++) g.lineTo(pts[i].x, pts[i].y);
  return true;
}

function drawAim(g) {
  const c = cueBall();
  if (!c || !c.live) return;
  g.lineCap = 'round'; g.lineJoin = 'round';

  const h1 = castRay(G.balls, c.x, c.y, G.aim, 0);
  const ahead = h1.kind === 'ball';
  /* with side on, even an empty lane curves, so the physics is asked either way */
  const p = (ahead || spinOn()) ? predictNow() : null;
  const short = ahead && p && p.hitAt < 0;
  const guide = short ? guideFor(h1.t) : p;
  const shown = (guide && guide.hitAt > 0) ? guide : null;
  const fade = G.aimIn;                 /* the aid eases in after a shot settles */

  /* the cue ball's approach — the simulated one whenever there is one, because a
     straight line here is exactly what english makes untrue */
  g.strokeStyle = C.ink; g.globalAlpha = 0.5 * fade; g.lineWidth = PX(1.5);
  g.setLineDash([PX(5.5), PX(5)]);
  if (shown) polyUpTo(g, shown.cue, 0, shown.hitAt, 1e9);
  else if (p && spinOn() && p.cue.length > 2) polyUpTo(g, p.cue, 0, p.cue.length - 1, G.sighted ? 540 : 300);
  else { g.beginPath(); g.moveTo(c.x, c.y); g.lineTo(h1.x, h1.y); g.stroke(); }
  g.setLineDash([]);

  if (shown) {
    const gh = shown.cue[shown.hitAt];
    let struck = null;
    for (let i = 0; i < G.balls.length; i++) if (G.balls[i].num === shown.hit) struck = G.balls[i];
    g.globalAlpha = (short ? 0.2 : 0.42) * fade; g.lineWidth = PX(1.3); g.setLineDash([PX(3), PX(3.4)]);
    g.beginPath(); g.arc(gh.x, gh.y, BR, 0, TAU); g.stroke();
    g.setLineDash([]);
    /* the line of centres, taken from where the cue ball really arrives. Only
       once the shot has been sighted — unsighted, where you will strike it is
       yours to see and what it does afterwards is yours to judge. */
    if (struck && G.sighted) {
      const objDir = Math.atan2(struck.y - gh.y, struck.x - gh.x);
      const h2 = castRay(G.balls, struck.x, struck.y, objDir, struck.num);
      g.strokeStyle = C.pa; g.globalAlpha = (short ? 0.15 : 0.4) * fade; g.lineWidth = PX(1.6);
      g.beginPath(); g.moveTo(struck.x, struck.y); g.lineTo(h2.x, h2.y); g.stroke();
    }
  }

  if (p && G.sighted) {
    if (p.hitAt > 0) {
      if (p.obj && p.obj.length > 1) {
        g.strokeStyle = C.pa; g.globalAlpha = 0.9; g.lineWidth = PX(2.2);
        const whole = polyUpTo(g, p.obj, 0, p.obj.length - 1, 520);
        if (whole) {
          const last = p.obj[p.obj.length - 1];
          g.globalAlpha = 0.55; g.fillStyle = C.pa;
          g.beginPath(); g.arc(last.x, last.y, PX(2.8), 0, TAU); g.fill();
        }
      }
      g.strokeStyle = C.ink; g.globalAlpha = 0.26; g.lineWidth = PX(1.5);
      polyUpTo(g, p.cue, p.hitAt, p.cue.length - 1, 340);
    } else if (short && p.cue.length > 2 && !p.scratch) {
      const end = p.cue[p.cue.length - 1];
      g.strokeStyle = C.ink; g.globalAlpha = 0.4; g.lineWidth = PX(1.8);
      g.setLineDash([PX(2.5), PX(3.5)]);
      g.beginPath(); g.arc(end.x, end.y, BR, 0, TAU); g.stroke();
      g.setLineDash([]);
    }
    if (p.potted && p.potted.length) {
      /* The mouth lights up rather than gaining an outline: leather swallows a
         hairline whole. Cool, because the called pocket is already warm. */
      for (let i = 0; i < p.pottedAt.length; i++) {
        const q = pocketCentre(p.pottedAt[i]);
        const gr = g.createRadialGradient(q.x, q.y, q.r * 0.05, q.x, q.y, q.r);
        gr.addColorStop(0, withA(C.pa, 0.92));
        gr.addColorStop(0.66, withA(C.pa, 0.5));
        gr.addColorStop(1, withA(C.pa, 0.1));
        g.fillStyle = gr;
        g.beginPath(); g.arc(q.x, q.y, q.r - PX(1), 0, TAU); g.fill();
        g.strokeStyle = C.pa; g.globalAlpha = 0.95; g.lineWidth = PX(2.2);
        g.beginPath(); g.arc(q.x, q.y, q.r - PX(1.2), 0, TAU); g.stroke();
      }
    }
  }
  /* Warnings are not answers — a stroke that cannot reach, or one that puts your
     own cue ball down a hole, is about your stroke and stays visible for free. */
  if (p && p.hitAt < 0 && ahead && p.cue.length > 2 && !p.scratch && !G.sighted) {
    const end = p.cue[p.cue.length - 1];
    g.strokeStyle = C.ink; g.globalAlpha = 0.4 * fade; g.lineWidth = PX(1.8);
    g.setLineDash([PX(2.5), PX(3.5)]);
    g.beginPath(); g.arc(end.x, end.y, BR, 0, TAU); g.stroke();
    g.setLineDash([]);
  }
  if ((p && p.scratch) || (!spinOn() && h1.kind === 'pocket')) {
    /* a warning, not a reward — warm is reserved for things going right */
    g.strokeStyle = C.ink; g.globalAlpha = 0.55; g.lineWidth = PX(2.2);
    g.setLineDash([PX(3), PX(4)]);
    g.beginPath(); g.arc(c.x, c.y, BR + 7, 0, TAU); g.stroke();
    g.setLineDash([]);
  }
  g.globalAlpha = 1;
  drawCueStick(g, c);
}

/* Where the tip is this frame. At rest it sits back by the power it is holding;
   through a stroke it draws further, drives through the ball and overshoots. */
function cuePull() {
  const base = 20 + powerCurve(G.power) * 150;
  if (G.phase === 'stroke') {
    const t = G.strokeT;
    if (t < T_BACK) { const k = 1 - Math.pow(1 - t / T_BACK, 3); return base * (1 + 0.22 * k); }
    const k = clamp((t - T_BACK) / T_DRIVE, 0, 1);
    return lerp(base * 1.22, -18, k * k);
  }
  if (G.cueFollow > 0) return -18;
  return base;
}

function drawCueStick(g, c) {
  const striking = G.phase === 'stroke' || G.cueFollow > 0;
  if (!striking && G.phase !== 'aim' && G.phase !== 'aithink') return;
  const pull = cuePull();
  const dx = -Math.cos(G.aim), dy = -Math.sin(G.aim);
  const x0 = c.x + dx * (BR + pull), y0 = c.y + dy * (BR + pull);
  const x1 = c.x + dx * (BR + pull + 300), y1 = c.y + dy * (BR + pull + 300);
  g.globalAlpha = (G.phase === 'aithink' ? 0.5 : 0.8) * (G.cueFollow > 0 ? clamp(G.cueFollow / T_AFTER, 0, 1) : G.aimIn);
  g.lineCap = 'butt';
  g.strokeStyle = C.dim; g.lineWidth = PX(7);
  g.beginPath(); g.moveTo(x0 + dx * 38, y0 + dy * 38); g.lineTo(x1, y1); g.stroke();
  g.strokeStyle = C.quiet; g.lineWidth = PX(4.4);
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 + dx * 40, y0 + dy * 40); g.stroke();
  g.strokeStyle = C.pa; g.globalAlpha = 0.9;
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 + dx * 7, y0 + dy * 7); g.stroke();
  g.lineCap = 'round';
  /* the gap the cue has been drawn back through, and how hard that is — read
     where you are looking, rather than on a bar at the bottom of the screen */
  if (G.power > 0.015 && G.phase === 'aim') {
    g.strokeStyle = C.pa; g.globalAlpha = 0.5; g.lineWidth = PX(1.6);
    g.setLineDash([PX(3), PX(4)]);
    g.beginPath(); g.moveTo(c.x + dx * BR, c.y + dy * BR); g.lineTo(x0, y0); g.stroke();
    g.setLineDash([]);
    const px = c.x + dx * (BR + pull * 0.5), py = c.y + dy * (BR + pull * 0.5);
    const lab = Math.round(powerCurve(G.power) * 100) + '%';
    g.globalAlpha = 1;
    g.font = '600 ' + PX(11).toFixed(2) + 'px ' + FONT;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = PX(3.5); g.strokeStyle = C.bed; g.lineJoin = 'round';
    if (V.rot) { g.save(); g.translate(px, py); g.rotate(Math.PI / 2); g.strokeText(lab, 0, 0); g.fillStyle = C.pa; g.fillText(lab, 0, 0); g.restore(); }
    else { g.strokeText(lab, px, py); g.fillStyle = C.pa; g.fillText(lab, px, py); }
  }
  g.globalAlpha = 1;
}

/* --------------------------------------------------------------------- effects */

function drawFx(g, dt) {
  for (let i = G.fx.length - 1; i >= 0; i--) {
    const f = G.fx[i];
    f.t += dt;
    if (f.kind === 'pot') {
      const k = f.t / 0.55;
      if (k >= 1) { G.fx.splice(i, 1); continue; }
      g.globalAlpha = (1 - k) * 0.85; g.strokeStyle = C.pw; g.lineWidth = PX(2.8);
      g.beginPath(); g.arc(f.x, f.y, 14 + k * 30, 0, TAU); g.stroke();
    } else if (f.kind === 'drop') {
      /* the ball goes down the mouth rather than blinking out of existence */
      const k = f.t / 0.17;
      if (k >= 1) { G.fx.splice(i, 1); continue; }
      const e = k * k;
      ballFace(g, { num:f.num, x:lerp(f.x, f.tx, e), y:lerp(f.y, f.ty, e) }, 1 - k * 0.3, 1 - e * 0.7);
      drawPocket(g, f.pocket);
    } else if (f.kind === 'gain') {
      const k = f.t / 0.8;
      if (k >= 1) { G.fx.splice(i, 1); continue; }
      const rise = 26 * (1 - Math.pow(1 - k, 2));
      const pop = k < 0.14 ? 1 + (0.14 - k) * 2.4 : 1;
      g.globalAlpha = k > 0.6 ? (1 - k) / 0.4 : 1;
      g.font = '600 ' + PX((f.big ? 19 : 15) * pop).toFixed(2) + 'px ' + SERIF;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = PX(4); g.strokeStyle = C.bed; g.lineJoin = 'round';
      const x = f.x, y = f.y - rise;
      if (V.rot) { g.save(); g.translate(x, y); g.rotate(Math.PI / 2); g.strokeText(f.text, 0, 0); g.fillStyle = f.big ? C.pw : C.pa; g.fillText(f.text, 0, 0); g.restore(); }
      else { g.strokeText(f.text, x, y); g.fillStyle = f.big ? C.pw : C.pa; g.fillText(f.text, x, y); }
    } else if (f.kind === 'spawn') {
      const k = f.t / 0.4;
      if (k >= 1) { G.fx.splice(i, 1); continue; }
      g.globalAlpha = (1 - k) * 0.7; g.strokeStyle = C.pa; g.lineWidth = PX(2);
      g.beginPath(); g.arc(f.x, f.y, BR + 26 * (1 - k), 0, TAU); g.stroke();
    } else if (f.kind === 'wave') {
      /* the clear: one band of warm light crossing the cloth, and then paper */
      const k = f.t / 1.1;
      if (k >= 1) { G.fx.splice(i, 1); continue; }
      const x = -140 + k * (TW + 300);
      /* built from the token, not from the light theme's hex — the celebration
         used to come out wrong on a slate table */
      const gr = g.createLinearGradient(x - 150, 0, x + 150, 0);
      gr.addColorStop(0, withA(C.pw, 0)); gr.addColorStop(0.5, withA(C.pw, 0.3 * (1 - k * 0.5))); gr.addColorStop(1, withA(C.pw, 0));
      g.globalAlpha = 1; g.fillStyle = gr;
      g.save(); g.beginPath(); g.rect(0, 0, TW, TH); g.clip(); g.fillRect(x - 160, 0, 320, TH); g.restore();
    }
  }
  g.globalAlpha = 1;
}

/* ------------------------------------------------------------------ the frame */

let last = 0;

/* How fast the world runs. Real time while anything is about to happen, hurried
   once nothing is, and never hurried past a ball that is rolling at a pocket —
   that is the one second of a billiards shot worth sitting through. */
const NEAR_POCKET = BR * 3.4;
function timeScale() {
  if (G.ff) return 7;
  let creeping = false;
  for (let i = 0; i < G.balls.length; i++) {
    const b = G.balls[i];
    if (!b.live || (!b.vx && !b.vy)) continue;
    for (let k = 0; k < 6; k++) {
      const q = pocketCentre(k);
      const dx = q.x - b.x, dy = q.y - b.y;
      const dd = Math.hypot(dx, dy);
      if (dd < NEAR_POCKET && (b.vx * dx + b.vy * dy) > 0) { creeping = true; break; }
    }
    if (creeping) break;
  }
  if (creeping) return G.slowed ? 0.45 : 1;
  return 1.35 * clamp(1 + (G.rollT - 0.7) * 0.9, 1, 4.4);
}

function soundSink(kind, str, x, y, info) {
  if (kind === 'pot' && info && !info.cue) G.potChain++;
  sfx(kind, str);
  if (kind === 'clack' && !G.held) {
    /* one freeze on the shot's first contact, sized by how hard it was */
    G.hold = Math.min(0.115, 0.024 + 0.055 * str); G.held = 1;
  }
  if (kind === 'pot') {
    const q = pocketCentre(info ? info.pocket : 0);
    pushFx('pot', q.x, q.y);
    if (info && !info.cue) pushFx('drop', x, y, { num:info.num, tx:q.x, ty:q.y, pocket:info.pocket });
    if (G.held < 2) { G.hold = Math.max(G.hold, 0.07); G.held = 2; }
    buzz(16);
  }
}

function tick(ts) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.06, (ts - last) / 1000 || 0); last = ts;
  if (!$('play').classList.contains('on')) return;

  /* Smoothing belongs here and not in the pointer handler: move events arrive at
     whatever rate the browser feels like coalescing them to, and a per-event
     filter is a filter with no fixed time constant. */
  if (G.phase === 'aim' && G.aimTarget !== G.aim) {
    const k = 1 - Math.exp(-dt / 0.055);
    const dA = wrapPi(G.aimTarget - G.aim);
    G.aim = Math.abs(dA) < 0.0006 ? G.aimTarget : G.aim + dA * k;
    invalidateAim();
  }

  if (G.phase === 'stroke') {
    G.strokeT += dt;
    if (G.strokeT >= T_BACK + T_DRIVE) strikeNow();
  } else if (G.phase === 'rolling') {
    if (G.cueFollow > 0) G.cueFollow -= dt;
    if (G.hold > 0) {
      /* Hit stop. The world holds, the drawing does not — fx and audio envelopes
         keep running, and the hurry ramp must not count this as elapsed roll. */
      G.hold -= dt;
    } else {
      G.rollT += dt;
      const steps = Math.min(96, Math.max(1, Math.round(dt * timeScale() / E.STEP)));
      for (let i = 0; i < steps; i++) {
        E.advance(G.balls, G.ev, soundSink);
        const c = cueBall();
        if (G.trail && c.live && (i & 3) === 0 && G.trail.length < 900) G.trail.push({ x:c.x, y:c.y });
        if (G.hold > 0 || !E.moving(G.balls)) break;   /* a freeze set mid-loop is a freeze now */
      }
      if (!E.moving(G.balls)) { G.phase = 'settle'; settled(); }
    }
  }
  if (G.trailFade > 0) G.trailFade = Math.max(0, G.trailFade - dt);
  if (G.scoreShown !== G.score) {
    const d2 = G.score - G.scoreShown;
    G.scoreShown = Math.abs(d2) < 1 ? G.score : G.scoreShown + d2 * (1 - Math.exp(-dt / 0.14));
    updateHUD();
  }
  if (G.aimIn < 1) G.aimIn = Math.min(1, G.aimIn + dt / 0.16);
  render(dt);
}

function render(dt) {
  const vw = window.innerWidth, vh = window.innerHeight;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.pg; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(bakedTable(vw, vh), 0, 0);
  setT(ctx);
  const g = ctx;
  g.save(); clipTable(g);

  if (G.mode === 'nine' && G.breakZone && G.phase === 'inhand') {
    g.strokeStyle = C.ink; g.globalAlpha = 0.22; g.lineWidth = PX(1.2); g.setLineDash([PX(6), PX(6)]);
    g.beginPath(); g.moveTo(TW * 0.25, 0); g.lineTo(TW * 0.25, TH); g.stroke();
    g.setLineDash([]); g.globalAlpha = 1;
  }
  if (G.mode === 'run' && !G.over) {
    /* what each mouth is worth, at the mouth */
    g.font = '600 ' + PX(11).toFixed(2) + 'px ' + FONT;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    for (let i = 0; i < 6; i++) {
      const m = multAt(i);
      if (m < 2) continue;
      const q = pocketCentre(i);
      const ix = q.x < TW / 2 ? 1 : -1, iy = q.y < TH / 2 ? 1 : -1;
      const lx = q.x + ix * (q.r + 11), ly = q.y + iy * (q.r + 11);
      g.fillStyle = m >= 4 ? C.pw : C.pa;
      g.globalAlpha = m >= 4 ? 0.95 : 0.6;
      const lab = '\u00d7' + m;
      if (V.rot) { g.save(); g.translate(lx, ly); g.rotate(Math.PI / 2); g.fillText(lab, 0, 0); g.restore(); }
      else g.fillText(lab, lx, ly);
    }
    g.globalAlpha = 1;
  }
  if (G.mode === 'run' && G.called >= 0 && !G.over) {
    /* the called pocket is lit rather than ringed — a mouth this warm swallows a
       thin warm outline, but it cannot swallow being alight */
    const q = pocketCentre(G.called);
    const pulse = 0.62 + 0.3 * Math.sin(performance.now() / 340);
    const gr = g.createRadialGradient(q.x, q.y, q.r * 0.05, q.x, q.y, q.r);
    gr.addColorStop(0, withA(C.pw, 0.9 * pulse));
    gr.addColorStop(0.65, withA(C.pw, 0.42 * pulse));
    gr.addColorStop(1, withA(C.pw, 0.08));
    g.fillStyle = gr;
    g.beginPath(); g.arc(q.x, q.y, q.r - PX(1), 0, TAU); g.fill();
    g.strokeStyle = C.pw; g.globalAlpha = 0.5 + 0.4 * pulse; g.lineWidth = PX(2);
    g.beginPath(); g.arc(q.x, q.y, q.r - PX(1.2), 0, TAU); g.stroke();
    g.globalAlpha = 1;
  }

  if (G.trail && G.trail.length > 1 && (G.phase === 'rolling' || G.trailFade > 0)) {
    g.strokeStyle = C.ink; g.globalAlpha = 0.14 * (G.trailFade > 0 ? G.trailFade / 0.34 : 1);
    g.lineWidth = PX(1.6);
    poly(g, G.trail, 0, G.trail.length - 1) && g.stroke();
    g.globalAlpha = 1;
  }

  if ((G.phase === 'aim' || G.phase === 'aithink') && !G.over) drawAim(g);
  else if (G.phase === 'stroke' || G.cueFollow > 0) drawCueStick(g, cueBall());
  if (G.hintShot) drawHint(g);

  for (let i = 0; i < G.balls.length; i++) {
    const b = G.balls[i];
    if (!b.live) continue;
    if (G.mode === 'nine' && b.num === G.low && b.num > 0) {
      g.strokeStyle = C.pa; g.globalAlpha = 0.85; g.lineWidth = PX(2.2);
      g.beginPath(); g.arc(b.x, b.y, BR + PX(5), 0, TAU); g.stroke();
      g.globalAlpha = 1;
    }
    ballFace(g, b);
    if (G.mode === 'nine' || G.mode === 'run') ballNumber(g, b);
  }
  if (G.phase === 'inhand') drawInHand(g);
  drawFx(g, dt);
  g.restore();
}

function drawInHand(g) {
  const c = cueBall();
  const ok = placeOK(c.x, c.y);
  ballFace(g, c, 0.8);
  g.strokeStyle = ok ? C.pa : C.pw; g.lineWidth = PX(2); g.setLineDash([PX(4), PX(4)]);
  g.beginPath(); g.arc(c.x, c.y, BR + PX(6), 0, TAU); g.stroke();
  g.setLineDash([]);
}
function placeOK(x, y) {
  if (!E.canPlace(G.balls, x, y, 0)) return false;
  if (G.mode === 'nine' && G.breakZone && x > TW * 0.25) return false;
  return true;
}
function drawHint(g) {
  const s = G.hintShot;
  const c = cueBall(); if (!c || !c.live) return;
  if (!G.hintPath) G.hintPath = E.predict(G.balls, s, { ticks:400 });
  const p = G.hintPath;
  g.strokeStyle = C.pa; g.globalAlpha = 0.7; g.lineWidth = PX(2.2); g.setLineDash([PX(9), PX(6)]);
  polyUpTo(g, p.cue, 0, p.hitAt > 0 ? p.hitAt : p.cue.length - 1, 1e9);
  g.setLineDash([]);
  if (p.obj && p.obj.length > 1) { g.globalAlpha = 0.4; polyUpTo(g, p.obj, 0, p.obj.length - 1, 520); }
  g.globalAlpha = 1;
}

/* ------------------------------------------------------------------- touching */

const pointers = new Map();
let pinch = null;

cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  audio();
  if (pointers.size === 2) {
    stroke = null; G.power = 0;              /* a second finger is a zoom, not a stroke */
    const [a, b] = [...pointers.values()];
    pinch = { d:Math.hypot(a.x - b.x, a.y - b.y), z:V.zoom, mx:(a.x + b.x) / 2, my:(a.y + b.y) / 2, px:V.px, py:V.py };
  } else if (pointers.size === 1) {
    handleOne(e.clientX, e.clientY, true);
  }
});
cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 2 && pinch) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    V.zoom = clamp(pinch.z * (d / pinch.d), 1, 3.4);
    V.px = pinch.px + ((a.x + b.x) / 2 - pinch.mx);
    V.py = pinch.py + ((a.y + b.y) / 2 - pinch.my);
    applyZoom(); bakeKey = ''; updateHUD();
  } else if (pointers.size === 1) {
    handleOne(e.clientX, e.clientY, false);
  }
});
function up(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) G.ff = 0;
  if (pointers.size === 0 && G.phase === 'aim') releaseStroke();
  if (G.phase === 'inhand' && pointers.size === 0) {
    const c = cueBall();
    if (placeOK(c.x, c.y)) {
      G.phase = 'aim'; invalidateAim();
      if (G.mode === 'nine' && G.breakZone) { G.breakZone = false; say('Break'); }
      updateHUD();
    }
  }
}
/* A system gesture arriving mid-pull used to fire the shot. It does not now. */
function cancelled(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) G.ff = 0;
  cancelStroke();
  updateHUD();
}
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', cancelled);

/* The stroke.

   Your finger is behind the cue ball, where a hand would be: the ball goes the
   way you are pointing *away* from, and the further you pull, the harder it
   goes. Power counts from where the drag began, not from the ball, so you may
   put a finger down anywhere — near for a big swing, far out for a long lever
   and a finer angle — and still start from nothing. Let go to hit; let go
   without having pulled and you have only aimed. */
const PULL_SPAN = 150;      /* screen pixels of draw for a full stroke, always */
const LATCH = 16;           /* pull this far and the aim stops following the finger */
const AIM_DEAD = 0.020;     /* radians of slack before a latched aim moves at all */
const AIM_GAIN = 0.40;      /* and how much of the swing survives after that */
const AIM_CATCH = 0.30;     /* a swing this big is a re-aim, not a tremor */
const FIRE_T = 0.10;        /* below this a release is not a shot, in either place */
let stroke = null;


/* How far the finger can still travel before it runs out of glass. This used to
   shrink the pull to fit, which meant the same drag was a tap in one place and a
   smash in another. Now it only answers one question — has the finger run out of
   room — and when it has, the pull carries on around the arc instead. */
function roomBehind(sx, sy, ux, uy) {
  const m = 10;
  let t = Infinity;
  if (ux > 1e-6) t = Math.min(t, (V.vw - m - sx) / ux);
  if (ux < -1e-6) t = Math.min(t, (m - sx) / ux);
  if (uy > 1e-6) t = Math.min(t, (V.vh - m - sy) / uy);
  if (uy < -1e-6) t = Math.min(t, (m - sy) / uy);
  return Math.max(0, t);
}

/* The stroke, in two regimes.

   The first version of this wrote the aim on every single move, which meant the
   act of loading the shot destroyed the aim it was loading — the ghost ball
   walked while you pulled, and what fired was wherever the aim happened to be
   at the instant your finger left the glass. That is the whole of "something is
   not right".

   So: while the pull is still short the finger points the shot, as before. Once
   you have drawn past the latch the line is yours and stops chasing the finger;
   from there sideways movement is a fine adjustment through a dead zone at
   reduced gain, and movement straight back is pure power and moves the aim not
   at all. Swing far enough to mean it and the anchor comes with you. */
function handleOne(px, py, down) {
  if (G.over) return;
  const t = toTable(px, py);
  if (G.phase === 'inhand') {
    const c = cueBall();
    c.x = clamp(t.x, BR + 1, TW - BR - 1); c.y = clamp(t.y, BR + 1, TH - BR - 1);
    invalidateAim();
    return;
  }
  if (G.phase === 'rolling' || G.phase === 'stroke') { G.ff = 1; return; }
  if (G.phase !== 'aim') return;
  const c = cueBall();
  if (!c.live) return;
  const cs = toScreen(c.x, c.y);
  const sx = px - cs.x, sy = py - cs.y;
  const d = Math.hypot(sx, sy);
  if (d < 12) { if (down) stroke = null; return; }   /* atan2 is ill-conditioned here */
  const aimRaw = Math.atan2(c.y - t.y, c.x - t.x);   /* the ball goes away from the finger */

  if (down) {
    clearHint();
    G.aimTarget = aimRaw; G.aim = aimRaw;
    stroke = { ax:sx / d, ay:sy / d, aim0:aimRaw, from:d, latched:false, peak:0 };
    G.power = 0;
    updateHUD();
    return;
  }
  if (!stroke) return;

  if (!stroke.latched) {
    /* Still acquiring: the finger points the shot, and power is simply how far it
       has drawn back from where it went down. The anchor must NOT follow the
       finger here, or the pull can never accumulate and the latch never trips. */
    const pull0 = d - stroke.from;
    G.aimTarget = aimRaw;
    if (pull0 > LATCH) {
      stroke.latched = true;
      stroke.ax = sx / d; stroke.ay = sy / d; stroke.aim0 = aimRaw;
      stroke.from = d - LATCH;             /* so power carries through the latch unbroken */
      sfx('tick'); buzz(5);
      G.power = clamp(LATCH / PULL_SPAN, 0, 1);
    } else {
      stroke.aim0 = aimRaw;
      G.power = 0;
    }
  }
  if (stroke.latched) {
    const axis = sx * stroke.ax + sy * stroke.ay;
    /* Pinned against the edge of the glass: a ball frozen on a cushion has barely
       any room behind it, so from here the pull carries on around the arc — the
       aim is latched, so swinging wide costs nothing but distance. */
    const pinned = roomBehind(px, py, stroke.ax, stroke.ay) < 14;
    G.power = clamp(((pinned ? Math.max(axis, d) : axis) - stroke.from) / PULL_SPAN, 0, 1);
    if (!pinned) {
      const dA = wrapPi(aimRaw - stroke.aim0), mag = Math.abs(dA);
      if (mag > AIM_CATCH) stroke.aim0 += dA * 0.12;
      G.aimTarget = stroke.aim0 + (mag > AIM_DEAD ? Math.sign(dA) * (mag - AIM_DEAD) * AIM_GAIN : 0);
    }
    if (G.power > stroke.peak + 0.08) { stroke.peak = G.power; sfx('tick', G.power); }
  }
  updateHUD();
}

function releaseStroke() {
  if (!stroke) return;
  const p = G.power;
  stroke = null;
  G.aim = G.aimTarget;                 /* whatever was drawn is what is shot */
  if (p > FIRE_T) fire();
  else { G.power = 0; updateHUD(); }   /* the cue collapsing to rest is the message */
}
function cancelStroke() { stroke = null; G.power = 0; }

function releaseStroke() {
  if (!stroke) return;
  const p = G.power;
  stroke = null;
  if (p > 0.045) fire();
  else G.power = 0;
}

/* the spin disc: it is a cue ball, seen from where you are standing */
(function () {
  const d = $('spin');
  let on = false, tapT = 0;
  const set = e => {
    const r = d.getBoundingClientRect();
    const dx = (e.clientX - r.left - r.width / 2) / (r.width / 2 - 6);
    const dy = (e.clientY - r.top - r.height / 2) / (r.height / 2 - 6);
    const m = Math.hypot(dx, dy);
    const k = m > 1 ? 1 / m : 1;
    G.side = clamp(dx * k, -1, 1); G.ver = clamp(-dy * k, -1, 1);
    invalidateAim(); syncControls();
  };
  d.addEventListener('pointerdown', e => { d.setPointerCapture(e.pointerId); on = true; tapT = performance.now(); set(e); });
  d.addEventListener('pointermove', e => { if (on) set(e); });
  const off = e => {
    if (!on) return; on = false;
    if (performance.now() - tapT < 180 && Math.hypot(G.side, G.ver) < 0.34) { G.side = 0; G.ver = 0; invalidateAim(); syncControls(); }
  };
  d.addEventListener('pointerup', off);
  d.addEventListener('pointercancel', off);
})();

/* ---------------------------------------------------------------------- sheets */

function openSheet(html, cls) {
  const s = $('sheet');
  s.className = 'sheet' + (cls ? ' ' + cls : '');
  s.innerHTML = '<div class="grab"></div>' + html;
  $('veil').classList.add('on');
}
function closeSheet() { $('veil').classList.remove('on'); }
$('veil').addEventListener('pointerdown', e => { if (e.target === $('veil')) closeSheet(); });

const BOOKS = {
  2:{ name:'Duet', d:'Two balls, two shots' },
  3:{ name:'Trio', d:'Three balls, three shots' },
  4:{ name:'Quartet', d:'Four balls, and no room to waste one' },
};

function sheetStudyDone(inPar) {
  const clean = inPar && !G.hinted;
  openSheet(`
    <div class="sh1">${clean ? 'Cleared blind, in par' : inPar ? 'Cleared, in par' : 'Cleared'}</div>
    <div class="sh2">${BOOKS[G.n].name} №${G.num} — ${G.shots} shot${G.shots === 1 ? '' : 's'}, par ${G.par}${G.sightUsed ? ', ' + G.sightUsed + ' sighted' : ''}.</div>
    ${inPar ? (clean ? '' : '<p>The mark on the number is for clearing it in par without once sighting a shot.</p>') : '<p>Par is the shortest line the engine could shoot on this table. It is there, if you want it again.</p>'}
    <div class="rowbtns">
      <button class="pbtn" onclick="nextThing()">Next study</button>
      <button class="pbtn ghost" onclick="replay()">Shoot it again</button>
      <button class="pbtn ghost" onclick="closeSheet();goHome()">Done</button>
    </div>`, clean ? 'win' : '');
}
function sheetNineDone(winner) {
  openSheet(`
    <div class="sh1">${winner === 0 ? 'You take it' : E.SKILLS[G.skill].name + ' takes it'}</div>
    <div class="sh2">${winner === 0 ? 'The nine went down on a legal shot.' : 'The machine got there first.'}</div>
    <div class="stat"><span>Against ${E.SKILLS[G.skill].name}</span><b>${DB.nine.w}–${DB.nine.l}</b></div>
    <div class="rowbtns">
      <button class="pbtn" onclick="replay()">Rack again</button>
      <button class="pbtn ghost" onclick="closeSheet();goHome()">Done</button>
    </div>`, winner === 0 ? 'win' : '');
}
function sheetRunDone() {
  const rec = G.score >= DB.run.best && G.score > 0;
  openSheet(`
    <div class="sh1">${rec ? 'Best run yet' : 'Out of shots'}</div>
    <div class="sh2">${G.score} points${G.blind ? ', ' + G.blind + ' of them blind' : ''}.</div>
    <div class="stat"><span>Best</span><b>${DB.run.best}</b></div>
    <div class="stat"><span>Runs</span><b>${DB.run.plays}</b></div>
    <div class="rowbtns">
      <button class="pbtn" onclick="replay()">Again</button>
      <button class="pbtn ghost" onclick="closeSheet();goHome()">Done</button>
    </div>`, rec ? 'win' : '');
}
function sheetMenu() {
  const extra = G.mode === 'study'
    ? '<button class="pbtn ghost" onclick="closeSheet();$(\'hintBtn\').click()">Show me a shot</button>'
    + '<button class="pbtn ghost" onclick="closeSheet();sheetNumbers()">Pick a number</button>' : '';
  openSheet(`
    <div class="sh1">${G.mode === 'study' ? BOOKS[G.n].name + ' №' + G.num : G.mode === 'nine' ? 'Nine-ball' : 'The run'}</div>
    <div class="rowbtns">
      <button class="pbtn" onclick="closeSheet()">Keep playing</button>
      <button class="pbtn ghost" onclick="replay()">Start over</button>
      ${extra}
      <button class="pbtn ghost" onclick="closeSheet();sheetHow()">How it works</button>
      <button class="pbtn ghost" onclick="closeSheet();goHome()">Leave the table</button>
    </div>`);
}
let numPage = 0;
function sheetNumbers() {
  const rec = DB.study[G.n];
  const per = 25, from = numPage * per + 1;
  let cells = '';
  for (let i = from; i < from + per; i++) {
    const d = rec.done[i];
    cells += `<button class="${d === 2 ? 'done' : ''} ${i === G.num ? 'here' : ''}" onclick="closeSheet();startStudy(${G.n},${i})">${i}${d === 1 ? '·' : ''}</button>`;
  }
  openSheet(`
    <div class="sh1">${BOOKS[G.n].name}</div>
    <div class="sh2">Every number is the same table on every device, forever — the number is the seed.</div>
    <div class="numgrid">${cells}</div>
    <div class="pager">
      <button onclick="numPage=Math.max(0,numPage-1);sheetNumbers()">&#8592;</button>
      <span>${from}–${from + per - 1}</span>
      <button onclick="numPage++;sheetNumbers()">&#8594;</button>
    </div>`);
}
function sheetSkill() {
  const b = (i, d) => `<button class="pbtn ${i === DB.nine.skill ? '' : 'ghost'}" onclick="DB.nine.skill=${i};save();closeSheet();startNine(${i})">${E.SKILLS[i].name} — ${d}</button>`;
  openSheet(`
    <div class="sh1">Nine-ball</div>
    <div class="sh2">Lowest ball first. Anything that falls counts. The nine ends it.</div>
    <div class="rowbtns">${b(0, 'misses like a beginner')}${b(1, 'plays position')}${b(2, 'banks and combos')}</div>`);
}
function sheetHow() {
  openSheet(`
    <div class="sh1">How it works</div>
    <p><b>The stroke.</b> Put a finger on the cloth <i>behind</i> the cue ball, where
    a hand would be, and pull away from it. The ball goes the way you are pulling
    away from, and the further you pull the harder it goes. Let go to hit. Let go
    without having pulled and you have only aimed. Power counts from wherever you put
    your finger down, not from the ball, so you can start close for a quick swing or
    far out for a long lever and a finer angle.</p>
    <p><b>Sight.</b> You are shown where you will strike the ball and nothing after
    it — what the object ball then does is yours to judge. Tap the eye to sight the
    shot and the whole truth comes back: the object ball's line, where the cue ball
    ends up, and the pocket lighting if it drops. You start with three, and the only
    way to get more is to pot without one. In the run a blind pot pays double.</p>
    <p><b>The lines, once sighted.</b> The dashed line and the ring are geometry: the ring is where
    the cue ball has to be for the contact you are asking for, and an object ball
    always leaves along the line joining the two centres. The solid line is not
    geometry — it is this stroke, at this speed, with this spin, run through the
    physics the table itself runs, which is why it stops where the ball stops. Ask for
    a contact the stroke cannot reach and it draws a ring where the cue ball actually
    dies instead. The faint line past the contact is where the cue ball takes itself
    afterwards — that, more than the pot, is what the next shot is made of.</p>
    <p><b>Spin.</b> The white disc is a cue ball seen from behind. Strike it high to
    follow through, low to draw back, off to one side to bend off a cushion. Tap the
    middle to go back to centre ball.</p>
    <p><b>Studies.</b> Clear the table inside par. Every study is built on this device
    and then proved: the engine searches for a line, shoots every shot in it to rest,
    and par is however many that took. It proves them centre-ball, so spin is always
    yours to use and never the answer.</p>
    <p><b>Nine-ball.</b> Hit the lowest ball first. Anything that drops counts, and the
    nine wins. Miss it, scratch, or drive nothing to a cushion and the table goes to
    the other side with the ball in their hand.</p>
    <p><b>The run.</b> Eight shots to start, and every ball down buys another — two
    in a stroke buys three. A ball is worth its own number times whatever its pocket
    is paying, and the mouths change price every shot, so the lit one is worth
    planning for. Pot on consecutive shots and the streak multiplies everything. It
    ends when the shots do.</p>
    <div class="rowbtns"><button class="pbtn" onclick="closeSheet()">Right</button></div>`);
}

/* --------------------------------------------------------------------- home */

function drawMark(cvs, kind) {
  const d = Math.min(window.devicePixelRatio || 1, 2.5);
  const w = cvs.clientWidth || 54, h = cvs.clientHeight || 54;
  cvs.width = w * d; cvs.height = h * d;
  const g = cvs.getContext('2d');
  g.setTransform(d, 0, 0, d, 0, 0);
  g.clearRect(0, 0, w, h);
  const pad = 3, bw = w - pad * 2, bh = bw * 0.5, by = (h - bh) / 2;
  g.fillStyle = C.rail; roundRect(g, pad, by - 3.5, bw, bh + 7, 4); g.fill();
  g.fillStyle = C.bed; g.fillRect(pad + 2.5, by, bw - 5, bh);
  g.fillStyle = C.pocket;
  const px = [pad + 3.5, pad + bw / 2, pad + bw - 3.5], py = [by + 0.5, by + bh - 0.5];
  for (const x of px) for (const y of py) { g.beginPath(); g.arc(x, y, 2.5, 0, TAU); g.fill(); }
  const dot = (fx, fy, col, r) => {
    g.fillStyle = col; g.beginPath(); g.arc(pad + 2.5 + fx * (bw - 5), by + fy * bh, r || 3.1, 0, TAU); g.fill();
    g.lineWidth = 0.9; g.strokeStyle = C.line; g.stroke();
  };
  if (kind === 'study') {
    g.strokeStyle = C.ink; g.globalAlpha = 0.4; g.lineWidth = 0.9; g.setLineDash([2, 2]);
    g.beginPath(); g.moveTo(pad + 2.5 + 0.2 * (bw - 5), by + 0.7 * bh); g.lineTo(pad + 2.5 + 0.62 * (bw - 5), by + 0.32 * bh); g.stroke();
    g.setLineDash([]); g.globalAlpha = 1;
    dot(0.2, 0.7, C.cue); dot(0.68, 0.28, '#ef4a5a');
  } else if (kind === 'nine') {
    dot(0.18, 0.5, C.cue);
    dot(0.62, 0.5, '#f0c33c'); dot(0.76, 0.34, '#3d8bdf'); dot(0.76, 0.66, '#57c268'); dot(0.9, 0.5, '#9b62d6');
  } else {
    dot(0.16, 0.62, C.cue);
    dot(0.5, 0.3, '#3d8bdf'); dot(0.66, 0.66, '#f0902c'); dot(0.84, 0.4, '#57c268');
    g.strokeStyle = C.pw; g.lineWidth = 1.5;
    g.beginPath(); g.arc(pad + bw - 3.5, by + bh - 0.5, 4.2, 0, TAU); g.stroke();
  }
}

/* The launcher mark, drawn by the same routine that draws a ball on the table.
   It is not a picture of a shot — it is one: the ghost sits exactly two radii
   back along the line of centres, so the cue ball, the ghost and the object
   ball are collinear because the arithmetic says so, not because it looked
   right. Exported so the icon files can be rendered from the game itself. */
function drawIcon(g, size, bleed) {
  const U = 68, scale = size / U, keep = V.s;
  V.s = scale;
  g.setTransform(scale, 0, 0, scale, 0, 0);
  g.fillStyle = C.pg;
  if (bleed) g.fillRect(0, 0, U, U); else { roundRect(g, 0, 0, U, U, 14); g.fill(); }
  /* the instant of contact: the two centres are exactly two radii apart, which
     is the only distance at which this picture is true */
  const ang = -0.70;
  const ux = Math.cos(ang), uy = Math.sin(ang);
  const cue = { num:0, x:22.5, y:45.5 };
  const obj = { num:3, x:cue.x + ux * 2 * BR, y:cue.y + uy * 2 * BR };
  g.lineCap = 'round';
  g.strokeStyle = C.ink; g.globalAlpha = 0.42; g.lineWidth = PX(size * 0.03);
  g.setLineDash([PX(size * 0.052), PX(size * 0.05)]);
  g.beginPath(); g.moveTo(cue.x - ux * (BR + 3), cue.y - uy * (BR + 3));
  g.lineTo(cue.x - ux * (BR + 17), cue.y - uy * (BR + 17)); g.stroke();
  g.setLineDash([]);
  /* and the way the object ball has to leave, which is the line of centres */
  g.strokeStyle = C.pa; g.globalAlpha = 0.92; g.lineWidth = PX(size * 0.04);
  g.beginPath(); g.moveTo(obj.x + ux * (BR + 3), obj.y + uy * (BR + 3));
  g.lineTo(obj.x + ux * (BR + 15), obj.y + uy * (BR + 15)); g.stroke();
  g.globalAlpha = 1;
  ballFace(g, cue); ballFace(g, obj);
  V.s = keep;
}
window.CUSHION_MARK = drawIcon;

function buildHome() {
  const list = $('modeList');
  const done = n => Object.keys(DB.study[n].done).length;
  const rows = [
    { k:'study', n:'Studies', d:'Clear the table inside par. Certified, never authored.', c:(done(2) + done(3) + done(4)) + ' done', go:() => showBooks() },
    { k:'nine', n:'Nine-ball', d:'Lowest ball first, against a machine that aims like a person.', c:DB.nine.w + '–' + DB.nine.l, go:() => sheetSkill() },
    { k:'run', n:'The run', d:'Every ball down buys another shot. Keep it going.', c:DB.run.best ? 'best ' + DB.run.best : '', go:() => startRun() },
  ];
  list.innerHTML = rows.map(r => `<button class="mode" data-k="${r.k}"><canvas></canvas><div><div class="n">${r.n}</div><div class="d">${r.d}</div></div><div class="c">${r.c}</div></button>`).join('');
  [...list.children].forEach((el, i) => {
    drawMark(el.querySelector('canvas'), rows[i].k);
    el.addEventListener('click', rows[i].go);
  });
}
function showBooks() {
  const list = $('bookList');
  list.innerHTML = [2, 3, 4].map(n => {
    const rec = DB.study[n], d = Object.keys(rec.done).length;
    return `<button class="book" data-n="${n}"><canvas></canvas><div><div class="n">${BOOKS[n].name}</div><div class="d">${BOOKS[n].d}</div></div><div class="c">${d ? d + ' cleared' : '—'}</div></button>`;
  }).join('');
  [...list.children].forEach(el => {
    const n = +el.dataset.n;
    drawMark(el.querySelector('canvas'), 'study');
    el.addEventListener('click', () => startStudy(n, DB.study[n].at));
  });
  showScreen('books');
}
function goHome() { newEra(); G.mode = null; G.over = false; G.phase = 'idle'; buildHome(); showScreen('home'); }

/* ------------------------------------------------------------------- chrome */

$('backBtn').addEventListener('click', goHome);
$('booksBack').addEventListener('click', goHome);
$('menuBtn').addEventListener('click', sheetMenu);
$('howBtn').addEventListener('click', sheetHow);
$('fitBtn').addEventListener('click', () => { V.zoom = 1; V.px = 0; V.py = 0; applyZoom(); bakeKey = ''; updateHUD(); });
$('themeBtn').addEventListener('click', () => {
  DB.theme = DB.theme === 'auto' ? 'paper' : DB.theme === 'paper' ? 'slate' : 'auto';
  applyTheme(); save();
  say('Theme: ' + DB.theme);
});
$('soundBtn').addEventListener('click', () => { DB.sound = !DB.sound; muted = !DB.sound; save(); sfx('tick'); say(DB.sound ? 'Sound on' : 'Sound off'); });
$('sightBtn').addEventListener('click', spendSight);
$('hintBtn').addEventListener('click', () => {
  if (G.phase !== 'aim' || G.over) return;
  $('hintBtn').textContent = '…';
  const finish = shot => {
    $('hintBtn').textContent = '?';
    if (!shot) { say('Nothing certain from here', true); return; }
    G.hinted = true;
    G.hintShot = shot; G.hintPath = null;
    setAim(shot.angle); G.power = invPower(shot.power); G.ver = 0; G.side = 0;
    syncControls(); updateHUD();
    say('This one goes');
    G.hintT = setTimeout(() => { G.hintShot = null; G.hintT = 0; }, 5000);
  };
  const anyPot = () => {
    const only = G.mode === 'nine' ? [G.low] : E.objects(G.balls).map(b => b.num);
    const cs = E.candidates(G.balls, { only, banks:true, combos:G.mode === 'nine' });
    for (let i = 0; i < cs.length && i < 20; i++) { const t = E.tryShot(G.balls, cs[i]); if (t) return t.shot; }
    return null;
  };
  if (G.mode === 'study') {
    /* Ask for a line one shot longer than the balls left: from a position the
       player has spoiled, a clean line may no longer exist, and a shot that
       simply drops something is better advice than a shrug. */
    ask({ t:'solve', balls:E.cloneBalls(G.balls), max:objectsLeft() + 1, budget:2400 },
      r => finish((r.line && r.line[0]) || anyPot()), 2900);
  } else {
    finish(anyPot());
  }
});

function applyTheme() {
  const t = DB.theme;
  document.documentElement.dataset.theme = t === 'auto' ? '' : t;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  readTheme();
  bakeKey = '';
  const dark = t === 'slate' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  [...document.querySelectorAll('meta[name="theme-color"]')].forEach(m => { m.media = ''; m.content = dark ? '#191519' : '#ece9e1'; });
  buildHome();
  if ($('books').classList.contains('on')) showBooks();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (DB.theme === 'auto') applyTheme(); });

/* --------------------------------------------------------------------- boot */

load();
readTheme();
startWorker();
applyTheme();
buildHome();
showScreen('home');
resize();
requestAnimationFrame(tick);
for (const n of [2, 3, 4]) prefetch(n, DB.study[n].at);
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
