    h.innerHTML = cell(G.turn === 0 ? 'You' : E.SKILLS[G.skill].name, 'turn') + cell(G.low > 0 ? G.low : '–', 'on');
  } else if (G.mode === 'run') {
    h.innerHTML = cell(G.shots, 'shots', G.shots <= 2) + cell(G.score, 'score') + cell(DB.run.best, 'best');
  }
  $('hintBtn').style.display = (G.phase === 'aim' && !G.over) ? '' : 'none';
  $('fitBtn').classList.toggle('on', V.zoom > 1.02 || Math.abs(V.px) > 2 || Math.abs(V.py) > 2);
}

function syncControls() {
  const bar = $('stroke'), grip = $('strokeGrip'), fill = $('strokeFill');
  const Wb = bar.clientWidth || 300;
  const left = 8 + (1 - clamp(G.power, 0, 1)) * (Wb - 50);
  grip.style.left = left + 'px';
  fill.style.left = (left + 17) + 'px';
  fill.style.width = Math.max(0, Wb - left - 17) + 'px';
  const lbl = $('strokeLbl');
  lbl.textContent = G.power > 0.02 ? Math.round(powerCurve(G.power) * 100) + '%' : 'Pull back';
  lbl.style.justifyContent = G.power > 0.55 ? 'flex-end' : 'flex-start';
  bar.classList.toggle('armed', G.power > 0.02);
  $('spinDot').style.transform = `translate(${(G.side * 14).toFixed(1)}px, ${(-G.ver * 14).toFixed(1)}px)`;
}

/* ------------------------------------------------------------------ the aim */

function predictNow() {
  const c = cueBall();
  if (!c || !c.live) return null;
  const key = [G.aim.toFixed(4), G.power.toFixed(3), G.side.toFixed(2), G.ver.toFixed(2), G.balls.length, objectsLeft()].join(',');
  if (G.predKey === key && G.pred) return G.pred;
  G.pred = E.predict(G.balls, { angle:G.aim, power:powerCurve(G.power), ver:G.ver, side:G.side }, { ticks:280 });
  G.predKey = key;
  return G.pred;
}

function poly(g, pts, from, to) {
  g.beginPath();
  const a = Math.max(0, from | 0), b = Math.min(pts.length - 1, to === undefined ? pts.length - 1 : to);
  if (b <= a) return false;
  g.moveTo(pts[a].x, pts[a].y);
  for (let i = a + 1; i <= b; i++) g.lineTo(pts[i].x, pts[i].y);
  return true;
}

function drawAim(g) {
  const c = cueBall();
  if (!c || !c.live) return;

  g.lineCap = 'round'; g.lineJoin = 'round';

  /* Where the aim points, at any speed. Geometry answers this, so the line is
     the same length whether you are about to feather it or murder it. */
  const h1 = castRay(G.balls, c.x, c.y, G.aim, 0);
  g.strokeStyle = C.ink; g.globalAlpha = 0.5; g.lineWidth = PX(1.5);
  g.setLineDash([PX(5.5), PX(5)]);
  g.beginPath(); g.moveTo(c.x, c.y); g.lineTo(h1.x, h1.y); g.stroke();
  g.setLineDash([]);

  /* Now the physics: how far this much speed actually carries, and what the cue
     ball does to itself once it has hit something. */
  const p = predictNow();
  const short = p && p.hitAt < 0 && h1.kind === 'ball';   /* pointed at it, cannot reach it */

  if (h1.kind === 'ball') {
    const struck = h1.ball;
    const objDir = Math.atan2(struck.y - h1.y, struck.x - h1.x);
    /* the ghost: where the cue ball has to be for the contact you are asking for */
    g.globalAlpha = short ? 0.2 : 0.42; g.lineWidth = PX(1.3); g.setLineDash([PX(3), PX(3.4)]);
    g.beginPath(); g.arc(h1.x, h1.y, BR, 0, TAU); g.stroke();
    g.setLineDash([]);
    /* and the line of centres, which is the way the object ball must leave */
    const h2 = castRay(G.balls, struck.x, struck.y, objDir, struck.num);
    g.strokeStyle = C.pa; g.globalAlpha = short ? 0.15 : 0.4; g.lineWidth = PX(1.6);
    g.beginPath(); g.moveTo(struck.x, struck.y); g.lineTo(h2.x, h2.y); g.stroke();
  }

  if (p) {
    if (p.hitAt > 0) {
      if (p.obj && p.obj.length > 1) {
        g.strokeStyle = C.pa; g.globalAlpha = 0.9; g.lineWidth = PX(2.2);
        if (poly(g, p.obj, 0, p.obj.length - 1)) g.stroke();
        const last = p.obj[p.obj.length - 1];
        g.globalAlpha = 0.55; g.fillStyle = C.pa;
        g.beginPath(); g.arc(last.x, last.y, PX(2.8), 0, TAU); g.fill();
      }
      g.strokeStyle = C.ink; g.globalAlpha = 0.26; g.lineWidth = PX(1.5);
      if (poly(g, p.cue, p.hitAt, p.cue.length - 1)) g.stroke();
    } else if (p.cue.length > 2 && !p.scratch) {
      /* it does not get there. Say so where it stops, rather than drawing a
         line that promises a contact this stroke cannot make. */
      const end = p.cue[p.cue.length - 1];
      g.strokeStyle = C.pw; g.globalAlpha = 0.7; g.lineWidth = PX(1.8);
      g.setLineDash([PX(2.5), PX(3.5)]);
      g.beginPath(); g.arc(end.x, end.y, BR, 0, TAU); g.stroke();
      g.setLineDash([]);
    }
    if (p.potted && p.potted.length) {
      /* inside the mouth, not around it — a ring drawn outside a corner pocket
         is a ring drawn off the table, where the clip eats it */
      g.strokeStyle = C.pw; g.globalAlpha = 0.95; g.lineWidth = PX(3);
      for (let i = 0; i < p.pottedAt.length; i++) {
        const q = pocketCentre(p.pottedAt[i]);
        g.beginPath(); g.arc(q.x, q.y, q.r - 3.5, 0, TAU); g.stroke();
      }
    }
    if (p.scratch) {
      g.strokeStyle = C.pw; g.globalAlpha = 0.85; g.lineWidth = PX(2.2);
      g.beginPath(); g.arc(c.x, c.y, BR + 7, 0, TAU); g.stroke();
    }
  }
  g.globalAlpha = 1;

  drawCueStick(g, c);
}

function drawCueStick(g, c) {
  if (G.phase !== 'aim' && G.phase !== 'aithink') return;
  const pull = 20 + powerCurve(G.power) * 95;
  const dx = -Math.cos(G.aim), dy = -Math.sin(G.aim);
  const x0 = c.x + dx * (BR + pull), y0 = c.y + dy * (BR + pull);
  const x1 = c.x + dx * (BR + pull + 420), y1 = c.y + dy * (BR + pull + 420);
  g.globalAlpha = G.phase === 'aithink' ? 0.5 : 0.8;
  g.lineCap = 'butt';
  g.strokeStyle = C.dim; g.lineWidth = PX(7);
  g.beginPath(); g.moveTo(x0 + dx * 38, y0 + dy * 38); g.lineTo(x1, y1); g.stroke();
  g.strokeStyle = C.quiet; g.lineWidth = PX(4.4);
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 + dx * 40, y0 + dy * 40); g.stroke();
  g.strokeStyle = C.pa; g.globalAlpha = 0.9;
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 + dx * 7, y0 + dy * 7); g.stroke();
  g.globalAlpha = 1; g.lineCap = 'round';
}

/* --------------------------------------------------------------------- effects */

function drawFx(g, dt) {
  for (let i = G.fx.length - 1; i >= 0; i--) {
    const f = G.fx[i];
    f.t += dt;
    if (f.kind === 'pot') {
      const k = f.t / 0.55;
      if (k >= 1) { G.fx.splice(i, 1); continue; }
      g.globalAlpha = (1 - k) * 0.85; g.strokeStyle = C.pw; g.lineWidth = PX(2.8);
      g.beginPath(); g.arc(f.x, f.y, 14 + k * 30, 0, TAU); g.stroke();
    } else if (f.kind === 'spawn') {
      const k = f.t / 0.4;
      if (k >= 1) { G.fx.splice(i, 1); continue; }
      g.globalAlpha = (1 - k) * 0.7; g.strokeStyle = C.pa; g.lineWidth = PX(2);
      g.beginPath(); g.arc(f.x, f.y, BR + 26 * (1 - k), 0, TAU); g.stroke();
    } else if (f.kind === 'wave') {
      /* the clear: one band of warm light crossing the cloth, and then paper */
      const k = f.t / 1.1;
      if (k >= 1) { G.fx.splice(i, 1); continue; }
      const x = -140 + k * (TW + 300);
      const gr = g.createLinearGradient(x - 150, 0, x + 150, 0);
      gr.addColorStop(0, 'rgba(200,95,24,0)'); gr.addColorStop(0.5, 'rgba(200,95,24,' + (0.3 * (1 - k * 0.5)).toFixed(3) + ')'); gr.addColorStop(1, 'rgba(200,95,24,0)');
      g.globalAlpha = 1; g.fillStyle = gr;
      g.save(); g.beginPath(); g.rect(0, 0, TW, TH); g.clip(); g.fillRect(x - 160, 0, 320, TH); g.restore();
    }
  }
  g.globalAlpha = 1;
}

/* ------------------------------------------------------------------ the frame */

let last = 0;
function soundSink(kind, str, x, y) {
  sfx(kind, str);
  if (kind === 'pot') pushFx('pot', x, y);
}

function tick(ts) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.06, (ts - last) / 1000 || 0); last = ts;
  if (!$('play').classList.contains('on')) return;

  if (G.phase === 'rolling') {
    G.rollT += dt;
    /* real time to begin with; a long dying roll is hurried along, because
       watching a ball creep for four seconds is not the game */
    const scale = 1.3 * (G.rollT > 3.0 ? Math.min(3.2, 1 + (G.rollT - 3.0) * 1.2) : 1);
    const steps = Math.min(64, Math.max(1, Math.round(dt * scale / E.STEP)));
    for (let i = 0; i < steps; i++) {
      E.advance(G.balls, G.ev, soundSink);
      const c = cueBall();
      if (G.trail && c.live && (i & 3) === 0) G.trail.push({ x:c.x, y:c.y });
      if (!E.moving(G.balls)) break;
    }
    if (!E.moving(G.balls)) { G.phase = 'settle'; settled(); }
  }
  render(dt);
}

function render(dt) {
  const vw = window.innerWidth, vh = window.innerHeight;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.pg; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(bakedTable(vw, vh), 0, 0);
  setT(ctx);
  const g = ctx;
  g.save(); clipTable(g);

  if (G.mode === 'nine' && G.breakZone && G.phase === 'inhand') {
    g.strokeStyle = C.ink; g.globalAlpha = 0.22; g.lineWidth = PX(1.2); g.setLineDash([PX(6), PX(6)]);
    g.beginPath(); g.moveTo(TW * 0.25, 0); g.lineTo(TW * 0.25, TH); g.stroke();
    g.setLineDash([]); g.globalAlpha = 1;
  }
  if (G.mode === 'run' && G.called >= 0 && !G.over) {
    const q = pocketCentre(G.called);
    g.strokeStyle = C.pw; g.globalAlpha = 0.5 + 0.22 * Math.sin(performance.now() / 320);
    g.lineWidth = PX(2.4);
    g.beginPath(); g.arc(q.x, q.y, q.r + 4, 0, TAU); g.stroke();
    g.globalAlpha = 1;
  }

  if (G.trail && G.trail.length > 1) {
    g.strokeStyle = C.ink; g.globalAlpha = 0.14; g.lineWidth = PX(1.6);
    poly(g, G.trail, 0, G.trail.length - 1) && g.stroke();
    g.globalAlpha = 1;
  }

  if ((G.phase === 'aim' || G.phase === 'aithink') && !G.over) drawAim(g);
  if (G.hintShot) drawHint(g);

  for (let i = 0; i < G.balls.length; i++) {
    const b = G.balls[i];
    if (!b.live) continue;
    if (G.mode === 'nine' && b.num === G.low && b.num > 0) {
      g.strokeStyle = C.pa; g.globalAlpha = 0.85; g.lineWidth = PX(2.2);
      g.beginPath(); g.arc(b.x, b.y, BR + PX(5), 0, TAU); g.stroke();
      g.globalAlpha = 1;
    }
    ballFace(g, b);
    if (G.mode === 'nine') ballNumber(g, b);
  }
  if (G.phase === 'inhand') drawInHand(g);
  drawFx(g, dt);
  g.restore();
}

function drawInHand(g) {
  const c = cueBall();
  const ok = placeOK(c.x, c.y);
  ballFace(g, c, 0.8);
  g.strokeStyle = ok ? C.pa : C.pw; g.lineWidth = PX(2); g.setLineDash([PX(4), PX(4)]);
  g.beginPath(); g.arc(c.x, c.y, BR + PX(6), 0, TAU); g.stroke();
  g.setLineDash([]);
}
function placeOK(x, y) {
  if (!E.canPlace(G.balls, x, y, 0)) return false;
  if (G.mode === 'nine' && G.breakZone && x > TW * 0.25) return false;
  return true;
}
function drawHint(g) {
  const s = G.hintShot;
  const c = cueBall(); if (!c || !c.live) return;
  const p = E.predict(G.balls, s, { ticks:280 });
  g.strokeStyle = C.pw; g.globalAlpha = 0.55; g.lineWidth = PX(2.2); g.setLineDash([PX(9), PX(6)]);
  poly(g, p.cue, 0, p.hitAt > 0 ? p.hitAt : p.cue.length - 1) && g.stroke();
  g.setLineDash([]);
  if (p.obj && p.obj.length > 1) { g.globalAlpha = 0.4; poly(g, p.obj, 0, p.obj.length - 1) && g.stroke(); }
  g.globalAlpha = 1;
}

/* ------------------------------------------------------------------- touching */

const pointers = new Map();
let pinch = null;

cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  audio();
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d:Math.hypot(a.x - b.x, a.y - b.y), z:V.zoom, mx:(a.x + b.x) / 2, my:(a.y + b.y) / 2, px:V.px, py:V.py };
  } else if (pointers.size === 1) {
    handleOne(e.clientX, e.clientY, true);
  }
});
cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 2 && pinch) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    V.zoom = clamp(pinch.z * (d / pinch.d), 1, 3.4);
    V.px = pinch.px + ((a.x + b.x) / 2 - pinch.mx);
    V.py = pinch.py + ((a.y + b.y) / 2 - pinch.my);
    applyZoom(); bakeKey = ''; updateHUD();
  } else if (pointers.size === 1) {
    handleOne(e.clientX, e.clientY, false);
  }
});
function up(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (G.phase === 'inhand' && pointers.size === 0) {
    const c = cueBall();
    if (placeOK(c.x, c.y)) {
      G.phase = 'aim'; G.predKey = '';
      if (G.mode === 'nine' && G.breakZone) { G.breakZone = false; say('Break'); }
      updateHUD();
    }
  }
}
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);

function handleOne(px, py, down) {
  if (G.over) return;
  const t = toTable(px, py);
  if (G.phase === 'inhand') {
    const c = cueBall();
    const nx = clamp(t.x, BR + 1, TW - BR - 1), ny = clamp(t.y, BR + 1, TH - BR - 1);
    c.x = nx; c.y = ny; G.predKey = '';
    return;
  }
  if (G.phase !== 'aim') return;
  const c = cueBall();
  if (!c.live) return;
  const dx = t.x - c.x, dy = t.y - c.y;
  if (Math.hypot(dx, dy) < 24) return;         /* too close to mean anything */
  G.aim = Math.atan2(dy, dx);
  G.hintShot = null;
  updateHUD();
}

/* the stroke: pull it back and let go */
(function () {
  const bar = $('stroke');
  let drag = null;
  bar.addEventListener('pointerdown', e => {
    if (G.phase !== 'aim' || G.over) return;
    bar.setPointerCapture(e.pointerId);
    bar.classList.add('pulling');
    drag = { x:e.clientX, p:G.power };
    audio();
  });
  bar.addEventListener('pointermove', e => {
    if (!drag) return;
    const span = Math.max(60, bar.clientWidth - 50);
    G.power = clamp(drag.p + (drag.x - e.clientX) / span, 0, 1);
    syncControls();
    if (Math.abs(G.power - (drag.last || 0)) > 0.08) { drag.last = G.power; sfx('tick'); }
  });
  const done = () => {
    if (!drag) return;
    drag = null; bar.classList.remove('pulling');
    if (G.power > 0.03) fire();
    G.power = Math.max(G.power, 0.12);
    syncControls();
  };
  bar.addEventListener('pointerup', done);
  bar.addEventListener('pointercancel', done);
})();

/* the spin disc: it is a cue ball, seen from where you are standing */
(function () {
  const d = $('spin');
  let on = false, tapT = 0;
  const set = e => {
    const r = d.getBoundingClientRect();
    const dx = (e.clientX - r.left - r.width / 2) / (r.width / 2 - 6);
    const dy = (e.clientY - r.top - r.height / 2) / (r.height / 2 - 6);
    const m = Math.hypot(dx, dy);
    const k = m > 1 ? 1 / m : 1;
    G.side = clamp(dx * k, -1, 1); G.ver = clamp(-dy * k, -1, 1);
    G.predKey = ''; syncControls();
  };
  d.addEventListener('pointerdown', e => { d.setPointerCapture(e.pointerId); on = true; tapT = performance.now(); set(e); });
  d.addEventListener('pointermove', e => { if (on) set(e); });
  const off = e => {
    if (!on) return; on = false;
    if (performance.now() - tapT < 180 && Math.hypot(G.side, G.ver) < 0.34) { G.side = 0; G.ver = 0; G.predKey = ''; syncControls(); }
  };
  d.addEventListener('pointerup', off);
  d.addEventListener('pointercancel', off);
})();

/* ---------------------------------------------------------------------- sheets */

function openSheet(html, cls) {
  const s = $('sheet');
  s.className = 'sheet' + (cls ? ' ' + cls : '');
  s.innerHTML = '<div class="grab"></div>' + html;
  $('veil').classList.add('on');
}
function closeSheet() { $('veil').classList.remove('on'); }
$('veil').addEventListener('pointerdown', e => { if (e.target === $('veil')) closeSheet(); });

const BOOKS = {
  2:{ name:'Duet', d:'Two balls, two shots' },
  3:{ name:'Trio', d:'Three balls, three shots' },
  4:{ name:'Quartet', d:'Four balls, and no room to waste one' },
};

function sheetStudyDone(inPar) {
  const clean = inPar && !G.hinted;
  openSheet(`
    <div class="sh1">${clean ? 'Cleared, in par' : inPar ? 'Cleared, with a hint' : 'Cleared'}</div>
    <div class="sh2">${BOOKS[G.n].name} №${G.num} — ${G.shots} shot${G.shots === 1 ? '' : 's'}, par ${G.par}.</div>
    ${inPar ? '' : '<p>Par is the shortest line the engine could shoot on this table. It is there, if you want it again.</p>'}
    <div class="rowbtns">
      <button class="pbtn" onclick="nextThing()">Next study</button>
      <button class="pbtn ghost" onclick="replay()">Shoot it again</button>
      <button class="pbtn ghost" onclick="closeSheet();goHome()">Done</button>
    </div>`, clean ? 'win' : '');
}
function sheetNineDone(winner) {

    <div class="sh1">${winner === 0 ? 'You take it' : E.SKILLS[G.skill].name + ' takes it'}</div>
    <div class="sh2">${winner === 0 ? 'The nine went down on a legal shot.' : 'The machine got there first.'}</div>

    <div class="rowbtns">
      <button class="pbtn" onclick="replay()">Rack again</button>
      <button class="pbtn ghost" onclick="closeSheet();goHome()">Done</button>
    </div>`, winner === 0 ? 'win' : '');
}
function sheetRunDone() {
  const rec = G.score >= DB.run.best && G.score > 0;
  openSheet(`
    <div class="sh1">${rec ? 'Best run yet' : 'Out of shots'}</div>
    <div class="sh2">${G.score} ball${G.score === 1 ? '' : 's'} down.</div>
    <div class="stat"><span>Best</span><b>${DB.run.best}</b></div>
    <div class="stat"><span>Runs</span><b>${DB.run.plays}</b></div>
    <div class="rowbtns">
      <button class="pbtn" onclick="replay()">Again</button>
      <button class="pbtn ghost" onclick="closeSheet();goHome()">Done</button>

}
function sheetMenu() {

    ? '<button class="pbtn ghost" onclick="closeSheet();sheetNumbers()">Pick a number</button>' : '';
  openSheet(`
    <div class="sh1">${G.mode === 'study' ? BOOKS[G.n].name + ' №' + G.num : G.mode === 'nine' ? 'Nine-ball' : 'The run'}</div>
    <div class="rowbtns">

}
let numPage = 0;
function sheetNumbers() {
  const rec = DB.study[G.n];
  const per = 25, from = numPage * per + 1;
  let cells = '';
  for (let i = from; i < from + per; i++) {
    const d = rec.done[i];
    cells += `<button class="${d === 2 ? 'done' : ''} ${i === G.num ? 'here' : ''}" onclick="closeSheet();startStudy(${G.n},${i})">${i}${d === 1 ? '·' : ''}</button>`;
  }
  openSheet(`
    <div class="sh1">${BOOKS[G.n].name}</div>
    <div class="sh2">Every number is the same table on every device, forever — the number is the seed.</div>
    <div class="numgrid">${cells}</div>
    <div class="pager">
      <button onclick="numPage=Math.max(0,numPage-1);sheetNumbers()">&#8592;</button>
      <span>${from}–${from + per - 1}</span>

function sheetSkill() {
  const b = (i, d) => `<button class="pbtn ${i === DB.nine.skill ? '' : 'ghost'}" onclick="DB.nine.skill=${i};save();closeSheet();startNine(${i})">${E.SKILLS[i].name} — ${d}</button>`;
  openSheet(`
    <div class="sh1">Nine-ball</div>
    <div class="sh2">Lowest ball first. Anything that falls counts. The nine ends it.</div>
    <div class="rowbtns">${b(0, 'misses like a beginner')}${b(1, 'plays position')}${b(2, 'banks and combos')}</div>`);
}
function sheetHow() {
  openSheet(`
    <div class="sh1">How it works</div>
    <p><b>Aiming.</b> Touch anywhere on the cloth and the cue points from the ball
    through your finger — so the further out you touch, the finer the angle. The
    dashed line and the ring are geometry: the ring is where the cue ball has to be
    for the contact you are asking for, and an object ball always leaves along the
    line joining the two centres. The solid line is not geometry — it is this
    stroke, at this speed, with this spin, run through the physics the table itself
    runs, which is why it stops where the ball stops. Ask for a contact the stroke
    cannot reach and it draws a ring where the cue ball actually dies instead.</p>
    <p><b>The stroke.</b> Pull the bar back and let go. Pull further for more. The
    faint line past the contact is where the cue ball takes itself afterwards —
    that, more than the pot, is what the next shot is made of.</p>
    <p><b>Spin.</b> The white disc is a cue ball seen from behind. Strike it high to
    follow through, low to draw back, off to one side to bend off a cushion. Tap the
    middle to go back to centre ball.</p>
    <p><b>Studies.</b> Clear the table inside par. Every study is built on this device
    and then proved: the engine searches for a line, shoots every shot in it to rest,
    and par is however many that took. It proves them centre-ball, so spin is always
    yours to use and never the answer.</p>
    <p><b>Nine-ball.</b> Hit the lowest ball first. Anything that drops counts, and the
    nine wins. Miss it, scratch, or drive nothing to a cushion and the table goes to
    the other side with the ball in their hand.</p>
    <p><b>The run.</b> Eight shots to start. Every ball down buys another; two in a
    stroke buys three; the ringed pocket pays double. It ends when the shots do.</p>
    <div class="rowbtns"><button class="pbtn" onclick="closeSheet()">Right</button></div>`);
}

/* --------------------------------------------------------------------- home */

function drawMark(cvs, kind) {
  const d = Math.min(window.devicePixelRatio || 1, 2.5);
  const w = cvs.clientWidth || 54, h = cvs.clientHeight || 54;
  cvs.width = w * d; cvs.height = h * d;
  const g = cvs.getContext('2d');
  g.setTransform(d, 0, 0, d, 0, 0);
  g.clearRect(0, 0, w, h);
  const pad = 3, bw = w - pad * 2, bh = bw * 0.5, by = (h - bh) / 2;
  g.fillStyle = C.rail; roundRect(g, pad, by - 3.5, bw, bh + 7, 4); g.fill();
  g.fillStyle = C.bed; g.fillRect(pad + 2.5, by, bw - 5, bh);
  g.fillStyle = C.pocket;
  const px = [pad + 3.5, pad + bw / 2, pad + bw - 3.5], py = [by + 0.5, by + bh - 0.5];
  for (const x of px) for (const y of py) { g.beginPath(); g.arc(x, y, 2.5, 0, TAU); g.fill(); }
  const dot = (fx, fy, col, r) => {
    g.fillStyle = col; g.beginPath(); g.arc(pad + 2.5 + fx * (bw - 5), by + fy * bh, r || 3.1, 0, TAU); g.fill();
    g.lineWidth = 0.9; g.strokeStyle = C.line; g.stroke();
  };
  if (kind === 'study') {
    g.strokeStyle = C.ink; g.globalAlpha = 0.4; g.lineWidth = 0.9; g.setLineDash([2, 2]);
    g.beginPath(); g.moveTo(pad + 2.5 + 0.2 * (bw - 5), by + 0.7 * bh); g.lineTo(pad + 2.5 + 0.62 * (bw - 5), by + 0.32 * bh); g.stroke();
    g.setLineDash([]); g.globalAlpha = 1;
    dot(0.2, 0.7, C.cue); dot(0.68, 0.28, '#ef4a5a');
  } else if (kind === 'nine') {
    dot(0.18, 0.5, C.cue);
    dot(0.62, 0.5, '#f0c33c'); dot(0.76, 0.34, '#3d8bdf'); dot(0.76, 0.66, '#57c268'); dot(0.9, 0.5, '#9b62d6');
  } else {
    dot(0.16, 0.62, C.cue);
    dot(0.5, 0.3, '#3d8bdf'); dot(0.66, 0.66, '#f0902c'); dot(0.84, 0.4, '#57c268');
    g.strokeStyle = C.pw; g.lineWidth = 1.5;
    g.beginPath(); g.arc(pad + bw - 3.5, by + bh - 0.5, 4.2, 0, TAU); g.stroke();
  }
}

/* The launcher mark, drawn by the same routine that draws a ball on the table.
   It is not a picture of a shot — it is one: the ghost sits exactly two radii
   back along the line of centres, so the cue ball, the ghost and the object
   ball are collinear because the arithmetic says so, not because it looked
   right. Exported so the icon files can be rendered from the game itself. */
function drawIcon(g, size, bleed) {
  const U = 68, scale = size / U, keep = V.s;
  V.s = scale;
  g.setTransform(scale, 0, 0, scale, 0, 0);
  g.fillStyle = C.pg;
  if (bleed) g.fillRect(0, 0, U, U); else { roundRect(g, 0, 0, U, U, 14); g.fill(); }
  /* the instant of contact: the two centres are exactly two radii apart, which
     is the only distance at which this picture is true */
  const ang = -0.70;
  const ux = Math.cos(ang), uy = Math.sin(ang);
  const cue = { num:0, x:22.5, y:45.5 };
  const obj = { num:3, x:cue.x + ux * 2 * BR, y:cue.y + uy * 2 * BR };
  g.lineCap = 'round';
  g.strokeStyle = C.ink; g.globalAlpha = 0.42; g.lineWidth = PX(size * 0.03);
  g.setLineDash([PX(size * 0.052), PX(size * 0.05)]);
  g.beginPath(); g.moveTo(cue.x - ux * (BR + 3), cue.y - uy * (BR + 3));
  g.lineTo(cue.x - ux * (BR + 17), cue.y - uy * (BR + 17)); g.stroke();
  g.setLineDash([]);
  /* and the way the object ball has to leave, which is the line of centres */
  g.strokeStyle = C.pa; g.globalAlpha = 0.92; g.lineWidth = PX(size * 0.04);
  g.beginPath(); g.moveTo(obj.x + ux * (BR + 3), obj.y + uy * (BR + 3));
  g.lineTo(obj.x + ux * (BR + 15), obj.y + uy * (BR + 15)); g.stroke();
  g.globalAlpha = 1;
  ballFace(g, cue); ballFace(g, obj);
  V.s = keep;
}
window.CUSHION_MARK = drawIcon;

function buildHome() {
  const list = $('modeList');
  const done = n => Object.keys(DB.study[n].done).length;
  const rows = [
    { k:'study', n:'Studies', d:'Clear the table inside par. Certified, never authored.', c:(done(2) + done(3) + done(4)) + ' done', go:() => showBooks() },
    { k:'nine', n:'Nine-ball', d:'Lowest ball first, against a machine that aims like a person.', c:DB.nine.w + '–' + DB.nine.l, go:() => sheetSkill() },
    { k:'run', n:'The run', d:'Every ball down buys another shot. Keep it going.', c:DB.run.best ? 'best ' + DB.run.best : '', go:() => startRun() },
  ];
  list.innerHTML = rows.map(r => `<button class="mode" data-k="${r.k}"><canvas></canvas><div><div class="n">${r.n}</div><div class="d">${r.d}</div></div><div class="c">${r.c}</div></button>`).join('');
  [...list.children].forEach((el, i) => {
    drawMark(el.querySelector('canvas'), rows[i].k);
    el.addEventListener('click', rows[i].go);
  });
}
function showBooks() {
  const list = $('bookList');
  list.innerHTML = [2, 3, 4].map(n => {
    const rec = DB.study[n], d = Object.keys(rec.done).length;
    return `<button class="book" data-n="${n}"><canvas></canvas><div><div class="n">${BOOKS[n].name}</div><div class="d">${BOOKS[n].d}</div></div><div class="c">${d ? d + ' cleared' : '—'}</div></button>`;
  }).join('');
  [...list.children].forEach(el => {
    const n = +el.dataset.n;
    drawMark(el.querySelector('canvas'), 'study');
    el.addEventListener('click', () => startStudy(n, DB.study[n].at));
  });
  showScreen('books');
}
function goHome() { G.mode = null; G.over = false; G.phase = 'idle'; buildHome(); showScreen('home'); }

/* ------------------------------------------------------------------- chrome */

$('backBtn').addEventListener('click', goHome);
$('booksBack').addEventListener('click', goHome);
$('menuBtn').addEventListener('click', sheetMenu);
$('howBtn').addEventListener('click', sheetHow);
$('fitBtn').addEventListener('click', () => { V.zoom = 1; V.px = 0; V.py = 0; applyZoom(); bakeKey = ''; updateHUD(); });
$('themeBtn').addEventListener('click', () => {
  DB.theme = DB.theme === 'auto' ? 'paper' : DB.theme === 'paper' ? 'slate' : 'auto';
  applyTheme(); save();
  say('Theme: ' + DB.theme);
});
$('soundBtn').addEventListener('click', () => { DB.sound = !DB.sound; muted = !DB.sound; save(); sfx('tick'); say(DB.sound ? 'Sound on' : 'Sound off'); });
$('hintBtn').addEventListener('click', () => {
  if (G.phase !== 'aim' || G.over) return;
  $('hintBtn').textContent = '…';
  const finish = shot => {
    $('hintBtn').textContent = '?';
    if (!shot) { say('Nothing certain from here', true); return; }
    G.hinted = true;
    G.hintShot = shot;
    G.aim = shot.angle; G.power = invPower(shot.power); G.ver = 0; G.side = 0;
    syncControls(); updateHUD();
    say('This one goes');
    G.hintT = setTimeout(() => { G.hintShot = null; G.hintT = 0; }, 5000);
  };
  const anyPot = () => {
    const only = G.mode === 'nine' ? [G.low] : E.objects(G.balls).map(b => b.num);
    const cs = E.candidates(G.balls, { only, banks:true, combos:G.mode === 'nine' });
    for (let i = 0; i < cs.length && i < 20; i++) { const t = E.tryShot(G.balls, cs[i]); if (t) return t.shot; }
    return null;
  };
  if (G.mode === 'study') {
    /* Ask for a line one shot longer than the balls left: from a position the
       player has spoiled, a clean line may no longer exist, and a shot that
       simply drops something is better advice than a shrug. */
    ask({ t:'solve', balls:E.cloneBalls(G.balls), max:objectsLeft() + 1, budget:2400 },
      r => finish((r.line && r.line[0]) || anyPot()), 2900);
  } else {
    finish(anyPot());
  }
});

function applyTheme() {
  const t = DB.theme;
  document.documentElement.dataset.theme = t === 'auto' ? '' : t;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  readTheme();
  bakeKey = '';
  const dark = t === 'slate' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  [...document.querySelectorAll('meta[name="theme-color"]')].forEach(m => { m.media = ''; m.content = dark ? '#191519' : '#ece9e1'; });
  buildHome();
  if ($('books').classList.contains('on')) showBooks();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (DB.theme === 'auto') applyTheme(); });

/* --------------------------------------------------------------------- boot */

load();
readTheme();
startWorker();
applyTheme();
buildHome();
showScreen('home');
resize();
requestAnimationFrame(tick);
for (const n of [2, 3, 4]) prefetch(n, DB.study[n].at);
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
